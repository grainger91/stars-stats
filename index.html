  /* Wasaga Stars colours, taken from the association's logo: Stars green, black, silver, and white. */
  :root {
    --bg: #f3f5f8;
    --panel: #ffffff;
    --ink: #17202b;
    --muted: #5b6878;
    --line: #d8dee6;
    --brand: #111111;        /* top bar: black */
    --brand-ink: #ffffff;
    --stars-green: #00704a;  /* the logo's green, deep enough for white text (6:1) and colourblind-safe beside orange goals */
    --stars-green-dark: #005a3b;
    --stars-green-tint: #e6f3ec;
    --silver: #c3c8ce;
    --accent: var(--stars-green);
    --accent-hover: var(--stars-green-dark);
    --focus-ring: #8fd0ad;
    --heading-font: 'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --danger: #b42318;
    --warn-bg: #fff3d1;
    --warn-ink: #6b4a00;
    --ok-bg: #dcf3e3;
    --ok-ink: #135c2e;
    --error-bg: #fde7e5;
    --radius: 10px;
    /* Chart colours (checked for colourblind safety): our shots on goal (Stars green), goals, and the opponent / missed */
    --shot: var(--stars-green);
    --goal: #eb6834;
    --missed: #808994;
    --marks-dark: #111111;   /* shots and goals drawn on top of green or yellow-to-red heat maps */
  }
  * { box-sizing: border-box; }
  /* iPad: no double-tap zoom delay, no grey flash on tap, and a small press effect instead */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  button, a, label, summary, .game-row, .folder-row { -webkit-tap-highlight-color: transparent; }
  .btn:active, .toggle:active, .jersey-btn:active, .result-btn:active, .step:active, .tabs button:active { transform: scale(.96); }
  .rink { -webkit-touch-callout: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.45;
  }
  button { font-family: inherit; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 8px 20px;
    background: var(--brand); color: var(--brand-ink);
    border-bottom: 4px solid var(--stars-green);
  }
  .brand { display: flex; gap: 12px; align-items: center; margin-right: auto; }
  .brand-name { display: flex; flex-direction: column; line-height: 1.1; }
  #brand-team { font-family: var(--heading-font); font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .brand .season { font-size: 13px; font-weight: 400; color: var(--silver); }
  .live-badge { align-self: center; padding: 3px 9px; border: 1px solid var(--stars-green); border-radius: 999px;
                font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #8fd0ad; }
  .team-logo { display: inline-block; flex: none; background: var(--team-logo) center / contain no-repeat; }
  .topbar .team-logo { width: 54px; height: 45px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    background: transparent; color: inherit; border: 0; border-radius: 8px;
    padding: 10px 18px; font-family: var(--heading-font); font-size: 17px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; opacity: .8;
  }
  .tabs button:hover { opacity: 1; }
  .tabs button[aria-current="page"] { background: var(--stars-green); opacity: 1; }
  .pill { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .pill.neutral { background: rgba(255,255,255,.14); color: #fff; }

  /* Page content */
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  main.wide { max-width: 1180px; }
  h1 { font-family: var(--heading-font); font-size: 30px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 16px; }
  h2, h3, .summary-title, .tile-value, .pct-value, .scoreboard .goals, .report-score .final, .st-result strong {
    font-family: var(--heading-font); font-weight: 600; letter-spacing: .01em;
  }
  .tab-bar button { font-family: var(--heading-font); font-size: 17px !important; font-weight: 500; letter-spacing: .02em; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 19px; margin: 0 0 8px; }
  .card p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .placeholder { text-align: center; padding: 48px 20px; }
  .status-line { font-weight: 600; margin: 8px 0; }
  .status-line.ok { color: var(--ok-ink); }
  .status-line.warn { color: var(--warn-ink); }

  /* Buttons */
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 10px 18px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: #b8c2cf; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger.solid { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Tables */
  table.simple { border-collapse: collapse; width: 100%; margin-top: 8px; }
  table.simple th, table.simple td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.simple th { font-size: 14px; color: var(--muted); font-weight: 600; }
  table.simple td.num, table.simple th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Messages */
  .banner { padding: 12px 20px; font-weight: 600; text-align: center; }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.error { background: var(--error-bg); color: var(--danger); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50;
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 8px;
    font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }

  /* Pop-up dialogs */
  dialog { border: 0; border-radius: 12px; padding: 0; width: calc(100% - 32px); max-width: 540px; box-shadow: 0 20px 50px rgba(0,0,0,.3); color: var(--ink); }
  dialog::backdrop { background: rgba(10,20,35,.5); }
  dialog form { padding: 22px; }
  dialog h2 { margin: 0 0 12px; font-size: 20px; }
  dialog .dialog-body p { margin: 0 0 10px; }
  dialog .dialog-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  dialog input[type="text"] { width: 100%; font-size: 18px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
  dialog .btn.push { margin-right: auto; }
  .dialog-error { color: var(--danger); font-weight: 600; margin: 12px 0 0; }
  .dialog-note { margin-top: 14px !important; }

  /* Form fields */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
  .form-grid.narrow { grid-template-columns: 130px 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field > span:first-child, .field-label { font-size: 14px; font-weight: 600; color: var(--muted); }
  .form-grid .field { margin-bottom: 0; }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
    width: 100%; min-height: 44px; padding: 10px 12px; margin: 0;
    font-size: 16px; font-family: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  textarea { resize: vertical; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .with-unit { display: flex; align-items: center; gap: 10px; }
  .with-unit input { width: 90px; }

  /* Choice buttons (pick one) */
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: flex-start; }
  .seg label { position: relative; }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; min-width: 56px; padding: 10px 18px; text-align: center; font-weight: 600; border-left: 1px solid var(--line); background: #fff; }
  .seg label:first-child span { border-left: 0; }
  .seg input:checked + span { background: var(--accent); color: #fff; }
  .seg input:focus-visible + span { outline: 3px solid var(--focus-ring); outline-offset: -3px; }

  /* Roster and opponents lists */
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .card-head h2 { margin: 0; }
  .summary { margin: 4px 0 0; }
  .group-label { margin: 18px 0 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  table.list { table-layout: fixed; }
  table.list td { vertical-align: middle; }
  table.list .jersey { width: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table.list .detail { width: 150px; }
  table.list .edit { width: 90px; text-align: right; }
  .btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  details.inactive { margin-top: 18px; }
  details.inactive summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 6px 0; }
  .empty { padding: 12px 0 4px; }

  /* Screen titles and back links */
  .back { display: inline-block; margin-bottom: 6px; padding: 6px 0; color: var(--accent); font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .title-row h1 { margin: 0 0 2px; }
  .subtitle { margin: 0; }
  .hint { font-size: 13px; color: var(--muted); }
  .linklike { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
  .notice { margin: 14px 0 0 !important; padding: 10px 14px; border-radius: 8px; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-ink); }

  /* Game and tournament lists */
  .game-list, .folder-list { display: flex; flex-direction: column; margin-top: 4px; }
  .game-row, .folder-row {
    display: grid; align-items: center; gap: 6px 14px; width: 100%;
    padding: 12px 8px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: #fff; color: inherit; font-size: 16px; text-align: left; cursor: pointer;
  }
  .game-row:hover, .folder-row:hover { background: #f6f8fb; }
  .game-row { grid-template-columns: 170px 1fr auto auto; grid-template-areas: "when who flags outcome"; }
  .game-row .when { grid-area: when; display: flex; flex-direction: column; line-height: 1.3; }
  .game-row .when .muted { font-size: 14px; }
  .game-row .who { grid-area: who; font-weight: 600; }
  .game-row .flags { grid-area: flags; }
  .game-row .outcome { grid-area: outcome; }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .outcome { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .score { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #eef1f5; color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .tag.grade-a { background: var(--stars-green-tint); color: var(--stars-green-dark); }
  .tag.grade-a-attempt { background: #fff; color: var(--stars-green-dark); border: 1px solid #a9dcc1; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .badge.win { background: var(--ok-bg); color: var(--ok-ink); }
  .badge.loss { background: var(--error-bg); color: var(--danger); }
  .badge.tie { background: #eef1f5; color: var(--ink); }
  .folder-row { grid-template-columns: 34px 1fr auto auto 14px; grid-template-areas: "icon main meta flags chev"; }
  .folder-icon { grid-area: icon; color: #e0a526; }
  .folder-icon svg { display: block; width: 30px; height: 30px; }
  .folder-main { grid-area: main; display: flex; flex-direction: column; line-height: 1.35; }
  .folder-meta { grid-area: meta; }
  .folder-row .flags { grid-area: flags; }
  .chev { grid-area: chev; font-size: 24px; line-height: 1; color: var(--muted); }
  .facts { display: flex; gap: 36px; flex-wrap: wrap; }
  .fact-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }

  /* One game */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px 16px; text-align: center; }
  .scoreboard .side { display: flex; flex-direction: column; gap: 2px; }
  .scoreboard .team-name { font-weight: 600; color: var(--muted); }
  .scoreboard .goals { font-size: 46px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .scoreboard .dash { font-size: 32px; color: var(--muted); }
  .scoreboard .dash:only-child, .scoreboard .side:not(:has(.goals)) + .dash { font-size: 16px; }
  .scoreboard-foot { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .score-inputs { display: flex; align-items: center; gap: 10px; }
  .score-inputs input { width: 80px; }
  .switch-block { padding: 14px 0; border-top: 1px solid var(--line); margin-top: 16px; }
  .switch-block + .switch-block { margin-top: 0; }
  .switch { display: inline-flex; align-items: center; gap: 12px; position: relative; font-weight: 600; cursor: pointer; }
  .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .switch-track { position: relative; flex: none; width: 48px; height: 28px; border-radius: 999px; background: #c5cdd8; transition: background .15s; }
  .switch-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::after { transform: translateX(20px); }
  .switch input:focus-visible + .switch-track { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
  .sub-fields { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 14px; padding-left: 60px; }
  .sub-fields .field { max-width: 340px; }
  .minutes-line { margin: 0 !important; padding-top: 14px; border-top: 1px solid var(--line); }

  /* Game details (folds away) and tabs */
  details.details-card > summary { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; list-style: none; cursor: pointer; }
  details.details-card > summary::-webkit-details-marker { display: none; }
  details.details-card > summary::after { content: 'Show'; margin-left: auto; color: var(--accent); font-weight: 600; }
  details.details-card[open] > summary::after { content: 'Hide'; }
  .summary-title { font-size: 19px; font-weight: 700; }
  .details-body { margin-top: 16px; }
  .section-title { font-size: 17px; margin: 24px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  .tab-bar { display: flex; flex-wrap: wrap; gap: 4px; margin: 22px 0 16px; border-bottom: 2px solid var(--line); }
  .tab-bar button { margin-bottom: -2px; padding: 12px 16px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font-size: 16px; font-weight: 600; cursor: pointer; }
  .tab-bar button.on { color: var(--accent); border-bottom-color: var(--accent); }

  /* Shot entry */
  .entry-controls { display: flex; flex-wrap: wrap; gap: 14px 28px; }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .toggle-group { display: inline-flex; flex-wrap: wrap; align-self: flex-start; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle { min-height: 44px; min-width: 48px; padding: 10px 16px; border: 0; border-left: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
  .toggle:first-child { border-left: 0; }
  .toggle:hover { background: #f1f4f8; }
  .toggle.on { background: var(--accent); color: #fff; }
  .team-toggle .toggle.on { background: var(--brand); }
  .entry-card > .hint { display: block; margin-top: 10px; }
  .entry-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); gap: 22px; align-items: start; margin-top: 16px; }
  .entry-panel { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfd; }
  .entry-panel h3 { margin: 0 0 6px; font-size: 18px; }
  .entry-panel p { margin: 0 0 8px; }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .undo-box { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .undo-box .btn { align-self: flex-start; }
  .jersey-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; margin-top: 10px; }
  .jersey-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; }
  .jersey-btn:hover { border-color: var(--accent); background: var(--stars-green-tint); }
  .jersey-btn strong { font-size: 22px; line-height: 1.1; }
  .jersey-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
  .result-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .result-btn { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 18px; font-weight: 700; text-align: left; cursor: pointer; }
  .result-btn:hover { border-color: var(--accent); background: var(--stars-green-tint); }
  .result-btn .glyph { width: 38px; height: 38px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .glyph { width: 22px; height: 22px; }
  .glyph { display: inline-block; flex: none; vertical-align: middle; }
  .result-cell { display: inline-flex; align-items: center; gap: 8px; }
  .result-cell .glyph { width: 22px; height: 22px; }
  .table-scroll { overflow-x: auto; }
  .shot-table { table-layout: fixed; min-width: 860px; }   /* set widths, so columns don't shift as shots are added */
  .shot-table td, .shot-table th { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot-table td.row-actions { overflow: visible; }
  .row-actions { text-align: right; }
  .row-actions .btn + .btn { margin-left: 6px; }
  table.tally th.num { font-size: 13px; }

  /* Faceoffs */
  .team-faceoffs { margin: 0; }
  /* Set column widths, so the columns never shift as the numbers change */
  .faceoff-table { table-layout: fixed; min-width: 600px; }
  .faceoff-table .fo-count-col { width: 180px; }
  .faceoff-table .fo-won-col { width: 150px; }
  .faceoff-table td { vertical-align: middle; }
  .faceoff-table td:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .faceoff-table .group-row th { padding-top: 16px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .faceoff-table tr.has-faceoffs td:first-child { font-weight: 600; }
  .jersey-inline { display: inline-block; min-width: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .counter { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .counter .step { width: 44px; height: 44px; border: 0; background: #f1f4f8; color: var(--ink); font-size: 22px; font-weight: 700; cursor: pointer; }
  .counter .step:hover:not(:disabled) { background: #e2e8f0; }
  .counter .step:disabled { color: #b3bcc8; cursor: default; }
  .counter input { width: 56px; min-height: 44px; border: 0; border-radius: 0; text-align: center; font-size: 18px; font-weight: 700; -moz-appearance: textfield; }
  .counter input::-webkit-inner-spin-button, .counter input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .fo-pct { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Power play and penalty kill entry */
  .st-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  .st-box { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfd; }
  .st-box h3 { margin: 0 0 12px; font-size: 18px; }
  .st-fields { display: flex; flex-wrap: wrap; gap: 12px 24px; }
  .st-field { margin-bottom: 0; }
  .st-field .counter { align-self: flex-start; }
  .st-result { margin: 14px 0 0; font-size: 17px; }
  .st-note { font-size: 14px; }
  .counter input::placeholder { color: #b3bcc8; }
  @media (max-width: 760px) { .st-grid { grid-template-columns: 1fr; } }

  /* Power play % and penalty kill % (stats) */
  .pct-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 6px 0 12px; }
  .pct-panel { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfd; }
  .pct-label { font-size: 15px; font-weight: 700; color: var(--muted); }
  .pct-value { font-size: 56px; font-weight: 700; line-height: 1.05; }
  .pct-detail { font-size: 16px; color: var(--ink); }
  /* Meter: the fill is the percentage; the track is a lighter step of the same blue. */
  .meter { height: 14px; margin: 8px 0 4px; border-radius: 7px; background: #d4eee0; overflow: hidden; }   /* track: a lighter step of the fill's green */
  .meter span { display: block; height: 100%; border-radius: 7px; background: var(--shot); }
  .pct-table { table-layout: fixed; min-width: 520px; }
  .view-section-title { font-size: 20px; margin: 26px 0 4px; }
  @media (max-width: 760px) { .pct-panels, .sheet-columns { grid-template-columns: 1fr; } }

  /* Game sheet */

<script>
'use strict';

/* =========================================================
   HOCKEY STATS: single-file app
   Sections in this script:
     1. Constants and defaults
     2. Storage (the browser's built-in database)
     3. Backup and restore
     4. Calculations (numbers worked out from the records, never stored)
     5. Small helpers (dates, text, pop-ups)
     6. Screens
     7. Start-up
   ========================================================= */


/* ---------------------------------------------------------
   1. CONSTANTS AND DEFAULTS
   --------------------------------------------------------- */

/*
  LIVE VERSION (for entering stats on the iPad during games). A separate copy of hockey-stats.html.
  It uses its OWN database and settings names, so even when opened on the same computer it can never read or
  change the original app's data. APP_ID is the same, so backup files work in both versions.
*/
const APP_ID = 'coach-hockey-stats';        // Marks backup files as ours (shared with the original, on purpose)
const DB_NAME = 'coach-hockey-stats-live';  // Name of the browser database (different from the original)
const STORAGE_PREFIX = 'coach-hockey-stats-live';  // Remembered choices (filters, report options) and the tab channel
const APP_VERSION = '2026-10-05.1';  // Shown on the Setup screen. Keep in step with sw.js.
const DB_VERSION = 1;                  // Bump when the database layout changes
const BACKUP_FORMAT = 1;               // Bump when the backup file layout changes

// One "drawer" per kind of record. All of these go into backups.
const DATA_STORES = ['settings', 'players', 'opponents', 'tournaments', 'games',
                     'shots', 'faceoffs', 'penaltyShots', 'shootoutAttempts'];
// Everything except settings is a list of records.
const LIST_STORES = DATA_STORES.filter(name => name !== 'settings');

const STORE_LABELS = {
  players: 'Players', opponents: 'Opponents', tournaments: 'Tournaments', games: 'Games',
  shots: 'Shots', faceoffs: 'Faceoffs', penaltyShots: 'Penalty shots', shootoutAttempts: 'Shootout attempts',
};

// Clock types: stop time, running time, mixed, not yet known
const CLOCK_TYPES = { stop: 'Stop time', running: 'Running time', mixed: 'Mixed', unknown: 'Not yet known' };

const POSITIONS = { F: 'Forward', D: 'Defence', G: 'Goalie' };
const POSITION_GROUPS = { F: 'Forwards', D: 'Defence', G: 'Goalies' };
const SHOOTS = { L: 'Left', R: 'Right' };

const DEFAULT_OVERTIME_LENGTH = 5;

// Game results. Overtime and shootout wins count as wins in a record; the same for losses.
const RESULTS = {
  W: 'Win', L: 'Loss', T: 'Tie',
  OTW: 'Overtime win', OTL: 'Overtime loss',
  SOW: 'Shootout win', SOL: 'Shootout loss',
};
const PERIODS = [1, 2, 3, 'OT'];
const periodLabel = (period) => period === 'OT' ? 'Overtime' : `Period ${period}`;
// Always from our team's point of view.
const SITUATIONS = { even: 'Even strength', pp: 'Power play', pk: 'Penalty kill' };
const SHOT_RESULTS = { onNet: 'On net', goal: 'Goal', missedBlocked: 'Missed or blocked' };

const WIN_RESULTS = ['W', 'OTW', 'SOW'];
const LOSS_RESULTS = ['L', 'OTL', 'SOL'];

const DEFAULT_SETTINGS = { id: 'team', teamName: '', seasonLabel: '', periodLength: 15, clockType: 'stop' };

// App bookkeeping. Kept in its own drawer and NOT included in backups.
const DEFAULT_META = { id: 'app', lastBackupAt: null, lastChangeAt: null };

/*
  Record shapes (for reference; later phases fill these in through the screens).
  Every record has a permanent "id". Records point to each other by id.

  settings:         { id:'team', teamName, seasonLabel, periodLength, clockType }
  players:          { id, name, number (text, '0' to '99' or '00'), position:'F'|'D'|'G', shoots:'L'|'R', active }
  opponents:        { id, name, active }
  tournaments:      { id, name, location, startDate, periodLength, clockType }
  games:            { id, date:'YYYY-MM-DD', time:'HH:MM', opponentId, type:'regular'|'tournament',
                      tournamentId, periodLength (null = inherit), clockType (null = inherit),
                      overtime:{ on, length, played }, shootout, result (null = automatic),
                      officialScore:{ us, them } or null, notes, shootoutFirst:'us'|'them',
                      specialTeams:{ ppOpportunities, ppGoals, pkTimes, pkGoalsAgainst } (each a number, or null = not entered),
                      gameSheet:{ goals, penalties } (see "Game sheet" below) }
  shots:            { id, gameId, team:'us'|'them', period:1|2|3|'OT', x, y (0 to 1, or null if location unknown),
                      result:'onNet'|'goal'|'missedBlocked', shooterId (or null), situation:'even'|'pp'|'pk', createdAt }
                    (Grade A is worked out from x, y and result by inGradeAArea / isGradeAShot; it isn't stored.)
  faceoffs:         { id, gameId, playerId, result:'win'|'loss', createdAt }      (one record per faceoff; no period or zone)
  penaltyShots:     { id, gameId, period, team, shooterId, opponentNumber, result:'goal'|'saved'|'missed', createdAt }
  shootoutAttempts: { id, gameId, round, team, shooterId, opponentNumber, result:'goal'|'saved'|'missed', createdAt }
*/

// Everything the app knows, held in memory while the page is open.
const state = {
  db: null,
  settings: { ...DEFAULT_SETTINGS },
  meta: { ...DEFAULT_META },
  screen: null,        // Which screen is showing: games, tournament, game, stats, setup
  routeId: null,       // The tournament or game being shown, if any
  scrollTarget: null,  // Part of the page to scroll to after the screen changes
  entry: null,         // What the game screen remembers while entering a game (see freshEntryState)
  filters: null,       // Stats filters (see DEFAULT_FILTERS), remembered in this browser
  statsView: null,     // Which stats view is showing
  faceoffSort: null,   // Faceoff table sort: { key, dir }
  storageProtected: undefined,  // undefined = still checking
};
for (const name of LIST_STORES) state[name] = [];


/* ---------------------------------------------------------
   2. STORAGE
   The only code that reads or writes the browser database.
   Everything is loaded into memory at start-up; every change
   is written straight away (there is no Save button).
   --------------------------------------------------------- */

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (event) => {
      const db = request.result;
      // Version 1: create every drawer.
      if (event.oldVersion < 1) {
        for (const name of DATA_STORES) db.createObjectStore(name, { keyPath: 'id' });
        db.createObjectStore('meta', { keyPath: 'id' });
      }
      // Future layout changes go here as "if (event.oldVersion < 2) { ... }".
    };
    request.onsuccess = () => {
      const db = request.result;
      db.onversionchange = () => {
        db.close();
        showBanner('A newer copy of Hockey Stats was opened in another tab. Please close this tab.', 'error');
      };
      resolve(db);
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => showBanner('Please close any other tabs with Hockey Stats open, then reload this page.', 'error');
  });
}

function requestDone(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function transactionDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('The save was cancelled.'));
  });
}

async function loadEverything() {
  const names = [...DATA_STORES, 'meta'];
  const tx = state.db.transaction(names, 'readonly');
  const results = {};
  await Promise.all(names.map(async (name) => {
    results[name] = await requestDone(tx.objectStore(name).getAll());
  }));
  state.settings = { ...DEFAULT_SETTINGS, ...(results.settings.find(r => r.id === 'team') || {}) };
  state.meta = { ...DEFAULT_META, ...(results.meta.find(r => r.id === 'app') || {}) };
  for (const name of LIST_STORES) state[name] = results[name];
}

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

/*
  Save a group of changes all at once: either every change is saved or none are.
  Each change is { store, put: record } or { store, remove: id }.
  Used directly for things like "delete a tournament and all its games".
*/
async function saveChanges(changes) {
  const storeNames = [...new Set(changes.map(c => c.store)), 'meta'];
  const now = new Date().toISOString();
  const tx = state.db.transaction(storeNames, 'readwrite');
  for (const change of changes) {
    const store = tx.objectStore(change.store);
    if (change.put) {
      if (change.put.id == null) change.put.id = newId();
      store.put(change.put);
    } else {
      store.delete(change.remove);
    }
  }
  const newMeta = { ...state.meta, lastChangeAt: now };
  tx.objectStore('meta').put(newMeta);

  try {
    await transactionDone(tx);
  } catch (err) {
    console.error(err);
    showBanner('Something went wrong and that change was NOT saved. Please download a backup, then reload the page.', 'error');
    throw err;
  }

  // Only update memory once the browser confirms the save.
  for (const change of changes) {
    if (change.store === 'settings') {
      if (change.put) state.settings = { ...DEFAULT_SETTINGS, ...change.put };
      continue;
    }
    const list = state[change.store];
    if (change.put) {
      const index = list.findIndex(r => r.id === change.put.id);
      if (index >= 0) list[index] = change.put; else list.push(change.put);
    } else {
      const index = list.findIndex(r => r.id === change.remove);
      if (index >= 0) list.splice(index, 1);
    }
  }
  state.meta = newMeta;
  tellOtherTabs('changed');
  updateHeader();
}

const saveRecord = (store, record) => saveChanges([{ store, put: record }]);
const deleteRecord = (store, id) => saveChanges([{ store, remove: id }]);

async function saveMeta(updates) {
  const newMeta = { ...state.meta, ...updates };
  const tx = state.db.transaction(['meta'], 'readwrite');
  tx.objectStore('meta').put(newMeta);
  await transactionDone(tx);
  state.meta = newMeta;
  updateHeader();
}

// Wipe every drawer and fill it from "data" (used by restore and by erase).
async function replaceAllData(data, metaUpdates) {
  const tx = state.db.transaction([...DATA_STORES, 'meta'], 'readwrite');
  for (const name of DATA_STORES) tx.objectStore(name).clear();
  tx.objectStore('settings').put({ ...DEFAULT_SETTINGS, ...data.settings, id: 'team' });
  for (const name of LIST_STORES) {
    const store = tx.objectStore(name);
    for (const record of data[name]) store.put(record);
  }
  const newMeta = { ...DEFAULT_META, ...metaUpdates };
  tx.objectStore('meta').put(newMeta);
  await transactionDone(tx);
  await loadEverything();
  tellOtherTabs('changed');
}

function recordCounts() {
  const counts = {};
  for (const name of LIST_STORES) counts[name] = state[name].length;
  return counts;
}

function hasAnyData() {
  return LIST_STORES.some(name => state[name].length > 0) ||
         state.settings.teamName !== '' || state.settings.seasonLabel !== '';
}

// Ask Chrome to protect this data from automatic clean-up when the computer is low on space.
async function checkStorageProtection() {
  if (!navigator.storage || !navigator.storage.persist) return null;
  try {
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (err) {
    return null;
  }
}

// Warn if the app is open in two tabs at once, since each tab keeps its own copy in memory.
const tabChannel = ('BroadcastChannel' in window) ? new BroadcastChannel(STORAGE_PREFIX) : null;
function tellOtherTabs(message) { if (tabChannel) tabChannel.postMessage(message); }
if (tabChannel) {
  tabChannel.onmessage = (event) => {
    if (event.data === 'hello') tellOtherTabs('here');
    if (event.data === 'hello' || event.data === 'here') {
      showBanner('Hockey Stats is open in more than one tab. Please use just one tab so changes don’t get mixed up.', 'warn');
    }
    if (event.data === 'changed') {
      showBanner('Changes were made in another tab. Reload this page to see them before making more changes here.', 'warn');
    }
  };
}


/* ---------------------------------------------------------
   3. BACKUP AND RESTORE
   A backup is one file containing every record.
   It is separate from the spreadsheet export.
   --------------------------------------------------------- */

function buildBackup() {
  const data = { settings: state.settings };
  for (const name of LIST_STORES) data[name] = state[name];
  return {
    app: APP_ID,
    formatVersion: BACKUP_FORMAT,
    savedAt: new Date().toISOString(),
    teamName: state.settings.teamName,
    seasonLabel: state.settings.seasonLabel,
    data,
  };
}

function fileTimeStamp(date = new Date()) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}`;
}

function downloadFile(fileName, contents, type) {
  const blob = new Blob([contents], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/*
  Saving a file. On the iPad (a touch screen that can share files) it goes to the Share sheet, where the coach
  chooses "Save to Files" or AirDrops it to the Mac. A plain download inside a Home Screen app can open the file
  full screen with no way back. On a computer it downloads as before.
  Returns false if the coach cancelled the Share sheet.
*/
const usesShareSheet = () => navigator.maxTouchPoints > 1 && typeof navigator.canShare === 'function';

async function saveFile(fileName, contents, type) {
  if (usesShareSheet()) {
    const file = new File([contents], fileName, { type });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        return true;
      } catch (err) {
        if (err.name === 'AbortError') return false;   // cancelled
        console.warn('Share sheet failed, downloading instead', err);
      }
    }
  }
  downloadFile(fileName, contents, type);
  return true;
}

async function downloadBackup() {
  const backup = buildBackup();
  const saved = await saveFile(`hockey-stats-backup_${fileTimeStamp()}.json`, JSON.stringify(backup, null, 1), 'application/json');
  if (!saved) { showToast('Backup not saved.'); return; }
  await saveMeta({ lastBackupAt: backup.savedAt });
  render();
  showToast(usesShareSheet() ? 'Backup saved.' : 'Backup downloaded. Check your Downloads folder.');
}

// A copy of what's in the app right now, saved before restore or erase. Returns false if it wasn't saved.
function downloadSafetyCopy() {
  return saveFile(`hockey-stats-safety-copy_${fileTimeStamp()}.json`, JSON.stringify(buildBackup(), null, 1), 'application/json');
}

// If the coach cancels saving the safety copy, ask before going ahead without one.
async function safetyCopyOrConfirm() {
  if (!hasAnyData() || await downloadSafetyCopy()) return true;
  return await confirmDialog('Safety copy not saved', 'The safety copy of your current data wasn’t saved. Go ahead anyway?', 'Go ahead') === true;
}

/*
  Check a backup file before using it. Returns a clean copy of its data,
  or throws an error with a plain-language message.
*/
function checkBackup(backup) {
  if (!backup || typeof backup !== 'object' || backup.app !== APP_ID) {
    throw new Error('This file isn’t a Hockey Stats backup.');
  }
  if (typeof backup.formatVersion !== 'number' || backup.formatVersion < 1) {
    throw new Error('This backup file is damaged (its version number is missing).');
  }
  if (backup.formatVersion > BACKUP_FORMAT) {
    throw new Error('This backup was made by a newer version of Hockey Stats. Please use the newer version of the app to restore it.');
  }
  if (!backup.data || typeof backup.data !== 'object') {
    throw new Error('This backup file is damaged (it has no data in it).');
  }

  const data = {};
  const settings = backup.data.settings;
  if (settings != null && typeof settings !== 'object') {
    throw new Error('This backup file is damaged (problem in Team settings).');
  }
  data.settings = { ...DEFAULT_SETTINGS, ...(settings || {}), id: 'team' };

  for (const name of LIST_STORES) {
    const list = backup.data[name] == null ? [] : backup.data[name];
    const isValid = Array.isArray(list) &&
      list.every(r => r && typeof r === 'object' && (typeof r.id === 'string' || typeof r.id === 'number'));
    if (!isValid) throw new Error(`This backup file is damaged (problem in ${STORE_LABELS[name]}).`);
    const ids = new Set(list.map(r => r.id));
    if (ids.size !== list.length) throw new Error(`This backup file is damaged (repeated records in ${STORE_LABELS[name]}).`);
    data[name] = list;
  }

  return upgradeBackupData(backup.formatVersion, data);
}

// When the backup layout changes in future, older backups are brought up to date here.
function upgradeBackupData(formatVersion, data) {
  // Example for later: if (formatVersion < 2) { ...adjust data... }
  return data;
}

async function readBackupFile(file) {
  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch (err) {
    throw new Error('This file couldn’t be read. It may be damaged, or it may not be a Hockey Stats backup.');
  }
  return { backup: parsed, data: checkBackup(parsed) };
}

async function startRestore(file) {
  let result;
  try {
    result = await readBackupFile(file);
  } catch (err) {
    await showMessage('Can’t restore this file', err.message);
    return;
  }
  const { backup, data } = result;
  const currentCounts = recordCounts();
  const rows = LIST_STORES.map(name =>
    `<tr><td>${STORE_LABELS[name]}</td><td class="num">${data[name].length}</td><td class="num">${currentCounts[name]}</td></tr>`).join('');
  const teamLine = [data.settings.teamName, data.settings.seasonLabel].filter(Boolean).join(', ');

  const confirmed = await showDialog({
    title: 'Restore this backup?',
    body: `
      <p>This backup was saved <strong>${escapeHtml(formatDateTime(backup.savedAt) || 'at an unknown time')}</strong>${teamLine ? ` for <strong>${escapeHtml(teamLine)}</strong>` : ''}.</p>
      <table class="simple small">
        <tr><th></th><th class="num">In the backup</th><th class="num">In the app now</th></tr>
        ${rows}
      </table>
      <p style="margin-top:14px"><strong>Everything currently in the app will be replaced.</strong>
      ${hasAnyData() ? 'A safety copy of what’s there now will download first, just in case.' : ''}</p>`,
    buttons: [{ label: 'Cancel', value: false }, { label: 'Replace my data', value: true, kind: 'danger solid' }],
  });
  if (!confirmed) return;

  try {
    if (!await safetyCopyOrConfirm()) return;
    const now = new Date().toISOString();
    // The app now matches a backup file exactly, so it counts as backed up.
    await replaceAllData(data, { lastBackupAt: now, lastChangeAt: now });
  } catch (err) {
    console.error(err);
    showBanner('The restore didn’t finish. Your safety copy is in your Downloads folder. Please reload the page and try again.', 'error');
    return;
  }
  render();
  showToast('Backup restored.');
}

async function startErase() {
  const confirmed = await showDialog({
    title: 'Erase all data?',
    body: `<p>This removes every player, opponent, tournament, game, and stat from this browser.
           A safety copy will download first.</p>
           <p>To confirm, type <strong>ERASE</strong> below.</p>`,
    requireText: 'ERASE',
    buttons: [{ label: 'Cancel', value: false }, { label: 'Erase everything', value: true, kind: 'danger solid', needsText: true, isDefault: true }],
  });
  if (!confirmed) return;
  if (!await safetyCopyOrConfirm()) return;
  const empty = { settings: { ...DEFAULT_SETTINGS } };
  for (const name of LIST_STORES) empty[name] = [];
  await replaceAllData(empty, {});
  render();
  showToast('All data erased. The safety copy is in your Downloads folder.');
}

/* ---------------------------------------------------------
   4. CALCULATIONS
   Numbers worked out from the records. Nothing here is stored.
   --------------------------------------------------------- */

// "Standard game" = 3 regular season periods. Rate stats are "per" this many minutes.
function standardGameMinutes() {
  return 3 * state.settings.periodLength;
}

function ourTeamName() {
  return state.settings.teamName || 'Our team';
}

// Jersey order: 0, 00, 1, 2 ... 99, then by name.
function sortByNumber(players) {
  return [...players].sort((a, b) =>
    Number(a.number) - Number(b.number) || a.number.length - b.number.length || a.name.localeCompare(b.name));
}

function playerHasStats(playerId) {
  return state.shots.some(r => r.shooterId === playerId) ||
         state.faceoffs.some(r => r.playerId === playerId) ||
         state.penaltyShots.some(r => r.shooterId === playerId) ||
         state.shootoutAttempts.some(r => r.shooterId === playerId) ||
         playerOnAnySheet(playerId);
}

function opponentHasGames(opponentId) {
  return state.games.some(g => g.opponentId === opponentId);
}

const findGame = (id) => state.games.find(g => g.id === id);
const findTournament = (id) => state.tournaments.find(t => t.id === id);
const findOpponent = (id) => state.opponents.find(o => o.id === id);
const byName = (a, b) => a.name.localeCompare(b.name);

function opponentName(game) {
  const opponent = findOpponent(game.opponentId);
  return opponent ? opponent.name : 'Unknown opponent';
}

// What a game follows when its period length or clock hasn't been changed for that game.
function inheritedSettings(game) {
  const tournament = game.type === 'tournament' ? findTournament(game.tournamentId) : null;
  if (tournament) {
    return { periodLength: tournament.periodLength, clockType: tournament.clockType, source: 'the tournament setting' };
  }
  return { periodLength: state.settings.periodLength, clockType: state.settings.clockType, source: 'the regular season setting' };
}

const gamePeriodLength = (game) => game.periodLength ?? inheritedSettings(game).periodLength;
const gameClockType = (game) => game.clockType ?? inheritedSettings(game).clockType;

// Minutes played = 3 periods + overtime minutes actually played. Shootouts add nothing.
function gameMinutesPlayed(game) {
  return 3 * gamePeriodLength(game) + (game.overtime.on ? game.overtime.played : 0);
}

function gameStatCounts(gameId) {
  const count = (list) => list.filter(r => r.gameId === gameId).length;
  return { shots: count(state.shots), faceoffs: count(state.faceoffs),
           penaltyShots: count(state.penaltyShots), shootoutAttempts: count(state.shootoutAttempts) };
}

function gameHasStats(gameId) {
  return state.shots.some(r => r.gameId === gameId) || state.faceoffs.some(r => r.gameId === gameId) ||
         state.penaltyShots.some(r => r.gameId === gameId) || state.shootoutAttempts.some(r => r.gameId === gameId);
}

// Score = goals from regular shots plus penalty shot goals. Shootout goals are kept separate.
function gameScore(game) {
  const goals = (team) =>
    state.shots.filter(r => r.gameId === game.id && r.team === team && r.result === 'goal').length +
    state.penaltyShots.filter(r => r.gameId === game.id && r.team === team && r.result === 'goal').length;
  return { us: goals('us'), them: goals('them') };
}

function shootoutScore(game) {
  const goals = (team) => state.shootoutAttempts.filter(r => r.gameId === game.id && r.team === team && r.result === 'goal').length;
  return { us: goals('us'), them: goals('them') };
}

// The result worked out from the goals, or null if it can't be worked out yet.
function automaticResult(game) {
  if (!gameHasStats(game.id)) return null;
  const score = gameScore(game);
  if (score.us !== score.them) {
    // A game only goes to overtime when tied, so a different score with overtime on means it was decided in overtime.
    if (game.overtime.on) return score.us > score.them ? 'OTW' : 'OTL';
    return score.us > score.them ? 'W' : 'L';
  }
  if (game.shootout) {
    const shootout = shootoutScore(game);
    if (shootout.us > shootout.them) return 'SOW';
    if (shootout.us < shootout.them) return 'SOL';
    return null;
  }
  return 'T';
}

const gameResult = (game) => game.result || automaticResult(game);

// "3–2", or "3–3, won in shootout"
function scoreText(game) {
  const score = gameScore(game);
  let text = `${score.us}–${score.them}`;
  const result = gameResult(game);
  if (result === 'SOW') text += ', won in shootout';
  if (result === 'SOL') text += ', lost in shootout';
  return text;
}

// When the official final score is filled in and the recorded goals don't add up to it.
function officialScoreMismatch(game) {
  const official = game.officialScore;
  if (!official || official.us == null || official.them == null || !gameHasStats(game.id)) return null;
  const recorded = gameScore(game);
  if (recorded.us === official.us && recorded.them === official.them) return null;
  return { recorded, official };
}

function gameStart(game) {
  const [year, month, day] = game.date.split('-').map(Number);
  // No time entered: treat it as late in the day, so it stays "upcoming" until the day is over.
  const [hours, minutes] = game.time ? game.time.split(':').map(Number) : [23, 59];
  return new Date(year, month - 1, day, hours, minutes);
}

// Upcoming = no stats, no result set by hand, and the start time hasn't passed.
function isUpcoming(game) {
  return !gameHasStats(game.id) && !game.result && gameStart(game) > new Date();
}

// Oldest first. Games with no time go last on their day.
function compareGames(a, b) {
  return (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99'));
}

function tournamentGames(tournamentId) {
  return state.games.filter(g => g.type === 'tournament' && g.tournamentId === tournamentId).sort(compareGames);
}

// Tournaments sort by start date, or by their first game if there's no start date.
function tournamentDate(tournament) {
  const games = tournamentGames(tournament.id);
  return tournament.startDate || (games[0] && games[0].date) || '';
}

/*
  Stats filters. One set of filters is shared by every stats view.
    games:     'all' | 'regular' | 'tournaments' | 't:<tournament id>' | 'g:<game id>'
    situation: 'all' | 'even' | 'pp' | 'pk'
    period:    'all' | 1 | 2 | 3 | 'OT'
    team:      'us' | 'them' | 'both' (side by side)
  Shot map extras: player ('all' or a player id), shotsShown ('onGoal' | 'all'), gradeAOnly, display ('heat' | 'dots' | 'both'),
                   heatColours ('green' | 'blue' | 'warm')
*/
const DEFAULT_FILTERS = {
  games: 'all', situation: 'all', period: 'all', team: 'us',
  player: 'all', shotsShown: 'onGoal', gradeAOnly: false, display: 'both', heatColours: 'green',
};

// Only games with stats entered count (upcoming games and games not entered yet would drag rates down).
function filteredGames(filters) {
  const played = state.games.filter(g => gameHasStats(g.id));
  const f = filters.games;
  if (f === 'regular') return played.filter(g => g.type === 'regular');
  if (f === 'tournaments') return played.filter(g => g.type === 'tournament');
  if (f.startsWith('t:')) return played.filter(g => g.type === 'tournament' && g.tournamentId === f.slice(2));
  if (f.startsWith('g:')) return played.filter(g => g.id === f.slice(2));
  return played;
}

// Regular shots (never penalty shots or shootout attempts) matching the filters, for one team.
function filteredShots(filters, games, team) {
  const ids = new Set(games.map(g => g.id));
  return state.shots.filter(s =>
    ids.has(s.gameId) && s.team === team &&
    (filters.situation === 'all' || s.situation === filters.situation) &&
    (filters.period === 'all' || s.period === filters.period) &&
    (team !== 'us' || filters.player === 'all' || s.shooterId === filters.player));
}

// Minutes played across games, limited to the chosen period (Period 2 → just Period 2 minutes; Overtime → overtime played).
function filteredMinutes(games, period) {
  return games.reduce((total, g) => {
    if (period === 'all') return total + gameMinutesPlayed(g);
    if (period === 'OT') return total + (g.overtime.on ? g.overtime.played : 0);
    return total + gamePeriodLength(g);
  }, 0);
}

// A count per standard game (for example "per 45 minutes"), or null if no minutes.
function perStandardGame(count, minutes) {
  return minutes > 0 ? count / minutes * standardGameMinutes() : null;
}

const isOnGoal = (shot) => shot.result === 'onNet' || shot.result === 'goal';

// Who the opponent is across a set of games: one name, or several.
function opponentNames(games) {
  return [...new Set(games.map(opponentName))].sort((a, b) => a.localeCompare(b));
}

// "Northside Wolves" when every game was against them; otherwise "Opponents’".
function opponentHeading(games) {
  const names = opponentNames(games);
  return names.length === 1 ? names[0] : 'Opponents’';
}

// Counts toward "Grade A shots": on net or a goal, from on or inside the area.
function isGradeAShot(shot) {
  return inGradeAArea(shot) === true && (shot.result === 'onNet' || shot.result === 'goal');
}

// How a shot's Grade A status reads in lists and labels.
function gradeALabel(shot) {
  if (inGradeAArea(shot) !== true) return '';
  return isGradeAShot(shot) ? 'Grade A shot' : 'Grade A attempt';
}

// The numbers shown with a shot map, for one team.
function shotSummary(shots, minutes) {
  const onGoal = shots.filter(isOnGoal);
  const goals = shots.filter(s => s.result === 'goal');
  const gradeAAttempts = shots.filter(s => inGradeAArea(s) === true);
  const gradeAShots = gradeAAttempts.filter(isOnGoal);
  return {
    attempts: shots.length,
    onGoal: onGoal.length,
    goals: goals.length,
    missed: shots.length - onGoal.length,
    gradeA: gradeAShots.length,                     // Grade A shots (on goal)
    gradeAAttempts: gradeAAttempts.length,          // every shot from the area
    gradeAMissed: gradeAAttempts.length - gradeAShots.length,
    gradeAGoals: gradeAShots.filter(s => s.result === 'goal').length,
    noLocation: shots.filter(s => s.x == null).length,
    onGoalPer: perStandardGame(onGoal.length, minutes),
    goalsPer: perStandardGame(goals.length, minutes),
    gradeAPer: perStandardGame(gradeAShots.length, minutes),
  };
}


// "5 wins, 3 losses, 1 tie", or '' if no results yet.
function recordText(games) {
  const results = games.map(gameResult).filter(Boolean);
  if (!results.length) return '';
  const wins = results.filter(r => WIN_RESULTS.includes(r)).length;
  const losses = results.filter(r => LOSS_RESULTS.includes(r)).length;
  const ties = results.filter(r => r === 'T').length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  return [plural(wins, 'win', 'wins'), plural(losses, 'loss', 'losses'), ties ? plural(ties, 'tie', 'ties') : '']
    .filter(Boolean).join(', ');
}



/* ---------------------------------------------------------
   5. SMALL HELPERS
   --------------------------------------------------------- */

function escapeHtml(text) {
  return String(text ?? '').replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function formatDateTime(iso) {
  if (!iso) return '';
  const date = new Date(iso);
  if (isNaN(date)) return '';
  return date.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// "today", "yesterday", or "5 days ago", counting calendar days.
function daysAgoText(iso) {
  const then = new Date(iso);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((startOfDay(new Date()) - startOfDay(then)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}

// "Sat, Oct 4, 2026" from "2026-10-04"
function formatGameDate(ymd) {
  if (!ymd) return '';
  const [year, month, day] = ymd.split('-').map(Number);
  return new Date(year, month - 1, day).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

// "6:30 PM" from "18:30"
function formatTime(hhmm) {
  if (!hhmm) return '';
  const [hours, minutes] = hhmm.split(':').map(Number);
  return new Date(2000, 0, 1, hours, minutes).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

// 4 → "4", 2.5 → "2:30" (minutes and seconds)
function formatMinutes(minutes) {
  const totalSeconds = Math.round(minutes * 60);
  const seconds = totalSeconds % 60;
  const whole = (totalSeconds - seconds) / 60;
  return seconds ? `${whole}:${String(seconds).padStart(2, '0')}` : String(whole);
}

// "3", "2.5", or "2:30" → minutes as a number (NaN if it can't be read)
function parseMinutes(text) {
  text = String(text).trim();
  const minutesAndSeconds = text.match(/^(\d{1,2}):([0-5]\d)$/);
  if (minutesAndSeconds) return Number(minutesAndSeconds[1]) + Number(minutesAndSeconds[2]) / 60;
  if (/^\d{1,2}(\.\d+)?$/.test(text)) return Number(text);
  return NaN;
}

// Describes where backups stand, for the top bar and the Setup screen.
function backupStatus() {
  const { lastBackupAt, lastChangeAt } = state.meta;
  if (!hasAnyData()) return { level: 'neutral', short: 'Nothing to back up yet', long: 'There’s no data to back up yet.' };
  if (!lastBackupAt) return { level: 'warn', short: 'Not backed up yet', long: 'This data has never been backed up.' };
  const when = daysAgoText(lastBackupAt);
  if (lastChangeAt && lastChangeAt > lastBackupAt) {
    return { level: 'warn', short: `Changes not backed up · last backup ${when}`,
             long: `You’ve made changes since the last backup (${when}).` };
  }
  return { level: 'ok', short: `Backed up ${when}`, long: `Everything is backed up. Last backup: ${when} (${formatDateTime(lastBackupAt)}).` };
}

function showBanner(message, level) {
  const banner = document.getElementById('banner');
  banner.textContent = message;
  banner.className = `banner ${level}`;
  banner.hidden = false;
}

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
}

/*
  Show a pop-up and wait for a button to be pressed. Resolves with the button's value,
  or undefined if the pop-up was closed with Escape.

  buttons:     [{ label, value, kind, push, check, isDefault, needsText }]
                 kind:      extra look, such as 'primary' or 'danger solid'
                 push:      pushes this and the buttons after it to the right-hand side
                 check:     run onSubmit before closing
                 isDefault: the button that the Enter key presses
                 needsText: stays disabled until requireText has been typed
  onSubmit:    (value, form) => error message, or nothing if all is well.
               If it returns a message, the pop-up stays open and shows it.
  requireText: the text that unlocks "needsText" buttons (for example ERASE).
  onOpen:      (form) => run once the pop-up is showing, for extra behaviour.
*/
function showDialog({ title, body, buttons, onSubmit, requireText, onOpen }) {
  return new Promise((resolve) => {
    const dialog = document.getElementById('dialog');
    dialog.innerHTML = `
      <form method="dialog" novalidate>
        <h2>${escapeHtml(title)}</h2>
        <div class="dialog-body">${body}</div>
        ${requireText ? '<input type="text" id="dialog-text" autocomplete="off" spellcheck="false">' : ''}
        <p class="dialog-error" hidden></p>
        <div class="dialog-buttons">
          ${buttons.map((b, i) => `<button class="btn ${b.kind || ''} ${b.push ? 'push' : ''}" value="${i}"
              ${b.needsText ? 'disabled data-needs-text' : ''} ${b.isDefault ? 'data-default' : ''}>${escapeHtml(b.label)}</button>`).join('')}
        </div>
      </form>`;
    const form = dialog.querySelector('form');
    const errorLine = dialog.querySelector('.dialog-error');

    if (requireText) {
      const input = dialog.querySelector('#dialog-text');
      input.addEventListener('input', () => {
        dialog.querySelectorAll('[data-needs-text]').forEach(btn => { btn.disabled = input.value.trim() !== requireText; });
      });
    }

    // Enter presses the default button (never Cancel by accident).
    form.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || !event.target.matches('input')) return;
      event.preventDefault();
      const defaultButton = form.querySelector('[data-default]');
      if (defaultButton && !defaultButton.disabled) defaultButton.click();
    });

    form.addEventListener('submit', (event) => {
      const button = buttons[Number(event.submitter && event.submitter.value)];
      if (!button || !button.check || !onSubmit) return;
      const error = onSubmit(button.value, form);
      if (error) {
        event.preventDefault();
        errorLine.textContent = error;
        errorLine.hidden = false;
      }
    });

    dialog.returnValue = '';
    dialog.onclose = () => {
      const choice = dialog.returnValue;
      resolve(choice === '' ? undefined : buttons[Number(choice)].value);
    };
    dialog.showModal();
    if (onOpen) onOpen(form);
  });
}

function showMessage(title, message) {
  return showDialog({ title, body: `<p>${escapeHtml(message)}</p>`, buttons: [{ label: 'OK', value: true, kind: 'primary', isDefault: true }] });
}

function confirmDialog(title, message, confirmLabel) {
  return showDialog({
    title, body: `<p>${escapeHtml(message)}</p>`,
    buttons: [{ label: 'Cancel', value: false }, { label: confirmLabel, value: true, kind: 'danger solid' }],
  });
}

// A row of pick-one buttons, for example Forward / Defence / Goalie.
function choiceButtons(name, options, selected) {
  return `<div class="seg" role="radiogroup">${Object.entries(options).map(([value, label]) =>
    `<label><input type="radio" name="${name}" value="${value}" ${value === selected ? 'checked' : ''}><span>${escapeHtml(label)}</span></label>`).join('')}</div>`;
}


/* ---------------------------------------------------------
   6. SCREENS
   --------------------------------------------------------- */

function updateHeader() {
  document.getElementById('brand-team').textContent = state.settings.teamName || 'Hockey Stats';
  document.getElementById('brand-season').textContent = state.settings.seasonLabel;
  // Tournament and game screens live under the Games tab.
  const tab = ['tournament', 'game', 'report'].includes(state.screen) ? 'games' : state.screen;
  document.querySelectorAll('#main-nav button').forEach(btn => {
    if (btn.dataset.screen === tab) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  const status = backupStatus();
  const pill = document.getElementById('backup-pill');
  pill.textContent = status.short;
  pill.className = `pill ${status.level}`;
}

function render() {
  updateHeader();
  const screens = {
    games: renderGamesScreen, tournament: renderTournamentScreen, game: renderGameScreen, report: renderReportScreen,
    stats: renderStatsScreen, setup: renderSetupScreen,
  };
  const app = document.getElementById('app');
  hideRinkTip();
  app.classList.toggle('wide', state.screen === 'game' || state.screen === 'stats');
  app.innerHTML = screens[state.screen]();
}

// Redraw after a change without losing your place (the box you're in, and the scroll position).
function renderKeepingFocus() {
  const focusedId = document.activeElement && document.activeElement.id;
  const scroll = window.scrollY;
  render();
  const again = focusedId && document.getElementById(focusedId);
  if (again) {
    again.focus({ preventScroll: true });
    // Like tabbing into a box normally: highlight what's there, so typing replaces it.
    if (again.matches('input[type="text"], input[type="number"]')) again.select();
  }
  window.scrollTo(0, scroll);
}

/*
  Moving between screens. The screen is kept in the web address after "#"
  (for example #game/abc123), so Chrome's Back button and reloading both work.
*/
const SCREENS = ['games', 'tournament', 'game', 'report', 'stats', 'setup'];

function go(screen, id, scrollTarget) {
  state.scrollTarget = scrollTarget || null;
  const hash = '#' + (id ? `${screen}/${id}` : screen);
  if (location.hash === hash) applyRoute();
  else location.hash = hash;   // Chrome then calls applyRoute
}

function applyRoute() {
  let [screen, id] = location.hash.slice(1).split('/');
  if (!SCREENS.includes(screen)) screen = state.players.length ? 'games' : 'setup';
  if ((screen === 'game' || screen === 'report') && !findGame(id)) screen = 'games';
  if (screen === 'tournament' && !findTournament(id)) screen = 'games';
  state.screen = screen;
  state.routeId = ['game', 'tournament', 'report'].includes(screen) ? id : null;
  if (screen === 'game' && (!state.entry || state.entry.gameId !== id)) state.entry = freshEntryState(findGame(id));
  render();
  const target = state.scrollTarget && document.getElementById(state.scrollTarget);
  if (target) target.scrollIntoView();
  else window.scrollTo(0, 0);
  state.scrollTarget = null;
}


/* ----- Games list ----- */

function renderGamesScreen() {
  const regular = state.games.filter(g => g.type === 'regular');
  const upcoming = regular.filter(isUpcoming).sort(compareGames);
  const played = regular.filter(g => !isUpcoming(g)).sort(compareGames).reverse();
  const record = recordText(played);
  const tournaments = [...state.tournaments].sort((a, b) =>
    tournamentDate(b).localeCompare(tournamentDate(a)) || byName(a, b));

  return `<h1>Games</h1>
    <div class="card" id="regular-card">
      <div class="card-head">
        <h2>Regular season</h2>
        <button type="button" class="btn primary" data-action="add-game">Add game</button>
      </div>
      ${record ? `<p class="muted summary">Record: ${record}</p>` : ''}
      ${regular.length ? '' : '<p class="muted empty">No regular season games yet. Add games after they’re played, or ahead of time from your schedule.</p>'}
      ${upcoming.length ? `<h3 class="group-label">Upcoming (${upcoming.length})</h3><div class="game-list">${upcoming.map(gameRow).join('')}</div>` : ''}
      ${played.length ? `<h3 class="group-label">Played (${played.length})</h3><div class="game-list">${played.map(gameRow).join('')}</div>` : ''}
    </div>

    <div class="card" id="tournaments-card">
      <div class="card-head">
        <h2>Tournaments</h2>
        <button type="button" class="btn primary" data-action="add-tournament">Add tournament</button>
      </div>
      ${tournaments.length
        ? `<div class="folder-list">${tournaments.map(folderRow).join('')}</div>`
        : '<p class="muted empty">No tournaments yet. Each tournament is a folder with its own period length and clock, and holds its games.</p>'}
    </div>`;
}

function resultBadge(result) {
  const kind = WIN_RESULTS.includes(result) ? 'win' : LOSS_RESULTS.includes(result) ? 'loss' : 'tie';
  return `<span class="badge ${kind}">${RESULTS[result]}</span>`;
}

function clockTag(clockType) {
  if (clockType === 'stop') return '';
  return `<span class="tag ${clockType === 'unknown' ? 'warn' : ''}">${clockType === 'unknown' ? 'Clock not known' : CLOCK_TYPES[clockType]}</span>`;
}

function gameRow(game) {
  const result = gameResult(game);
  let outcome;
  if (isUpcoming(game)) outcome = '<span class="tag">Upcoming</span>';
  else if (!gameHasStats(game.id) && !result) outcome = '<span class="tag warn">No stats yet</span>';
  else outcome = (gameHasStats(game.id) ? `<span class="score">${escapeHtml(scoreText(game))}</span>` : '') + (result ? resultBadge(result) : '');
  const flags = [clockTag(gameClockType(game))];
  if (officialScoreMismatch(game)) flags.push('<span class="tag warn">Score doesn’t match</span>');
  return `<button type="button" class="game-row" data-action="open-game" data-id="${escapeHtml(game.id)}">
      <span class="when"><strong>${formatGameDate(game.date)}</strong><span class="muted">${formatTime(game.time) || 'Time not set'}</span></span>
      <span class="who">vs ${escapeHtml(opponentName(game))}</span>
      <span class="flags">${flags.join('')}</span>
      <span class="outcome">${outcome}</span>
    </button>`;
}

const FOLDER_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" fill="currentColor"/></svg>`;

function folderRow(tournament) {
  const games = tournamentGames(tournament.id);
  const record = recordText(games.filter(g => !isUpcoming(g)));
  const date = tournamentDate(tournament);
  const details = [date ? formatGameDate(date) : 'No date yet', tournament.location].filter(Boolean).map(escapeHtml).join(' · ');
  return `<button type="button" class="folder-row" data-action="open-tournament" data-id="${escapeHtml(tournament.id)}">
      <span class="folder-icon">${FOLDER_ICON}</span>
      <span class="folder-main"><strong>${escapeHtml(tournament.name)}</strong><span class="muted small">${details}</span></span>
      <span class="folder-meta muted small">${games.length} ${games.length === 1 ? 'game' : 'games'}${record ? ` · ${record}` : ''}</span>
      <span class="flags">${tournament.clockType === 'unknown' ? clockTag('unknown') : ''}</span>
      <span class="chev" aria-hidden="true">›</span>
    </button>`;
}


/* ----- Tournament folder ----- */

function renderTournamentScreen() {
  const tournament = findTournament(state.routeId);
  const games = tournamentGames(tournament.id);
  const record = recordText(games.filter(g => !isUpcoming(g)));
  const details = [tournament.location, tournament.startDate ? `Starts ${formatGameDate(tournament.startDate)}` : '']

  return `<a class="back" href="#games">‹ Games</a>

      <div><h1>${escapeHtml(tournament.name)}</h1>${details ? `<p class="muted subtitle">${details}</p>` : ''}</div>
      <button type="button" class="btn" data-action="edit-tournament" data-id="${escapeHtml(tournament.id)}">Edit tournament</button>
    </div>
    <div class="card">
      <div class="facts">
        <div><span class="fact-label">Period length</span><strong>${tournament.periodLength} minutes</strong></div>
        <div><span class="fact-label">Clock</span><strong>${CLOCK_TYPES[tournament.clockType]}</strong></div>
        <div><span class="fact-label">Record</span><strong>${record || 'No results yet'}</strong></div>
      </div>
      ${tournament.clockType === 'unknown' ? `<p class="notice warn">The clock isn’t known yet. When you find out, use “Edit tournament” to set it. Every game in this tournament will follow it.</p>` : ''}
    </div>

      <div class="card-head">
        <h2>Games</h2>

      </div>
      ${games.length ? `<div class="game-list">${games.map(gameRow).join('')}</div>` : '<p class="muted empty">No games in this tournament yet.</p>'}
    </div>`;
}


/* ----- One game ----- */

function renderGameScreen() {
  const game = findGame(state.routeId);
  const entry = state.entry;
  if (!game.overtime.on && entry.period === 'OT') entry.period = 3;
  const tournament = game.type === 'tournament' ? findTournament(game.tournamentId) : null;
  const hasStats = gameHasStats(game.id);
  const score = gameScore(game);
  const result = gameResult(game);
  const mismatch = officialScoreMismatch(game);
  const opponent = opponentName(game);

  const back = tournament
    ? `<a class="back" href="#tournament/${escapeHtml(tournament.id)}">‹ ${escapeHtml(tournament.name)}</a>`
    : '<a class="back" href="#games">‹ Games</a>';
  const when = [formatGameDate(game.date), formatTime(game.time), tournament ? escapeHtml(tournament.name) : 'Regular season']
    .filter(Boolean).join(' · ');

  let status;
  if (result) status = resultBadge(result) + (game.result ? ' <span class="tag">Set by hand</span>' : '');
  else if (isUpcoming(game)) status = '<span class="tag">Upcoming</span>';
  else if (!hasStats) status = '<span class="tag warn">No stats yet</span>';
  else status = '<span class="tag">Shootout not finished</span>';
  const shootoutLine = game.shootout && state.shootoutAttempts.some(a => a.gameId === game.id)
    ? `<span class="muted">Shootout ${shootoutScore(game).us}–${shootoutScore(game).them}</span>` : '';

  const counts = gameStatCounts(game.id);
  const tabs = {
    shots: `Shots (${counts.shots})`,
    faceoffs: `Faceoffs (${counts.faceoffs})`,
    penalties: `Penalty shots and shootout (${counts.penaltyShots + counts.shootoutAttempts})`,
    specialTeams: 'Power play and penalty kill',
    sheet: `Game sheet (${gameSheet(game).goals.length + gameSheet(game).penalties.length})`,
  };
  let tabContent;
  if (entry.tab === 'shots') tabContent = renderShotsTab(game);
  else if (entry.tab === 'faceoffs') tabContent = renderFaceoffsTab(game);
  else if (entry.tab === 'specialTeams') tabContent = renderSpecialTeamsTab(game);
  else if (entry.tab === 'sheet') tabContent = renderGameSheetTab(game);
  else tabContent = renderPenaltiesTab(game);

  return `${back}
    <div class="title-row">
      <div><h1>vs ${escapeHtml(opponent)}</h1><p class="muted subtitle">${when}</p></div>
      <div class="title-actions">
        <button type="button" class="btn" data-action="open-report" data-id="${escapeHtml(game.id)}">Game report</button>
        <button type="button" class="btn" data-action="edit-game" data-id="${escapeHtml(game.id)}">Edit game</button>
      </div>
    </div>

    <div class="card scoreboard">
      <div class="side"><span class="team-name">${escapeHtml(ourTeamName())}</span>${hasStats ? `<span class="goals">${score.us}</span>` : ''}</div>
      <div class="dash">${hasStats ? '–' : 'vs'}</div>
      <div class="side"><span class="team-name">${escapeHtml(opponent)}</span>${hasStats ? `<span class="goals">${score.them}</span>` : ''}</div>
      <div class="scoreboard-foot">${status}${shootoutLine}</div>
      ${mismatch ? `<p class="notice warn scoreboard-foot">The goals entered add up to ${mismatch.recorded.us}–${mismatch.recorded.them}, but the official score is ${mismatch.official.us}–${mismatch.official.them}. A goal may be missing or entered for the wrong team.</p>` : ''}
    </div>

    ${renderGameDetails(game)}

    <div class="tab-bar" role="tablist">
      ${Object.entries(tabs).map(([key, label]) =>
        `<button type="button" role="tab" class="${entry.tab === key ? 'on' : ''}" aria-selected="${entry.tab === key}" data-action="game-tab" data-value="${key}">${label}</button>`).join('')}
    </div>
    ${tabContent}`;
}

// Period length, clock, overtime, shootout, result, official score, and notes, in a panel that folds away.
function renderGameDetails(game) {
  const inherited = inheritedSettings(game);
  const automatic = automaticResult(game);
  const overtime = game.overtime;
  const official = game.officialScore || { us: null, them: null };
  const opponent = opponentName(game);
  const minutes = gameMinutesPlayed(game);

  const inheritHint = (field, text) => game[field] == null
    ? `<span class="hint">Following ${inherited.source}.</span>`
    : `<span class="hint">Changed for this game. <button type="button" class="linklike" data-action="reset-game-field" data-field="${field}">Go back to ${inherited.source} (${text})</button></span>`;
  const clockOptions = Object.entries(CLOCK_TYPES).map(([key, label]) =>
    `<option value="${key}" ${gameClockType(game) === key ? 'selected' : ''}>${label}</option>`).join('');
  const resultOptions = `<option value="auto">Automatic${automatic ? ` (${RESULTS[automatic]})` : ''}</option>` +
    Object.entries(RESULTS).map(([key, label]) => `<option value="${key}" ${game.result === key ? 'selected' : ''}>${label}</option>`).join('');
  const summary = [
    `${gamePeriodLength(game)}-minute periods`,
    CLOCK_TYPES[gameClockType(game)],
    overtime.on ? `Overtime (${formatMinutes(overtime.played)} played)` : 'No overtime',
    game.shootout ? 'Shootout' : 'No shootout',
    `${formatMinutes(minutes)} minutes played`,
  ].join(' · ');

  return `<details class="card details-card" id="game-details" ${state.entry.detailsOpen ? 'open' : ''}>
      <summary><span class="summary-title">Game details</span><span class="muted small">${summary}</span></summary>
      <div class="details-body">
        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="g-period">Period length</label>
            <span class="with-unit"><input type="number" id="g-period" data-game-field="periodLength" value="${gamePeriodLength(game)}" min="1" max="60" step="1" inputmode="numeric"> minutes</span>
            ${inheritHint('periodLength', `${inherited.periodLength} minutes`)}
          </div>
          <div class="field">
            <label class="field-label" for="g-clock">Clock</label>

        <div class="switch-block">
          <label class="switch"><input type="checkbox" id="g-overtime" data-game-field="overtimeOn" ${overtime.on ? 'checked' : ''}><span class="switch-track"></span><span>Overtime</span></label>
          ${overtime.on ? `<div class="sub-fields">
              <div class="field">
                <label class="field-label" for="g-ot-length">Overtime length</label>

              </div>
