  return `<div class="card filter-bar">
      <div class="control"><label class="control-label" for="filter-games">Games</label>
        <select id="filter-games" data-filter-select="games">${gameOptions}</select></div>
      <div class="control ${use.situation ? '' : 'off'}"><span class="control-label">Situation</span>
        <div class="toggle-group">${[['all', 'All'], ...Object.entries(SITUATIONS)].map(([v, l]) => toggle('situation', v, l, !use.situation)).join('')}</div></div>
      <div class="control ${use.period ? '' : 'off'}"><span class="control-label">Period</span>
        <div class="toggle-group">${periods.map(([v, l]) => toggle('period', v, l, !use.period)).join('')}</div></div>
      <div class="control ${use.team ? '' : 'off'}"><span class="control-label">Team</span>
        <div class="toggle-group">${toggle('team', 'us', escapeHtml(ourTeamName()), !use.team)}${toggle('team', 'them', escapeHtml(opponentNames(filteredGames(f)).length === 1 ? opponentNames(filteredGames(f))[0] : 'Opponents'), !use.team)}${toggle('team', 'both', 'Side by side', !use.team)}</div></div>
      ${use.note ? `<p class="hint filter-note">${use.note}</p>` : ''}
    </div>`;
}

function setFilter(name, value) {
  if (name === 'period') value = value === 'all' || value === 'OT' ? value : Number(value);
  if (name === 'gradeAOnly') value = value === true || value === 'true';
  state.filters[name] = value;
  saveFilters();
  renderKeepingFocus();
}


/* ----- Stats: shot map ----- */

// Heat map colours: one hue (blue), light to dark, from the chart palette.
/*
  Heat map colour scales, lightest (fewest shots) to darkest (most). Both were checked to get
  steadily darker at every step, so "more" always looks darker.
    green: Stars green, the default (one hue)
    blue: one hue, from the chart palette
    warm: pale yellow → orange → deep red, the familiar "heat" look (not a rainbow, which invents sharp zones)
*/
const HEAT_RAMPS = {
  green: ['#d4eee0', '#a9dcc1', '#78c49d', '#45a678', '#1c8759', '#006a44', '#00452c'],   // Stars green
  blue: ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'],
  warm: ['#ffeda0', '#fed976', '#feb24c', '#fd8d3c', '#f03b20', '#bd0026', '#800026'],
};
const HEAT_SPREAD = 5;   // feet: how far each shot's warmth spreads

// Shot density over the rink, one value per square foot.
function densityGrid(shots) {
  const grid = new Float32Array(RINK_W * RINK_H);
  const reach = Math.ceil(HEAT_SPREAD * 3);
  for (const shot of shots) {
    if (shot.x == null) continue;
    const sx = shot.x * RINK_W, sy = shot.y * RINK_H;
    for (let y = Math.max(0, Math.floor(sy - reach)); y < Math.min(RINK_H, sy + reach); y++) {
      for (let x = Math.max(0, Math.floor(sx - reach)); x < Math.min(RINK_W, sx + reach); x++) {
        const d2 = (x + 0.5 - sx) ** 2 + (y + 0.5 - sy) ** 2;
        grid[y * RINK_W + x] += Math.exp(-d2 / (2 * HEAT_SPREAD * HEAT_SPREAD));
      }
    }
  }
  return grid;
}

// Classes for a heat map's colours. On green and yellow-to-red heat, shots and goals are drawn dark so they stand out.
function heatClasses(colours) {
  const ramp = HEAT_RAMPS[colours] ? colours : 'green';
  return `heat-${ramp} ${ramp === 'blue' ? '' : 'dark-marks'}`;
}

function rampColor(t, ramp) {
  const scaled = Math.min(ramp.length - 1.0001, Math.max(0, t * (ramp.length - 1)));
  const i = Math.floor(scaled), mix = scaled - i;
  const a = ramp[i], b = ramp[i + 1];
  const channel = (k) => Math.round(parseInt(a.substr(1 + k * 2, 2), 16) * (1 - mix) + parseInt(b.substr(1 + k * 2, 2), 16) * mix);
  return [channel(0), channel(1), channel(2)];
}

// Draw the density as a small picture, stretched smoothly over the rink.
// strength: how strong the darkest spot is (0.9 on the Stats screen; lighter on the printed report).
function heatMapImage(grid, max, ramp, strength = 0.9) {
  const canvas = document.createElement('canvas');
  canvas.width = RINK_W;
  canvas.height = RINK_H;
  const context = canvas.getContext('2d');
  const image = context.createImageData(RINK_W, RINK_H);
  for (let i = 0; i < grid.length; i++) {
    const t = max > 0 ? grid[i] / max : 0;
    if (t < 0.01) continue;
    const [r, g, b] = rampColor(t, ramp);
    // Fade smoothly to nothing at the edges (no hard rim), strongest where shots cluster.
    image.data.set([r, g, b, Math.round(255 * strength * Math.min(1, Math.pow(t, 0.6) * 1.1))], i * 4);
  }
  context.putImageData(image, 0, 0);
  // Enlarge with smoothing before handing it over. Screens smooth a small picture themselves, but PDFs
  // (Save as PDF) don't, and the heat map would come out blocky.
  const SCALE = 6;
  const smooth = document.createElement('canvas');
  smooth.width = RINK_W * SCALE;
  smooth.height = RINK_H * SCALE;
  const smoothContext = smooth.getContext('2d');
  smoothContext.imageSmoothingEnabled = true;
  smoothContext.imageSmoothingQuality = 'high';
  smoothContext.drawImage(canvas, 0, 0, smooth.width, smooth.height);
  return smooth.toDataURL();
}

function statDot(shot, game) {
  const cx = (shot.x * RINK_W).toFixed(2), cy = (shot.y * RINK_H).toFixed(2);
  const who = shot.team === 'us' ? (shot.shooterId ? playerLabel(shot.shooterId) : 'Shooter not recorded') : opponentName(game);
  const tip = [SHOT_RESULTS[shot.result], who, `${formatGameDate(game.date)} vs ${opponentName(game)}`, periodLabel(shot.period),
               SITUATIONS[shot.situation], gradeALabel(shot)].filter(Boolean).join(' · ');
  const hit = `<circle r="2.4" class="hit"/>`;   // bigger than the mark, so it's easy to point at
  if (shot.result === 'goal') {
    return `<g class="stat-dot goal" transform="translate(${cx} ${cy})" data-tip="${escapeHtml(tip)}">${hit}<path d="M0,-1.7 L1.7,0 L0,1.7 L-1.7,0 Z" class="mark"/></g>`;
  }
  return `<g class="stat-dot ${shot.result}" transform="translate(${cx} ${cy})" data-tip="${escapeHtml(tip)}">${hit}<circle r="0.85" class="mark"/></g>`;
}

function renderShotMapView() {
  const f = state.filters;
  const games = filteredGames(f);
  const gamesById = Object.fromEntries(games.map(g => [g.id, g]));
  const minutes = filteredMinutes(games, f.period);
  const teams = f.team === 'both' ? ['us', 'them'] : [f.team];

  const panels = teams.map(team => {
    const all = filteredShots(f, games, team);
    let shown = f.shotsShown === 'onGoal' ? all.filter(isOnGoal) : all;
    if (f.gradeAOnly) shown = shown.filter(s => inGradeAArea(s) === true);
    return { team, all, shown, summary: shotSummary(all, minutes) };
  });
  // Side by side: both heat maps share one scale, so darker means more shots on either rink.
  const grids = panels.map(p => densityGrid(p.shown.filter(s => s.result !== 'goal' || f.display !== 'dots')));
  const max = Math.max(0, ...grids.map(g => g.reduce((m, v) => Math.max(m, v), 0)));

  const players = sortByNumber(state.players.filter(p => p.active || state.shots.some(s => s.shooterId === p.id)));
  const toggle = (filter, value, label, disabled) =>
    `<button type="button" class="toggle ${String(f[filter]) === String(value) ? 'on' : ''}" aria-pressed="${String(f[filter]) === String(value)}" data-action="set-filter" data-filter="${filter}" data-value="${value}" ${disabled ? 'disabled' : ''}>${label}</button>`;

  const options = `<div class="card map-options">
      <div class="control"><span class="control-label">Show</span>
        <div class="toggle-group">${toggle('display', 'heat', 'Heat map')}${toggle('display', 'dots', 'Dots')}${toggle('display', 'both', 'Both')}</div></div>
      <div class="control ${f.display === 'dots' ? 'off' : ''}"><span class="control-label">Heat colours</span>
        <div class="toggle-group">${toggle('heatColours', 'green', `<span class="swatch green"></span>Green`, f.display === 'dots')}${toggle('heatColours', 'blue', `<span class="swatch blue"></span>Blue`, f.display === 'dots')}${toggle('heatColours', 'warm', `<span class="swatch warm"></span>Yellow to red`, f.display === 'dots')}</div></div>
      <div class="control"><span class="control-label">Shots</span>
        <div class="toggle-group">${toggle('shotsShown', 'onGoal', 'Shots on goal')}${toggle('shotsShown', 'all', 'All attempts')}</div></div>
      <div class="control"><span class="control-label">Area</span>
        <div class="toggle-group">${toggle('gradeAOnly', false, 'Whole zone')}${toggle('gradeAOnly', true, 'Grade A only')}</div></div>
      <div class="control ${f.team === 'them' ? 'off' : ''}"><label class="control-label" for="filter-player">Player (${escapeHtml(ourTeamName())})</label>
        <select id="filter-player" data-filter-select="player" ${f.team === 'them' ? 'disabled' : ''}>
          <option value="all">All players</option>
          ${players.map(p => `<option value="${escapeHtml(p.id)}" ${f.player === p.id ? 'selected' : ''}>#${escapeHtml(p.number)} ${escapeHtml(p.name)}${p.active ? '' : ' (inactive)'}</option>`).join('')}
        </select></div>
    </div>`;

  const periodNote = f.period === 'all' ? '' : ` (${periodLabel(f.period)} only)`;
  const basis = `${games.length} ${games.length === 1 ? 'game' : 'games'} · ${formatMinutes(Math.round(minutes * 10) / 10)} minutes played${periodNote}`;
  const situationNote = f.situation === 'all' ? '' :
    `<p class="hint">Rates are per ${standardGameMinutes()} minutes of total play, not per minute of ${SITUATIONS[f.situation].toLowerCase()} time (penalty time isn’t tracked).</p>`;

  return `${options}
    <p class="muted basis">Based on ${basis}. Rates are per ${standardGameMinutes()} minutes, a standard game.</p>
    ${situationNote}
    <div class="map-panels ${panels.length > 1 ? 'two' : ''}">
      ${panels.map((p, i) => renderMapPanel(p, grids[i], max, gamesById, minutes)).join('')}
    </div>`;
}

function renderMapPanel(panel, grid, max, gamesById, minutes) {
  const f = state.filters;
  const s = panel.summary;
  const games = Object.values(gamesById);
  const teamName = panel.team === 'us' ? ourTeamName() : opponentHeading(games);
  const names = opponentNames(games);
  const againstLine = panel.team === 'them' && names.length > 1
    ? `<p class="muted small panel-sub">Combined: ${escapeHtml(names.length > 4 ? `${names.slice(0, 4).join(', ')}, and ${names.length - 4} more` : names.join(', '))}</p>` : '';
  const heat = f.display !== 'dots' && max > 0
    ? `<image href="${heatMapImage(grid, max, HEAT_RAMPS[f.heatColours] || HEAT_RAMPS.green)}" x="0" y="0" width="${RINK_W}" height="${RINK_H}" preserveAspectRatio="none" class="heat"/>` : '';
  const located = panel.shown.filter(sh => sh.x != null);
  // Goals always go on top, as diamonds; in heat-map-only view only the goals are drawn as marks.
  const dotShots = f.display === 'heat' ? located.filter(sh => sh.result === 'goal') : located;
  const dots = [...dotShots].sort((a, b) => (a.result === 'goal') - (b.result === 'goal')).map(sh => statDot(sh, gamesById[sh.gameId])).join('');
  const playerNote = panel.team === 'us' && f.player !== 'all' ? ` · ${playerLabel(f.player)}` : '';
  const tile = (label, value, detail) => `<div class="stat-tile"><span class="tile-label">${label}</span><span class="tile-value">${value}</span>${detail ? `<span class="tile-detail">${detail}</span>` : ''}</div>`;
  const pct = (part, whole) => whole ? `${Math.round(100 * part / whole)}%` : '–';

  const byArea = [
    ['Grade A area', panel.all.filter(sh => inGradeAArea(sh) === true)],
    ['Outside Grade A area', panel.all.filter(sh => inGradeAArea(sh) === false)],
    ...(s.noLocation ? [['No location', panel.all.filter(sh => sh.x == null)]] : []),
  ];

  return `<section class="card map-panel ${f.team === 'both' ? '' : 'single'} ${f.display === 'dots' ? '' : heatClasses(f.heatColours)}">
      <h2>${escapeHtml(teamName)} shots${escapeHtml(playerNote)}</h2>
      ${againstLine}
      <div class="map-side">
      <div class="map-wrap">${rinkSvg(`<g class="stat-dots">${dots}</g>`, { label: `Shot map for ${teamName}`, underlay: heat })}</div>
      <div class="map-legend">
        ${f.display !== 'dots' ? `<span class="heat-key"><span class="muted">Fewer</span><span class="heat-bar"></span><span class="muted">More shots</span></span>` : ''}
        ${f.display !== 'heat' ? `<span><svg class="key" viewBox="-2 -2 4 4"><circle r="0.85" class="key-onnet"/></svg> On net</span>` : ''}
        ${f.display !== 'heat' && f.shotsShown === 'all' ? `<span><svg class="key" viewBox="-2 -2 4 4"><circle r="0.85" class="key-missed"/></svg> Missed or blocked</span>` : ''}
        <span><svg class="key" viewBox="-2 -2 4 4"><path d="M0,-1.7 L1.7,0 L0,1.7 L-1.7,0 Z" class="key-goal"/></svg> Goal</span>
        <span><svg class="key wide" viewBox="0 0 26 10"><line x1="1" y1="5" x2="25" y2="5" stroke="#243142" stroke-width="2" stroke-dasharray="4 3"/></svg> Grade A area</span>
      </div>
      ${s.noLocation ? `<p class="hint">${s.noLocation} ${s.noLocation === 1 ? 'shot has' : 'shots have'} no location, so ${s.noLocation === 1 ? 'it isn’t' : 'they aren’t'} on the map (but ${s.noLocation === 1 ? 'is' : 'are'} in the numbers).</p>` : ''}
      </div>
      <div class="numbers-side">
      <div class="tiles">
        ${tile('Shots on goal', s.onGoal, `${formatRate(s.onGoalPer)} per ${standardGameMinutes()} min`)}
        ${tile('Goals', s.goals, `${formatRate(s.goalsPer)} per ${standardGameMinutes()} min`)}
        ${tile('Scoring percentage', pct(s.goals, s.onGoal), `${s.goals} ${s.goals === 1 ? 'goal' : 'goals'} on ${s.onGoal} ${s.onGoal === 1 ? 'shot' : 'shots'} on goal`)}
        ${tile('Shooting percentage', pct(s.onGoal, s.attempts), `${s.onGoal} of ${s.attempts} ${s.attempts === 1 ? 'attempt' : 'attempts'} on net`)}
        ${tile('Grade A shots', s.gradeA, `${formatRate(s.gradeAPer)} per ${standardGameMinutes()} min · ${s.gradeAGoals} ${s.gradeAGoals === 1 ? 'goal' : 'goals'}`)}
        ${tile('Grade A attempts', s.gradeAAttempts, `${s.gradeAMissed} missed or blocked`)}
        ${tile('All attempts', s.attempts, `${s.missed} missed or blocked`)}
      </div>
      <p class="hint tiles-note">Scoring percentage is goals ÷ shots on goal (how often shots on net go in). Shooting percentage is shots on goal ÷ all attempts (how often shots reach the net). Grade A shots are on net plus goals from the Grade A area; Grade A attempts also include missed or blocked.</p>
      <table class="simple by-area">
        <colgroup><col><col style="width:17%"><col style="width:15%"><col style="width:13%"><col style="width:17%"></colgroup>
        <caption class="muted small">By area</caption>
        <tr><th></th><th class="num">Attempts</th><th class="num">On goal</th><th class="num">Goals</th><th class="num" title="Goals divided by shots on goal">Scoring %</th></tr>
        ${byArea.map(([label, list]) => {
          const onGoal = list.filter(isOnGoal).length, goals = list.filter(sh => sh.result === 'goal').length;
          return `<tr><td>${label}</td><td class="num">${list.length}</td><td class="num">${onGoal}</td><td class="num">${goals}</td>
            <td class="num">${onGoal ? `${pct(goals, onGoal)}<span class="sub">${goals} on ${onGoal}</span>` : '–'}</td></tr>`;
        }).join('')}
      </table>
      </div>
    </section>`;
}


/* ----- Power play and penalty kill numbers (entered per game) ----- */

/*
  Each game can hold four numbers from the game sheet (null = not entered yet):
    ppOpportunities  how many power plays we had
    ppGoals          power play goals we scored
    pkTimes          how many times we were shorthanded
    pkGoalsAgainst   power play goals scored against us
*/
const SPECIAL_FIELDS = {
  ppOpportunities: 'Power plays',
  ppGoals: 'Power play goals',
  pkTimes: 'Times shorthanded',
  pkGoalsAgainst: 'Power play goals against',
};
const emptySpecialTeams = () => ({ ppOpportunities: null, ppGoals: null, pkTimes: null, pkGoalsAgainst: null });
const gameSpecialTeams = (game) => ({ ...emptySpecialTeams(), ...(game.specialTeams || {}) });

// Power play % and penalty kill % across games. Games without the numbers entered are left out (not counted as zero).
function specialTeamsPercentages(games) {
  const ppGames = games.filter(g => gameSpecialTeams(g).ppOpportunities != null);
  const pkGames = games.filter(g => gameSpecialTeams(g).pkTimes != null);
  const sum = (list, field) => list.reduce((total, g) => total + (gameSpecialTeams(g)[field] || 0), 0);
  const ppOpportunities = sum(ppGames, 'ppOpportunities'), ppGoals = sum(ppGames, 'ppGoals');
  const pkTimes = sum(pkGames, 'pkTimes'), pkGoalsAgainst = sum(pkGames, 'pkGoalsAgainst');
  return {
    ppGames: ppGames.length, ppOpportunities, ppGoals,
    ppPercent: ppOpportunities ? ppGoals / ppOpportunities : null,
    pkGames: pkGames.length, pkTimes, pkGoalsAgainst, pkKilled: Math.max(0, pkTimes - pkGoalsAgainst),
    pkPercent: pkTimes ? Math.max(0, pkTimes - pkGoalsAgainst) / pkTimes : null,
  };
}

const percentWhole = (fraction) => fraction == null ? '–' : `${Math.round(fraction * 100)}%`;

// Goals tagged on entered shots, to cross-check the typed numbers.
function taggedSpecialGoals(game) {
  const shots = gameShots(game.id);
  return {
    anyTagged: shots.some(s => s.situation !== 'even'),
    ppGoals: shots.filter(s => s.team === 'us' && s.situation === 'pp' && s.result === 'goal').length,
    pkGoalsAgainst: shots.filter(s => s.team === 'them' && s.situation === 'pk' && s.result === 'goal').length,
  };
}

/* ----- Game sheet: goals with assists, and penalties (copied from the league's game summary) ----- */

/*
  Stored on each game as gameSheet: { goals: [...], penalties: [...] }.
  A person is { playerId } for our team (from the roster), or { number, name } for the opponent (typed in).
    goal:    { id, period, time ('mm:ss' as on the game clock, or ''), team, scorer, assists: [person, person?],
               strength: 'even' | 'pp' | 'sh' (from the SCORING team's side, as on game sheets), emptyNet, createdAt }
    penalty: { id, period, time, team, player, infraction, type, minutes, createdAt }
  The game-winning goal is worked out, not entered.
*/
const STRENGTHS = { even: 'Even strength', pp: 'Power play', sh: 'Shorthanded' };
const PENALTY_TYPES = {
  minor: { label: 'Minor', minutes: 2 }, doubleMinor: { label: 'Double minor', minutes: 4 },
  major: { label: 'Major', minutes: 5 }, misconduct: { label: 'Misconduct', minutes: 10 },
  gameMisconduct: { label: 'Game misconduct', minutes: 0 },
};
const COMMON_INFRACTIONS = ['Body checking', 'Boarding', 'Charging', 'Checking from behind', 'Cross-checking', 'Delay of game',
  'Elbowing', 'Fighting', 'Head contact', 'High-sticking', 'Holding', 'Holding the stick', 'Hooking', 'Interference',
  'Kneeing', 'Roughing', 'Slashing', 'Spearing', 'Too many players', 'Tripping', 'Unsportsmanlike conduct'];

const gameSheet = (game) => ({ goals: [], penalties: [], ...(game.gameSheet || {}) });

// "14:21" → 861 seconds; '' → null
function clockSeconds(time) {
  if (!time) return null;
  const [m, s] = time.split(':').map(Number);
  return m * 60 + s;
}

// Game order: by period, then by the clock counting down (14:21 comes before 9:01). Blank times go last in their period.
function sheetOrder(a, b) {
  const byPeriod = PERIODS.indexOf(a.period) - PERIODS.indexOf(b.period);
  if (byPeriod) return byPeriod;
  const ta = clockSeconds(a.time), tb = clockSeconds(b.time);
  if (ta !== tb) return tb == null ? -1 : ta == null ? 1 : tb - ta;
  return (a.createdAt || '').localeCompare(b.createdAt || '');
}

function personLabel(team, person) {
  if (!person) return '';
  if (team === 'us') return person.playerId ? playerLabel(person.playerId) : 'Not recorded';
  const parts = [person.number ? `#${person.number}` : '', person.name || ''].filter(Boolean);
  return parts.length ? parts.join(' ') : 'Not recorded';
}

const sheetTeamName = (game, team) => team === 'us' ? ourTeamName() : opponentName(game);

function sheetGoalCounts(game) {
  const goals = gameSheet(game).goals;
  return { us: goals.filter(g => g.team === 'us').length, them: goals.filter(g => g.team === 'them').length };
}

// The winning team's goal that put them one ahead of the loser's final total. None for ties or shootouts.
function gameWinningGoalId(game) {
  const goals = [...gameSheet(game).goals].sort(sheetOrder);
  const counts = sheetGoalCounts(game);
  if (counts.us === counts.them || (game.shootout && gameResult(game) && gameResult(game).startsWith('SO'))) return null;
  const winner = counts.us > counts.them ? 'us' : 'them';
  const loserTotal = Math.min(counts.us, counts.them);
  const winnersGoals = goals.filter(g => g.team === winner);
  return winnersGoals[loserTotal] ? winnersGoals[loserTotal].id : null;
}

function goalTags(game, goal) {
  const tags = [];
  if (goal.strength === 'pp') tags.push('Power play');
  if (goal.strength === 'sh') tags.push('Shorthanded');
  if (goal.emptyNet) tags.push('Empty net');
  if (goal.id === gameWinningGoalId(game)) tags.push('Game-winning goal');
  return tags;
}

// Which of our players appear on a game sheet (so they can't be deleted from the roster).
function playerOnAnySheet(playerId) {
  return state.games.some(g => {
    const sheet = gameSheet(g);
    return sheet.goals.some(goal => goal.team === 'us' && [goal.scorer, ...(goal.assists || [])].some(p => p && p.playerId === playerId)) ||
           sheet.penalties.some(pen => pen.team === 'us' && pen.player && pen.player.playerId === playerId);
  });
}

// Goals and assists per player from a game's sheet: Map playerId → { goals, assists }
function sheetPoints(game) {
  const points = new Map();
  const add = (id, field) => { if (!id) return; const p = points.get(id) || { goals: 0, assists: 0 }; p[field]++; points.set(id, p); };
  for (const goal of gameSheet(game).goals.filter(g => g.team === 'us')) {
    add(goal.scorer && goal.scorer.playerId, 'goals');
    for (const a of goal.assists || []) add(a && a.playerId, 'assists');
  }
  return points;
}

function renderGameSheetTab(game) {
  const sheet = gameSheet(game);
  const goals = [...sheet.goals].sort(sheetOrder);
  const penalties = [...sheet.penalties].sort(sheetOrder);
  const counts = sheetGoalCounts(game);
  const fromShots = gameScore(game);
  const mismatch = goals.length && gameHasStats(game.id) && (counts.us !== fromShots.us || counts.them !== fromShots.them)
    ? `<p class="notice warn">The game sheet has ${counts.us}–${counts.them} in goals, but the shots and penalty shots entered add up to ${fromShots.us}–${fromShots.them}. A goal may be missing from one of them.</p>` : '';
  const byPeriod = (items, row) => {
    const periods = PERIODS.filter(p => items.some(i => i.period === p));
    return periods.map(p => `<tr class="period-row"><th colspan="5">${periodLabel(p)}</th></tr>${items.filter(i => i.period === p).map(row).join('')}`).join('');
  };
  const actions = (kind, id) => `<td class="row-actions"><button type="button" class="btn small" data-action="edit-sheet-${kind}" data-id="${escapeHtml(id)}">Edit</button>
      <button type="button" class="btn small danger" data-action="delete-sheet-${kind}" data-id="${escapeHtml(id)}">Delete</button></td>`;
  const goalRow = (g) => {
    const assists = (g.assists || []).filter(Boolean).map(a => escapeHtml(personLabel(g.team, a)));
    const tags = goalTags(game, g).map(t => `<span class="tag">${t}</span>`).join(' ');
    return `<tr><td class="time">${escapeHtml(g.time || '–')}</td><td>${escapeHtml(sheetTeamName(game, g.team))}</td>
      <td><strong>${escapeHtml(personLabel(g.team, g.scorer))}</strong>${assists.length ? `<span class="assists">Assists: ${assists.join(', ')}</span>` : '<span class="assists">Unassisted</span>'}</td>
      <td>${tags}</td>${actions('goal', g.id)}</tr>`;
  };
  const penaltyRow = (p) => `<tr><td class="time">${escapeHtml(p.time || '–')}</td><td>${escapeHtml(sheetTeamName(game, p.team))}</td>
      <td><strong>${escapeHtml(personLabel(p.team, p.player))}</strong><span class="assists">${escapeHtml(p.infraction || 'Infraction not recorded')}</span></td>
      <td>${escapeHtml(PENALTY_TYPES[p.type] ? PENALTY_TYPES[p.type].label : '')}${p.minutes ? `, ${p.minutes} min` : ''}</td>${actions('penalty', p.id)}</tr>`;
  const table = (body) => `<div class="table-scroll"><table class="simple sheet-table">
      <colgroup><col style="width:70px"><col style="width:180px"><col><col style="width:190px"><col style="width:150px"></colgroup>${body}</table></div>`;

  return `<div class="card" id="sheet-goals">
      <div class="card-head"><h2>Goals (${counts.us}–${counts.them})</h2>
        <button type="button" class="btn primary" data-action="add-sheet-goal">Add goal</button></div>
      <p class="muted small">From the league’s game sheet. Enter times as shown on the game clock; the app puts them in game order and works out the game-winning goal.</p>
      ${mismatch}
      ${goals.length ? table(byPeriod(goals, goalRow)) : '<p class="muted empty">No goals entered from the game sheet yet.</p>'}
    </div>
    <div class="card" id="sheet-penalties">
      <div class="card-head"><h2>Penalties (${penalties.length})</h2>
        <button type="button" class="btn primary" data-action="add-sheet-penalty">Add penalty</button></div>
      ${penalties.length ? table(byPeriod(penalties, penaltyRow)) : '<p class="muted empty">No penalties entered yet.</p>'}
    </div>`;
}

// Fields for one person: a roster list for our team, or number and name for the opponent. Both are drawn; the team choice shows one.
function personFields(prefix, label, team, person, optionalNote) {
  const players = entryPlayers();
  const chosen = team === 'us' && person ? person.playerId : null;
  if (chosen && !players.some(p => p.id === chosen) && findPlayer(chosen)) players.push(findPlayer(chosen));
  const theirs = team === 'them' && person ? person : {};
  return `<div class="field person-field">
      <span>${label}${optionalNote ? ` <span class="muted">(${optionalNote})</span>` : ''}</span>
      <select name="${prefix}Player" data-our-field>
        <option value="">${optionalNote ? 'None' : 'Not recorded'}</option>
        ${players.map(p => `<option value="${escapeHtml(p.id)}" ${p.id === chosen ? 'selected' : ''}>#${escapeHtml(p.number)} ${escapeHtml(p.name)}${p.active ? '' : ' (inactive)'}</option>`).join('')}
      </select>
      <span class="person-their" data-their-field>
        <input type="text" name="${prefix}Number" value="${escapeHtml(theirs.number || '')}" placeholder="#" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="${label} jersey number">
        <input type="text" name="${prefix}Name" value="${escapeHtml(theirs.name || '')}" placeholder="Name" maxlength="40" autocomplete="off" aria-label="${label} name">
      </span>
    </div>`;
}

function readPerson(form, prefix, team) {
  const f = form.elements;
  if (team === 'us') {
    const id = f.namedItem(`${prefix}Player`).value;
    return id ? { playerId: id } : null;
  }
  const number = f.namedItem(`${prefix}Number`).value.trim();
  const name = f.namedItem(`${prefix}Name`).value.trim().replace(/\s+/g, ' ');
  return number || name ? { number, name } : null;
}

// Show our roster or the opponent's number and name boxes, depending on the team chosen.
function wireTeamFields(form) {
  const update = () => {
    const team = form.elements.namedItem('team').value;
    form.querySelectorAll('[data-our-field]').forEach(el => { el.hidden = team !== 'us'; });
    form.querySelectorAll('[data-their-field]').forEach(el => { el.hidden = team !== 'them'; });
  };
  form.querySelectorAll('input[name="team"]').forEach(r => r.addEventListener('change', update));
  update();
}

// "9:01", "901", or "14:21" → "09:01"; '' stays ''. Returns null if it can't be read or is longer than the period.
function readClockTime(text, game, period) {
  text = text.trim();
  if (!text) return '';
  let m = text.match(/^(\d{1,2}):([0-5]\d)$/) || text.match(/^(\d{1,2})([0-5]\d)$/);
  if (!m) return null;
  const minutes = Number(m[1]), seconds = Number(m[2]);
  const limit = period === 'OT' ? game.overtime.length : gamePeriodLength(game);
  if (minutes * 60 + seconds > limit * 60) return null;
  return `${String(minutes).padStart(2, '0')}:${m[2]}`;
}

function sheetCommonFields(game, item) {
  const periods = Object.fromEntries((game.overtime.on ? PERIODS : PERIODS.slice(0, 3)).map(p => [p, p === 'OT' ? 'Overtime' : String(p)]));
  return `<div class="form-grid narrow-3">
      <div class="field"><span>Period</span>${choiceButtons('period', periods, String(item.period))}</div>
      <label class="field"><span>Time on the clock</span><input type="text" name="time" value="${escapeHtml(item.time || '')}" placeholder="mm:ss" inputmode="numeric" maxlength="5" autocomplete="off"></label>
    </div>
    <div class="field"><span>Team</span>${choiceButtons('team', { us: ourTeamName(), them: opponentName(game) }, item.team)}</div>`;
}

function readSheetCommon(form, game) {
  const f = form.elements;
  const periodValue = f.namedItem('period').value;
  const period = periodValue === 'OT' ? 'OT' : Number(periodValue);
  const time = readClockTime(f.namedItem('time').value, game, period);
  return { period, time, team: f.namedItem('team').value };
}

function clockProblem(game, period) {
  const limit = period === 'OT' ? game.overtime.length : gamePeriodLength(game);
  return `Enter the time as minutes and seconds, like 9:01, no more than the ${period === 'OT' ? 'overtime' : 'period'} length (${limit}:00). Or leave it blank.`;
}

async function openSheetGoal(game, goalId) {
  const sheet = gameSheet(game);
  const existing = goalId && sheet.goals.find(g => g.id === goalId);
  const last = state.entry.lastSheet || {};
  const goal = existing || { period: last.period || 1, time: '', team: last.team || 'us', scorer: null, assists: [], strength: 'even', emptyNet: false };
  let values;
  const buttons = existing
    ? [{ label: 'Delete', value: 'delete', kind: 'danger' }, { label: 'Cancel', value: 'cancel', push: true }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }]
    : [{ label: 'Cancel', value: 'cancel' }, { label: 'Save and add another', value: 'again', check: true }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }];
  const choice = await showDialog({
    title: existing ? 'Edit goal' : 'Add goal',
    body: `${sheetCommonFields(game, goal)}
      ${personFields('scorer', 'Scorer', goal.team, goal.scorer)}
      ${personFields('assist1', 'First assist', goal.team, (goal.assists || [])[0], 'if any')}
      ${personFields('assist2', 'Second assist', goal.team, (goal.assists || [])[1], 'if any')}
      <div class="field"><span>Type <span class="muted">(for the scoring team)</span></span>${choiceButtons('strength', STRENGTHS, goal.strength)}</div>
      <label class="report-option"><input type="checkbox" name="emptyNet" ${goal.emptyNet ? 'checked' : ''}> Empty net</label>`,
    buttons,
    onOpen: wireTeamFields,
    onSubmit: (value, form) => {
      const common = readSheetCommon(form, game);
      if (common.time === null) return clockProblem(game, common.period);
      const scorer = readPerson(form, 'scorer', common.team);
      const assists = [readPerson(form, 'assist1', common.team), readPerson(form, 'assist2', common.team)].filter(Boolean);
      if (common.team === 'us') {
        const ids = [scorer && scorer.playerId, ...assists.map(a => a.playerId)].filter(Boolean);
        if (new Set(ids).size !== ids.length) return 'The same player is listed twice.';
      }
      for (const p of [scorer, ...assists]) if (p && p.number && !/^\d{1,2}$/.test(p.number)) return 'Jersey numbers should be 0 to 99.';
      values = { ...common, scorer, assists, strength: form.elements.namedItem('strength').value, emptyNet: form.elements.namedItem('emptyNet').checked };
      return null;
    },
  });
  if (choice === 'delete') return deleteSheetItem(game.id, 'goals', existing.id);
  if (choice !== 'save' && choice !== 'again') return;
  const saved = existing ? { ...existing, ...values } : { id: newId(), ...values, createdAt: new Date().toISOString() };
  const goals = existing ? sheet.goals.map(g => g.id === existing.id ? saved : g) : [...sheet.goals, saved];
  await saveRecord('games', { ...findGame(game.id), gameSheet: { ...sheet, goals } });
  state.entry.lastSheet = { period: values.period, team: values.team };
  renderKeepingFocus();
  showToast(existing ? 'Goal saved.' : 'Goal added.');
  if (choice === 'again') openSheetGoal(findGame(game.id));
}

async function openSheetPenalty(game, penaltyId) {
  const sheet = gameSheet(game);
  const existing = penaltyId && sheet.penalties.find(p => p.id === penaltyId);
  const last = state.entry.lastSheet || {};
  const penalty = existing || { period: last.period || 1, time: '', team: last.team || 'them', player: null, infraction: '', type: 'minor', minutes: 2 };
  let values;
  const buttons = existing
    ? [{ label: 'Delete', value: 'delete', kind: 'danger' }, { label: 'Cancel', value: 'cancel', push: true }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }]
    : [{ label: 'Cancel', value: 'cancel' }, { label: 'Save and add another', value: 'again', check: true }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }];
  const choice = await showDialog({
    title: existing ? 'Edit penalty' : 'Add penalty',
    body: `${sheetCommonFields(game, penalty)}
      ${personFields('player', 'Player', penalty.team, penalty.player)}
      <label class="field"><span>Infraction</span>
        <input type="text" name="infraction" list="infraction-list" value="${escapeHtml(penalty.infraction || '')}" placeholder="For example, Tripping" maxlength="60" autocomplete="off">
        <datalist id="infraction-list">${COMMON_INFRACTIONS.map(i => `<option value="${i}">`).join('')}</datalist></label>
      <div class="form-grid narrow-3">
        <div class="field"><span>Type</span>${choiceButtons('type', Object.fromEntries(Object.entries(PENALTY_TYPES).map(([k, v]) => [k, v.label])), penalty.type)}</div>
        <label class="field"><span>Minutes</span><input type="number" name="minutes" value="${penalty.minutes ?? ''}" min="0" max="20" inputmode="numeric"></label>
      </div>`,
    buttons,
    onOpen: (form) => {
      wireTeamFields(form);
      // Choosing a type fills in its usual minutes.
      form.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener('change', () => {
        form.elements.namedItem('minutes').value = PENALTY_TYPES[r.value].minutes;
      }));
    },
    onSubmit: (value, form) => {
      const common = readSheetCommon(form, game);
      if (common.time === null) return clockProblem(game, common.period);
      const player = readPerson(form, 'player', common.team);
      if (player && player.number && !/^\d{1,2}$/.test(player.number)) return 'Jersey numbers should be 0 to 99.';
      const minutes = Number(form.elements.namedItem('minutes').value);
      if (!Number.isInteger(minutes) || minutes < 0 || minutes > 20) return 'Minutes should be a whole number from 0 to 20.';
      values = { ...common, player, infraction: form.elements.namedItem('infraction').value.trim(), type: form.elements.namedItem('type').value, minutes };
      return null;
    },
  });
  if (choice === 'delete') return deleteSheetItem(game.id, 'penalties', existing.id);
  if (choice !== 'save' && choice !== 'again') return;
  const saved = existing ? { ...existing, ...values } : { id: newId(), ...values, createdAt: new Date().toISOString() };
  const penalties = existing ? sheet.penalties.map(p => p.id === existing.id ? saved : p) : [...sheet.penalties, saved];
  await saveRecord('games', { ...findGame(game.id), gameSheet: { ...sheet, penalties } });
  state.entry.lastSheet = { period: values.period, team: values.team };
  renderKeepingFocus();
  showToast(existing ? 'Penalty saved.' : 'Penalty added.');
  if (choice === 'again') openSheetPenalty(findGame(game.id));
}

async function deleteSheetItem(gameId, list, itemId) {
  const what = list === 'goals' ? 'goal' : 'penalty';
  if (!await confirmDialog(`Delete ${what}?`, `Delete this ${what} from the game sheet? This can’t be undone.`, 'Delete')) return;
  const game = findGame(gameId);
  const sheet = gameSheet(game);
  await saveRecord('games', { ...game, gameSheet: { ...sheet, [list]: sheet[list].filter(i => i.id !== itemId) } });
  renderKeepingFocus();
  showToast(`${what[0].toUpperCase() + what.slice(1)} deleted.`);
}

function renderSpecialTeamsTab(game) {
  const st = gameSpecialTeams(game);
  const tagged = taggedSpecialGoals(game);
  const counter = (field) => {
    const value = st[field];
    const label = SPECIAL_FIELDS[field];
    return `<div class="field st-field">
        <label class="field-label" for="st-${field}">${label}</label>
        <span class="counter">
          <button type="button" class="step" data-action="st-step" data-field="${field}" data-value="-1" tabindex="-1" aria-label="One fewer: ${label}" ${value ? '' : 'disabled'}>−</button>
          <input type="number" id="st-${field}" data-st-field="${field}" value="${value ?? ''}" min="0" max="30" inputmode="numeric" placeholder="–">
          <button type="button" class="step" data-action="st-step" data-field="${field}" data-value="1" tabindex="-1" aria-label="One more: ${label}">+</button>
        </span>
      </div>`;
  };
  const ppLine = st.ppOpportunities == null ? '<span class="muted">Not entered yet</span>'
    : `<strong>${st.ppGoals || 0} of ${st.ppOpportunities}</strong> · ${percentWhole(st.ppOpportunities ? (st.ppGoals || 0) / st.ppOpportunities : null)}`;
  const pkKilled = st.pkTimes == null ? null : Math.max(0, st.pkTimes - (st.pkGoalsAgainst || 0));
  const pkLine = st.pkTimes == null ? '<span class="muted">Not entered yet</span>'
    : `<strong>Killed ${pkKilled} of ${st.pkTimes}</strong> · ${percentWhole(st.pkTimes ? pkKilled / st.pkTimes : null)}`;
  const notes = (kind) => {
    const out = [];
    const goals = kind === 'pp' ? st.ppGoals : st.pkGoalsAgainst;
    const chances = kind === 'pp' ? st.ppOpportunities : st.pkTimes;
    const fromShots = kind === 'pp' ? tagged.ppGoals : tagged.pkGoalsAgainst;
    if (goals != null && chances != null && goals > chances) {
      out.push(`More goals than ${kind === 'pp' ? 'power plays' : 'times shorthanded'}. That’s possible on a 5-minute major or a double minor, but worth checking.`);
    }
    if (tagged.anyTagged && goals != null && goals !== fromShots) {
      const what = kind === 'pp' ? (fromShots === 1 ? 'power play goal' : 'power play goals') : (fromShots === 1 ? 'power play goal against' : 'power play goals against');
      out.push(`The shots entered for this game include ${fromShots} ${what}. You entered ${goals}.`);
    }
    return out.map(n => `<p class="notice warn st-note">${escapeHtml(n)}</p>`).join('');
  };

  return `<div class="card" id="special-entry">
      <h2>Power play and penalty kill</h2>
      <p class="muted small">From the game sheet. Tap + or type the numbers, and they save right away. Leave them blank if you didn’t track them for this game.</p>
      <div class="st-grid">
        <section class="st-box" id="st-pp">
          <h3>Power play</h3>
          <div class="st-fields">${counter('ppOpportunities')}${counter('ppGoals')}</div>
          <p class="st-result">${ppLine}</p>
          ${notes('pp')}
        </section>
        <section class="st-box" id="st-pk">
          <h3>Penalty kill</h3>
          <div class="st-fields">${counter('pkTimes')}${counter('pkGoalsAgainst')}</div>
          <p class="st-result">${pkLine}</p>
          ${notes('pk')}
        </section>
      </div>
    </div>`;
}

async function saveSpecialTeamsField(gameId, field, value) {
  const game = findGame(gameId);
  const st = gameSpecialTeams(game);
  st[field] = value;
  // Entering the number of power plays (or times shorthanded) for the first time starts the goals at 0.
  if (field === 'ppOpportunities' && value != null && st.ppGoals == null) st.ppGoals = 0;
  if (field === 'pkTimes' && value != null && st.pkGoalsAgainst == null) st.pkGoalsAgainst = 0;
  await saveRecord('games', { ...game, specialTeams: st });
  renderKeepingFocus();
}

// The power play % and penalty kill % panels at the top of Stats → Special teams.
function renderSpecialTeamsPercentages(games) {
  const p = specialTeamsPercentages(games);
  const missingPp = games.length - p.ppGames, missingPk = games.length - p.pkGames;
  if (!p.ppGames && !p.pkGames) {
    return `<div class="card" id="special-percentages"><h2>Power play and penalty kill</h2>
      <p class="muted">No power play or penalty kill numbers entered for these games yet. Add them on each game’s “Power play and penalty kill” tab.</p></div>`;
  }
  const meter = (fraction, label) => `<div class="meter" role="img" aria-label="${label}"><span style="width:${fraction == null ? 0 : Math.round(fraction * 1000) / 10}%"></span></div>`;
  const gamesLine = (entered, missing) => `${entered} ${entered === 1 ? 'game' : 'games'}${missing ? ` · ${missing} without numbers entered, left out` : ''}`;
  const rows = [...games].sort(compareGames).reverse().map(g => {
    const st = gameSpecialTeams(g);
    const pp = st.ppOpportunities == null ? '<span class="muted">–</span>'
      : `${st.ppGoals || 0} of ${st.ppOpportunities} <span class="muted">· ${percentWhole(st.ppOpportunities ? (st.ppGoals || 0) / st.ppOpportunities : null)}</span>`;
    const killed = st.pkTimes == null ? null : Math.max(0, st.pkTimes - (st.pkGoalsAgainst || 0));
    const pk = st.pkTimes == null ? '<span class="muted">–</span>'
      : `${killed} of ${st.pkTimes} <span class="muted">· ${percentWhole(st.pkTimes ? killed / st.pkTimes : null)}</span>`;
    return `<tr><td><a href="#game/${escapeHtml(g.id)}">${escapeHtml(shortGameLabel(g))}</a></td><td class="num">${pp}</td><td class="num">${pk}</td></tr>`;
  }).join('');

  return `<section class="card" id="special-percentages">
      <h2>Power play and penalty kill</h2>
      <div class="pct-panels">
        <div class="pct-panel" id="pp-percent">
          <span class="pct-label">Power play</span>
          <span class="pct-value">${percentWhole(p.ppPercent)}</span>
          <span class="pct-detail">${p.ppGames ? `${p.ppGoals} ${p.ppGoals === 1 ? 'goal' : 'goals'} on ${p.ppOpportunities} power ${p.ppOpportunities === 1 ? 'play' : 'plays'}` : 'Not entered yet'}</span>
          ${meter(p.ppPercent, `Power play ${percentWhole(p.ppPercent)}`)}
          <span class="muted small">${gamesLine(p.ppGames, missingPp)}</span>
        </div>
        <div class="pct-panel" id="pk-percent">
          <span class="pct-label">Penalty kill</span>
          <span class="pct-value">${percentWhole(p.pkPercent)}</span>
          <span class="pct-detail">${p.pkGames ? `Killed ${p.pkKilled} of ${p.pkTimes} · ${p.pkGoalsAgainst} ${p.pkGoalsAgainst === 1 ? 'goal' : 'goals'} against` : 'Not entered yet'}</span>
          ${meter(p.pkPercent, `Penalty kill ${percentWhole(p.pkPercent)}`)}
          <span class="muted small">${gamesLine(p.pkGames, missingPk)}</span>
        </div>
      </div>
      <p class="hint">Power play % is goals ÷ power plays. Penalty kill % is power plays killed (no goal against) ÷ times shorthanded. These use the numbers entered for each game, so only the Games filter applies to them.</p>
      <div class="table-scroll"><table class="simple pct-table">
        <colgroup><col><col style="width:200px"><col style="width:200px"></colgroup>
        <tr><th>Game</th><th class="num">Power play</th><th class="num">Penalty kill (killed)</th></tr>
        ${rows}
      </table></div>
    </section>`;
}

/* ----- Stats: special teams ----- */

const pctOrDash = (part, whole) => whole ? `${Math.round(100 * part / whole)}%` : '–';
const shortGameLabel = (game) => `${new Date(...game.date.split('-').map((n, i) => i === 1 ? n - 1 : +n)).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} vs ${opponentName(game)}`;

function specialTally(list) {
  return {
    onGoal: list.filter(isOnGoal).length,
    goals: list.filter(s => s.result === 'goal').length,
    gradeA: list.filter(isGradeAShot).length,   // Grade A shots (on goal)
  };
}

function renderSpecialTeamsView() {
  const f = state.filters;
  const games = filteredGames(f).sort(compareGames).reverse();   // newest first
  const inPeriod = (s) => f.period === 'all' || s.period === f.period;
  const shotsFor = (gameIds, team, situation) => state.shots.filter(s => gameIds.has(s.gameId) && s.team === team && s.situation === situation && inPeriod(s));
  const allIds = new Set(games.map(g => g.id));
  const any = state.shots.some(s => allIds.has(s.gameId) && s.situation !== 'even' && inPeriod(s));
  const us = escapeHtml(ourTeamName());
  const them = escapeHtml(opponentHeading(games).replace(/’$/, ''));
  const periodNote = f.period === 'all' ? '' : ` ${periodLabel(f.period)} only.`;

  const percentages = renderSpecialTeamsPercentages(games);
  if (!any) {
    return `${percentages}<div class="card placeholder"><p class="muted">No shots in these games were entered as Power play or Penalty kill.${periodNote}
      The shot numbers for special teams come from the Situation buttons when entering shots.</p></div>`;
  }

  // One card: power play (situation 'pp') or penalty kill ('pk'). "Main" is the team with the extra player.
  const card = (situation) => {
    const pp = situation === 'pp';
    const mainTeam = pp ? 'us' : 'them', otherTeam = pp ? 'them' : 'us';
    const main = specialTally(shotsFor(allIds, mainTeam, situation));
    const other = specialTally(shotsFor(allIds, otherTeam, situation));
    const mainName = pp ? us : them, otherName = pp ? them : us;
    const rows = games.map(g => {
      const ids = new Set([g.id]);
      const m = specialTally(shotsFor(ids, mainTeam, situation)), o = specialTally(shotsFor(ids, otherTeam, situation));
      const none = !m.onGoal && !m.goals && !o.onGoal && !o.goals;
      return `<tr class="${none ? 'quiet' : ''}"><td><a href="#game/${escapeHtml(g.id)}">${escapeHtml(shortGameLabel(g))}</a></td>
        <td class="num">${m.onGoal}</td><td class="num">${m.goals}</td><td class="num">${o.onGoal}</td><td class="num">${o.goals}</td></tr>`;
    }).join('');
    const tile = (label, value, detail) => `<div class="stat-tile"><span class="tile-label">${label}</span><span class="tile-value">${value}</span>${detail ? `<span class="tile-detail">${detail}</span>` : ''}</div>`;
    return `<section class="card special-card" id="special-${situation}">
        <h2>${pp ? 'Power play' : 'Penalty kill'}</h2>
        <p class="muted small">${pp ? `When ${us} had the extra player.` : `When ${us} were short a player.`}${periodNote}</p>
        <div class="special-groups">
          <div>
            <h3 class="group-label">${mainName}${pp ? ' on the power play' : ' on the power play (against us)'}</h3>
            <div class="tiles">
              ${tile('Shots on goal', main.onGoal)}
              ${tile('Goals', main.goals, `Scoring percentage ${pctOrDash(main.goals, main.onGoal)} (${main.goals} on ${main.onGoal})`)}
              ${tile('Grade A shots', main.gradeA)}
            </div>
          </div>
          <div>
            <h3 class="group-label">${otherName} shorthanded</h3>
            <div class="tiles">
              ${tile('Shots on goal', other.onGoal)}
              ${tile('Goals', other.goals, pp ? 'Shorthanded goals against us' : 'Shorthanded goals for us')}
            </div>
          </div>
        </div>
        <div class="table-scroll"><table class="simple special-table">
          <colgroup><col><col style="width:130px"><col style="width:100px"><col style="width:130px"><col style="width:100px"></colgroup>
          <tr><th rowspan="2">Game</th><th colspan="2" class="group">${mainName} (extra player)</th><th colspan="2" class="group">${otherName} (shorthanded)</th></tr>
          <tr><th class="num">Shots on goal</th><th class="num">Goals</th><th class="num">Shots on goal</th><th class="num">Goals</th></tr>
          ${rows}
          <tr class="total-row"><td>Total (${games.length} ${games.length === 1 ? 'game' : 'games'})</td>
            <td class="num">${main.onGoal}</td><td class="num">${main.goals}</td><td class="num">${other.onGoal}</td><td class="num">${other.goals}</td></tr>
        </table></div>
      </section>`;
  };

  return `${percentages}
    <h2 class="view-section-title">Special teams shots</h2>
    <p class="muted basis">Shots on goal are on net plus goals. Situations are from ${us}’ point of view, as entered.</p>
    ${card('pp')}${card('pk')}`;
}


/* ----- Stats: penalty shots and shootouts ----- */

function renderPenaltiesStatsView() {
  const games = filteredGames(state.filters);
  const ids = new Set(games.map(g => g.id));
  const penalty = state.penaltyShots.filter(p => ids.has(p.gameId));
  const shootout = state.shootoutAttempts.filter(a => ids.has(a.gameId));
  const us = escapeHtml(ourTeamName());
  const shootoutGames = games.filter(g => g.shootout && state.shootoutAttempts.some(a => a.gameId === g.id)).sort(compareGames).reverse();

  if (!penalty.length && !shootout.length) {
    return `<div class="card placeholder"><p class="muted">No penalty shots or shootouts in these games.</p></div>`;
  }

  // Our shooters: penalty shots and shootout attempts, then both together.
  const byShooter = new Map();
  const add = (attempt, kind) => {
    const key = attempt.shooterId || 'none';
    const row = byShooter.get(key) || { key, ps: { att: 0, goals: 0 }, so: { att: 0, goals: 0 } };
    row[kind].att++;
    if (attempt.result === 'goal') row[kind].goals++;
    byShooter.set(key, row);
  };
  penalty.filter(p => p.team === 'us').forEach(p => add(p, 'ps'));
  shootout.filter(a => a.team === 'us').forEach(a => add(a, 'so'));
  const rows = [...byShooter.values()].map(r => ({ ...r, all: { att: r.ps.att + r.so.att, goals: r.ps.goals + r.so.goals } }))
    .sort((a, b) => (a.key === 'none') - (b.key === 'none') || b.all.att - a.all.att || b.all.goals - a.all.goals ||
                    Number((findPlayer(a.key) || {}).number) - Number((findPlayer(b.key) || {}).number));
  const cells = (c) => `<td class="num">${c.att}</td><td class="num">${c.goals}</td><td class="num">${pctOrDash(c.goals, c.att)}</td>`;
  const total = (list) => ({ att: list.length, goals: list.filter(a => a.result === 'goal').length });
  const teamPs = total(penalty.filter(p => p.team === 'us')), teamSo = total(shootout.filter(a => a.team === 'us'));
  const oppPs = total(penalty.filter(p => p.team === 'them')), oppSo = total(shootout.filter(a => a.team === 'them'));
  const nameOf = (key) => key === 'none' ? '<span class="muted">Shooter not recorded</span>'
    : (() => { const p = findPlayer(key); return p ? `<span class="jersey-inline">#${escapeHtml(p.number)}</span> ${escapeHtml(p.name)}${p.active ? '' : ' <span class="tag">Inactive</span>'}` : 'Unknown player'; })();

  const wins = shootoutGames.filter(g => gameResult(g) === 'SOW').length;
  const losses = shootoutGames.filter(g => gameResult(g) === 'SOL').length;
  const record = shootoutGames.length ? `${wins} ${wins === 1 ? 'win' : 'wins'}, ${losses} ${losses === 1 ? 'loss' : 'losses'}` : 'No shootouts';
  const oppHeading = escapeHtml(opponentHeading(games).replace(/’$/, ''));

  return `<p class="muted basis">Goal % is goals ÷ attempts. Shootout goals never count toward game scores or players’ regular goals.</p>
    <section class="card">
      <h2>${us} shooters</h2>
      <div class="table-scroll"><table class="simple penalty-table">
        <colgroup><col><col class="n"><col class="n"><col class="p"><col class="n"><col class="n"><col class="p"><col class="n"><col class="n"><col class="p"></colgroup>
        <tr><th rowspan="2">Player</th><th colspan="3" class="group">Penalty shots</th><th colspan="3" class="group">Shootout</th><th colspan="3" class="group">Combined</th></tr>
        <tr>${'<th class="num">Attempts</th><th class="num">Goals</th><th class="num">Goal %</th>'.repeat(3)}</tr>
        ${rows.map(r => `<tr><td>${nameOf(r.key)}</td>${cells(r.ps)}${cells(r.so)}${cells(r.all)}</tr>`).join('')}
        <tr class="total-row"><td>Team</td>${cells(teamPs)}${cells(teamSo)}${cells({ att: teamPs.att + teamSo.att, goals: teamPs.goals + teamSo.goals })}</tr>
      </table></div>
    </section>
    <div class="penalty-bottom">
      <section class="card">
        <h2>${oppHeading} against us</h2>
        <table class="simple opp-table">
          <tr><th></th><th class="num">Attempts</th><th class="num">Goals</th><th class="num">Goal %</th></tr>
          <tr><td>Penalty shots</td>${cells(oppPs)}</tr>
          <tr><td>Shootout attempts</td>${cells(oppSo)}</tr>
        </table>
      </section>
      <section class="card" id="shootout-record">
        <div class="card-head"><h2>Shootout record</h2><p class="record-line"><strong>${record}</strong></p></div>
        ${shootoutGames.length ? `<table class="simple">
          ${shootoutGames.map(g => {
            const so = shootoutScore(g), result = gameResult(g);
            return `<tr><td><a href="#game/${escapeHtml(g.id)}">${escapeHtml(shortGameLabel(g))}</a></td>
              <td class="num">${gameScore(g).us}–${gameScore(g).them}, shootout ${so.us}–${so.them}</td>
              <td class="num">${result === 'SOW' || result === 'SOL' ? resultBadge(result) : '<span class="tag">Not decided</span>'}</td></tr>`;
          }).join('')}
        </table>` : '<p class="muted empty">No shootouts in these games.</p>'}
      </section>
    </div>`;
}

/* ----- Stats: faceoffs ----- */

function renderFaceoffStatsView() {
  const games = filteredGames(state.filters);
  const ids = new Set(games.map(g => g.id));
  const records = state.faceoffs.filter(r => ids.has(r.gameId));
  const byPlayer = new Map();
  for (const r of records) {
    const row = byPlayer.get(r.playerId) || { player: findPlayer(r.playerId), wins: 0, losses: 0 };
    row[r.result === 'win' ? 'wins' : 'losses']++;
    byPlayer.set(r.playerId, row);
  }
  const rows = [...byPlayer.values()].filter(r => r.player).map(r => ({ ...r, total: r.wins + r.losses, pct: r.wins / (r.wins + r.losses) }));
  const sort = state.faceoffSort || { key: 'total', dir: 'desc' };
  const value = (r) => sort.key === 'player' ? Number(r.player.number) : r[sort.key];
  rows.sort((a, b) => {
    const diff = sort.key === 'player' ? value(a) - value(b) : value(a) - value(b);
    return (sort.dir === 'asc' ? diff : -diff) || b.total - a.total || Number(a.player.number) - Number(b.player.number);
  });
  const wins = records.filter(r => r.result === 'win').length, total = records.length;
  const header = (key, label, numeric) => {
    const active = sort.key === key;
    const ariaSort = active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
    return `<th class="${numeric ? 'num' : ''}" aria-sort="${ariaSort}"><button type="button" class="sort-button ${active ? 'on' : ''}" data-action="sort-faceoffs" data-value="${key}">${label}<span class="sort-arrow" aria-hidden="true">${active ? (sort.dir === 'asc' ? '▲' : '▼') : ''}</span></button></th>`;
  };
  const pctText = (w, t) => t ? `${w} of ${t} — ${Math.round(100 * w / t)}%` : '–';

  return `<div class="card">
      <div class="card-head"><h2>Faceoffs</h2>
        <p class="team-faceoffs"><strong>${escapeHtml(ourTeamName())}: ${pctText(wins, total)}</strong></p></div>
      <p class="muted small">${games.length} ${games.length === 1 ? 'game' : 'games'}. Click a column heading to sort. Counts are shown with every percentage because a few faceoffs can swing it a lot.</p>
      ${rows.length ? `<div class="table-scroll"><table class="simple faceoff-stats">
          <colgroup><col><col style="width:110px"><col style="width:110px"><col style="width:110px"><col style="width:190px"></colgroup>
          <tr>${header('player', 'Player')}${header('wins', 'Wins', true)}${header('losses', 'Losses', true)}${header('total', 'Total', true)}${header('pct', 'Won', true)}</tr>
          ${rows.map(r => `<tr>
            <td><span class="jersey-inline">#${escapeHtml(r.player.number)}</span> ${escapeHtml(r.player.name)}${r.player.active ? '' : ' <span class="tag">Inactive</span>'}</td>
            <td class="num">${r.wins}</td><td class="num">${r.losses}</td><td class="num">${r.total}</td><td class="num">${pctText(r.wins, r.total)}</td></tr>`).join('')}
          <tr class="total-row"><td>Team</td><td class="num">${wins}</td><td class="num">${total - wins}</td><td class="num">${total}</td><td class="num">${pctText(wins, total)}</td></tr>
        </table></div>` : '<p class="muted empty">No faceoffs entered for these games.</p>'}
    </div>`;
}

async function saveSetting(input) {
  const key = input.dataset.setting;
  let value = input.value;
  if (key === 'teamName' || key === 'seasonLabel') value = value.trim();
  if (key === 'periodLength') {
    value = Number(value);
    if (!Number.isInteger(value) || value < 1 || value > 60) {
      input.value = state.settings.periodLength;
      showMessage('Period length', 'Period length must be a whole number of minutes, from 1 to 60.');
      return;
    }
  }
  input.value = value;
  if (state.settings[key] === value) return;
  await saveRecord('settings', { ...state.settings, [key]: value });
  // Update just the parts that depend on the setting, so typing in the next box isn't interrupted.
  document.getElementById('standard-length-note').innerHTML = standardLengthText();
  showToast('Saved.');
}


/* ----- Setup: roster ----- */

function renderRosterCard() {
  const active = state.players.filter(p => p.active);
  const inactive = sortByNumber(state.players.filter(p => !p.active));
  const groupCounts = ['F', 'D', 'G'].map(pos => {
    const n = active.filter(p => p.position === pos).length;
    return n ? `${n} ${n === 1 ? POSITIONS[pos].toLowerCase() : POSITION_GROUPS[pos].toLowerCase()}` : '';
  }).filter(Boolean).join(', ');

  const groups = ['F', 'D', 'G'].map(pos => {
    const list = sortByNumber(active.filter(p => p.position === pos));
    if (!list.length) return '';
    return `<h3 class="group-label">${POSITION_GROUPS[pos]}</h3>
      <table class="simple list">${list.map(p => playerRow(p, false)).join('')}</table>`;
  }).join('');

  return `<div class="card" id="roster-card">
      <div class="card-head">
        <h2>Roster</h2>
        <button type="button" class="btn primary" data-action="add-player">Add player</button>
      </div>
      ${active.length
        ? `<p class="muted summary">${active.length} active ${active.length === 1 ? 'player' : 'players'}: ${groupCounts}</p>${groups}`
        : '<p class="muted empty">No players yet. Click “Add player” to build your roster.</p>'}
      ${inactive.length ? `<details class="inactive"><summary>Inactive players (${inactive.length})</summary>
        <p class="muted small">Inactive players stay in past stats but don’t appear on game entry screens.</p>
        <table class="simple list">${inactive.map(p => playerRow(p, true)).join('')}</table></details>` : ''}
    </div>`;
}

function playerRow(player, showPosition) {
  return `<tr>
      <td class="jersey">#${escapeHtml(player.number)}</td>
      <td>${escapeHtml(player.name)}</td>
      ${showPosition ? `<td class="detail muted">${POSITIONS[player.position]}</td>` : ''}
      <td class="detail muted">Shoots ${SHOOTS[player.shoots].toLowerCase()}</td>
      <td class="edit"><button type="button" class="btn small" data-action="edit-player" data-id="${escapeHtml(player.id)}">Edit</button></td>
    </tr>`;
}

function playerFormHtml(player) {
  return `<div class="form-grid narrow">
      <label class="field"><span>Jersey number</span>
        <input type="text" name="number" value="${escapeHtml(player.number || '')}" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label class="field"><span>Name</span>
        <input type="text" name="playerName" value="${escapeHtml(player.name || '')}" maxlength="40" autocomplete="off"></label>
    </div>
    <div class="field" style="margin-top:14px"><span>Position</span>${choiceButtons('position', POSITIONS, player.position)}</div>
    <div class="field"><span>Shoots</span>${choiceButtons('shoots', SHOOTS, player.shoots)}</div>`;
}

function readPlayerForm(form) {
  let number = form.elements.namedItem('number').value.trim();
  if (/^0\d$/.test(number) && number !== '00') number = number.slice(1);  // "09" is the same as "9"
  return {
    number,
    name: form.elements.namedItem('playerName').value.trim().replace(/\s+/g, ' '),
    position: form.elements.namedItem('position').value,
    shoots: form.elements.namedItem('shoots').value,
  };
}

// Returns a plain-language problem, or nothing if the player can be saved.
function checkPlayer(values, willBeActive, playerId) {
  if (!/^\d{1,2}$/.test(values.number)) return 'Enter a jersey number from 0 to 99.';
  if (!values.name) return 'Enter the player’s name.';
  if (!POSITIONS[values.position]) return 'Choose a position.';
  if (!SHOOTS[values.shoots]) return 'Choose which way the player shoots.';
  if (willBeActive) {
    const clash = state.players.find(p => p.active && p.id !== playerId && p.number === values.number);
    if (clash) return `Number ${values.number} is already used by ${clash.name}. Two active players can’t share a number.`;
  }
  return null;
}

async function openAddPlayer(defaults = { position: 'F', shoots: 'L' }) {
  let values;
  const choice = await showDialog({
    title: 'Add player',
    body: playerFormHtml(defaults),
    buttons: [
      { label: 'Cancel', value: 'cancel' },
      { label: 'Save and add another', value: 'again', check: true },
      { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true },
    ],
    onSubmit: (value, form) => { values = readPlayerForm(form); return checkPlayer(values, true, null); },
  });
  if (choice !== 'save' && choice !== 'again') return;
  await saveRecord('players', { id: newId(), ...values, active: true });
  render();
  showToast(`Added #${values.number} ${values.name}.`);
  if (choice === 'again') openAddPlayer({ position: values.position, shoots: values.shoots });
}

async function openEditPlayer(playerId) {
  const player = state.players.find(p => p.id === playerId);
  if (!player) return;
  const hasStats = playerHasStats(playerId);
  const buttons = [];
  if (!hasStats) buttons.push({ label: 'Delete', value: 'delete', kind: 'danger' });
  buttons.push(player.active
    ? { label: 'Make inactive', value: 'deactivate', check: true, push: true }
    : { label: 'Make active', value: 'activate', check: true, push: true });
  buttons.push({ label: 'Cancel', value: 'cancel' });
  buttons.push({ label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true });

  const note = hasStats
    ? 'This player has stats, so they can’t be deleted. If they leave the team, make them inactive. Their stats stay.'
    : (player.active ? 'Inactive players are hidden from game entry but stay in past stats.' : '');

  let values;
  const choice = await showDialog({
    title: `Edit #${player.number} ${player.name}`,
    body: playerFormHtml(player) + (note ? `<p class="muted small dialog-note">${escapeHtml(note)}</p>` : ''),
    buttons,
    onSubmit: (value, form) => {
      values = readPlayerForm(form);
      const willBeActive = value === 'activate' || (value === 'save' && player.active);
      return checkPlayer(values, willBeActive, player.id);
    },
  });

  if (choice === 'delete') {
    if (await confirmDialog('Delete player?', `Delete #${player.number} ${player.name}? This can’t be undone.`, 'Delete')) {
      await deleteRecord('players', player.id);
      showToast('Player deleted.');
    }
  } else if (choice === 'save') {
    await saveRecord('players', { ...player, ...values });
    showToast('Saved.');
  } else if (choice === 'deactivate' || choice === 'activate') {
    await saveRecord('players', { ...player, ...values, active: choice === 'activate' });
    showToast(choice === 'activate' ? `#${values.number} ${values.name} is active again.` : `#${values.number} ${values.name} is now inactive.`);
  }
  render();
}


/* ----- Setup: opponents ----- */

function renderOpponentsCard() {
  const byName = (a, b) => a.name.localeCompare(b.name);
  const active = state.opponents.filter(o => o.active).sort(byName);
  const inactive = state.opponents.filter(o => !o.active).sort(byName);
  const row = (o) => `<tr><td>${escapeHtml(o.name)}</td>
      <td class="edit"><button type="button" class="btn small" data-action="edit-opponent" data-id="${escapeHtml(o.id)}">Edit</button></td></tr>`;
  return `<div class="card" id="opponents-card">
      <div class="card-head">
        <h2>Opponents</h2>
        <button type="button" class="btn primary" data-action="add-opponent">Add opponent</button>
      </div>
      ${active.length
        ? `<table class="simple list">${active.map(row).join('')}</table>`
        : '<p class="muted empty">No opponents yet. Add them here, or type a new one in when you set up a game.</p>'}
      ${inactive.length ? `<details class="inactive"><summary>Inactive opponents (${inactive.length})</summary>
        <p class="muted small">Inactive opponents stay in past games but aren’t offered when you set up a new game.</p>
        <table class="simple list">${inactive.map(row).join('')}</table></details>` : ''}
    </div>`;
}

function readOpponentForm(form) {
  return { name: form.elements.namedItem('opponentName').value.trim().replace(/\s+/g, ' ') };
}

function checkOpponent(values, opponentId) {
  if (!values.name) return 'Enter the team’s name.';
  const clash = state.opponents.find(o => o.id !== opponentId && o.name.toLowerCase() === values.name.toLowerCase());
  if (clash) return `There’s already an opponent called ${clash.name}${clash.active ? '' : ' (in the inactive list)'}.`;
  return null;
}

const opponentFormHtml = (opponent) => `<label class="field"><span>Team name</span>
    <input type="text" name="opponentName" value="${escapeHtml(opponent.name || '')}" maxlength="50" autocomplete="off"></label>`;

async function openAddOpponent() {
  let values;
  const choice = await showDialog({
    title: 'Add opponent',
    body: opponentFormHtml({}),
    buttons: [
      { label: 'Cancel', value: 'cancel' },
      { label: 'Save and add another', value: 'again', check: true },
      { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true },
    ],
    onSubmit: (value, form) => { values = readOpponentForm(form); return checkOpponent(values, null); },
  });
  if (choice !== 'save' && choice !== 'again') return;
  await saveRecord('opponents', { id: newId(), ...values, active: true });
  render();
  showToast(`Added ${values.name}.`);
  if (choice === 'again') openAddOpponent();
}

async function openEditOpponent(opponentId) {
  const opponent = state.opponents.find(o => o.id === opponentId);
  if (!opponent) return;
  const hasGames = opponentHasGames(opponentId);
  const buttons = [];
  if (!hasGames) buttons.push({ label: 'Delete', value: 'delete', kind: 'danger' });
  buttons.push(opponent.active
    ? { label: 'Make inactive', value: 'deactivate', check: true, push: true }
    : { label: 'Make active', value: 'activate', check: true, push: true });
  buttons.push({ label: 'Cancel', value: 'cancel' });
  buttons.push({ label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true });
  const note = hasGames ? 'This opponent has games, so it can’t be deleted. You can make it inactive instead.' : '';

  let values;
  const choice = await showDialog({
    title: `Edit ${opponent.name}`,
    body: opponentFormHtml(opponent) + (note ? `<p class="muted small dialog-note">${escapeHtml(note)}</p>` : ''),
    buttons,
    onSubmit: (value, form) => { values = readOpponentForm(form); return checkOpponent(values, opponent.id); },
  });

  if (choice === 'delete') {
    if (await confirmDialog('Delete opponent?', `Delete ${opponent.name}? This can’t be undone.`, 'Delete')) {
      await deleteRecord('opponents', opponent.id);
      showToast('Opponent deleted.');
    }
  } else if (choice === 'save') {
    await saveRecord('opponents', { ...opponent, ...values });
    showToast('Saved.');
  } else if (choice === 'deactivate' || choice === 'activate') {
    await saveRecord('opponents', { ...opponent, ...values, active: choice === 'activate' });
    showToast(choice === 'activate' ? `${values.name} is active again.` : `${values.name} is now inactive.`);
  }
  render();
}


/* ----- Setup: backup, storage, start over ----- */

function renderBackupCards() {
  const status = backupStatus();
  const counts = recordCounts();
  const countRows = LIST_STORES.map(name =>
    `<tr><td>${STORE_LABELS[name]}</td><td class="num">${counts[name]}</td></tr>`).join('');
  let protectionText = 'Checking…';
  if (state.storageProtected === true) protectionText = 'Chrome has agreed to protect this data from automatic clean-up.';
  else if (state.storageProtected === false) protectionText = 'Chrome hasn’t promised to protect this data from automatic clean-up, so regular backups are especially important.';
  else if (state.storageProtected === null) protectionText = 'Chrome didn’t say whether it will protect this data, so keep regular backups.';

  return `<div class="card" id="backup-card">
      <h2>Backup and restore</h2>
      <p>Your stats are stored inside Chrome on this computer. A backup file protects them if Chrome’s data is ever cleared, and lets you move everything to another computer.</p>
      <p class="status-line ${status.level}">${escapeHtml(status.long)}</p>
      <div class="row">
        <button type="button" class="btn primary" data-action="backup">Download backup</button>
        <button type="button" class="btn" data-action="restore">Restore from a backup file…</button>
      </div>
      <p class="muted small" style="margin-top:12px">Backups go to your Downloads folder. It’s a good idea to move them somewhere safe, like your Documents folder or a cloud drive. Don’t edit backup files. The app checks them before restoring, and a damaged file will be refused.</p>
    </div>

    <div class="card">
      <h2>What’s stored in this browser</h2>
      <table class="simple">${countRows}</table>
      <p class="muted small" style="margin-top:12px">${escapeHtml(protectionText)}</p>
      <p class="muted small" id="app-version">Live version ${APP_VERSION} · ${state.offlineReady ? 'Ready to use without internet.' : location.protocol.startsWith('http') ? 'Getting ready to work without internet…' : 'Opened from a file on this computer, so the offline copy isn’t used.'}</p>
    </div>

    <div class="card">
      <h2>Start over</h2>
      <p>Erase everything, for example to begin a new season. A safety copy downloads first.</p>
      <div class="row"><button type="button" class="btn danger" data-action="erase">Erase all data…</button></div>
    </div>`;
}

// Button clicks anywhere in the page are handled here.
document.addEventListener('click', async (event) => {
  const navButton = event.target.closest('#main-nav button');
  if (navButton) { go(navButton.dataset.screen); return; }

  if (event.target.closest('#backup-pill')) { go('setup', null, 'backup-card'); return; }

  const rink = event.target.closest('svg.rink.interactive');
  if (rink) { handleRinkTap(rink, event).catch(err => console.error(err)); return; }

  const actionButton = event.target.closest('[data-action]');
  if (!actionButton) return;
  const { action, id, tournament, field, value } = actionButton.dataset;
  const entry = state.entry;
  try {
    if (action === 'backup') await downloadBackup();
    else if (action === 'restore') document.getElementById('restore-input').click();
    else if (action === 'erase') await startErase();
    else if (action === 'add-player') await openAddPlayer();
    else if (action === 'edit-player') await openEditPlayer(id);
    else if (action === 'add-opponent') await openAddOpponent();
    else if (action === 'edit-opponent') await openEditOpponent(id);
    else if (action === 'add-game') await openAddGame(tournament ? { type: 'tournament', tournamentId: tournament,
                                                    date: findTournament(tournament).startDate || '' } : {});
    else if (action === 'edit-game') await openEditGame(id);
    else if (action === 'open-game') go('game', id);
    else if (action === 'reset-game-field') await resetGameField(field);
    else if (action === 'add-tournament') await openAddTournament();
    else if (action === 'edit-tournament') await openEditTournament(id);
    else if (action === 'open-tournament') go('tournament', id);
    // Game entry
    else if (action === 'game-tab') { entry.tab = value; entry.pending = null; entry.movingShotId = null; entry.shootoutShooter = undefined; renderKeepingFocus(); }
    else if (action === 'entry-team') { entry.team = value; entry.pending = null; entry.movingShotId = null; renderKeepingFocus(); }
    else if (action === 'entry-period') { entry.period = value === 'OT' ? 'OT' : Number(value); renderKeepingFocus(); }
    else if (action === 'entry-situation') { entry.situation = value; renderKeepingFocus(); }
    else if (action === 'shot-no-location') { entry.pending = { x: null, y: null, step: entry.team === 'us' ? 'shooter' : 'result', shooterId: null }; renderKeepingFocus(); }
    else if (action === 'pick-shooter' && entry.pending) { entry.pending.shooterId = id || null; entry.pending.step = 'result'; renderKeepingFocus(); }
    else if (action === 'back-to-shooter' && entry.pending) { entry.pending.step = 'shooter'; renderKeepingFocus(); }
    else if (action === 'pick-result') await saveNewShot(value);
    else if (action === 'cancel-shot') { entry.pending = null; renderKeepingFocus(); }
    else if (action === 'cancel-move') { entry.movingShotId = null; renderKeepingFocus(); }
    else if (action === 'undo-shot') await undoLastShot();
    else if (action === 'edit-shot') await openEditShot(id);
    else if (action === 'delete-shot') await deleteShot(id);
    else if (action === 'st-step') {
      const current = gameSpecialTeams(findGame(entry.gameId))[field];
      const next = Math.max(0, Math.min(30, (current || 0) + Number(value)));
      await saveSpecialTeamsField(entry.gameId, field, next);
    }
    else if (action === 'faceoff-step') {
      const [result, delta] = value.split(':');
      const current = state.faceoffs.filter(f => f.gameId === entry.gameId && f.playerId === id && f.result === result).length;
      await setFaceoffCount(entry.gameId, id, result, current + Number(delta));
    }
    else if (action === 'add-penalty-shot') await openPenaltyShot(findGame(entry.gameId));
    else if (action === 'edit-penalty-shot') await openPenaltyShot(findGame(entry.gameId), id);
    else if (action === 'delete-penalty-shot') await deletePenaltyShot(id);
    else if (action === 'shootout-first') { await saveRecord('games', { ...findGame(entry.gameId), shootoutFirst: value }); renderKeepingFocus(); }
    else if (action === 'pick-attempt-shooter') { entry.shootoutShooter = id || null; renderKeepingFocus(); }
    else if (action === 'back-to-attempt-shooter') { entry.shootoutShooter = undefined; renderKeepingFocus(); }
    else if (action === 'pick-attempt-result') await saveShootoutAttempt(findGame(entry.gameId), value);
    else if (action === 'undo-attempt') await undoLastAttempt(findGame(entry.gameId));
    else if (action === 'edit-attempt') await openEditAttempt(findGame(entry.gameId), id);
    else if (action === 'open-report') go('report', id);
    else if (action === 'add-sheet-goal') await openSheetGoal(findGame(entry.gameId));
    else if (action === 'edit-sheet-goal') await openSheetGoal(findGame(entry.gameId), id);
    else if (action === 'delete-sheet-goal') await deleteSheetItem(entry.gameId, 'goals', id);
    else if (action === 'add-sheet-penalty') await openSheetPenalty(findGame(entry.gameId));
    else if (action === 'edit-sheet-penalty') await openSheetPenalty(findGame(entry.gameId), id);
    else if (action === 'delete-sheet-penalty') await deleteSheetItem(entry.gameId, 'penalties', id);
    else if (action === 'print-report') window.print();
    else if (action === 'report-choice') setReportOption(field, value);
    else if (action === 'stats-view') { state.statsView = value; renderKeepingFocus(); }
    else if (action === 'set-filter') setFilter(actionButton.dataset.filter, value);
    else if (action === 'sort-faceoffs') {
      const current = state.faceoffSort || { key: 'total', dir: 'desc' };
      state.faceoffSort = current.key === value ? { key: value, dir: current.dir === 'asc' ? 'desc' : 'asc' }
                                                : { key: value, dir: value === 'player' ? 'asc' : 'desc' };
      renderKeepingFocus();
    }
    else if (action === 'open-game-details') {
      entry.detailsOpen = true;
      renderKeepingFocus();
      document.getElementById('game-details').scrollIntoView({ behavior: 'smooth' });
    }
  } catch (err) {
    console.error(err);
  }
});

// Team settings and game details save as soon as a box is changed.
document.addEventListener('change', (event) => {
  const setting = event.target.closest('[data-setting]');
  if (setting) saveSetting(setting).catch(err => console.error(err));
  const gameField = event.target.closest('[data-game-field]');
  if (gameField) saveGameField(gameField).catch(err => console.error(err));
  const filterSelect = event.target.closest('[data-filter-select]');
  if (filterSelect) setFilter(filterSelect.dataset.filterSelect, filterSelect.value);
  const reportOption = event.target.closest('[data-report-option]');
  if (reportOption) setReportOption(reportOption.dataset.reportOption, reportOption.checked);
  const specialBox = event.target.closest('[data-st-field]');
  if (specialBox) {
    const text = specialBox.value.trim();
    const n = text === '' ? null : Number(text);
    if (n !== null && (!Number.isInteger(n) || n < 0 || n > 30)) { renderKeepingFocus(); showMessage('Check that entry', 'Enter a whole number from 0 to 30, or leave it blank.'); }
    else saveSpecialTeamsField(state.entry.gameId, specialBox.dataset.stField, n).catch(err => console.error(err));
  }
  const faceoffBox = event.target.closest('[data-faceoff-count]');
  if (faceoffBox) {
    const n = Number(faceoffBox.value);
    if (!Number.isInteger(n) || n < 0 || n > 99) { renderKeepingFocus(); showMessage('Check that entry', 'Enter a whole number from 0 to 99.'); }
    else setFaceoffCount(state.entry.gameId, faceoffBox.dataset.player, faceoffBox.dataset.faceoffCount, n).catch(err => console.error(err));
  }
});

window.addEventListener('hashchange', applyRoute);

});

// Remember whether "Game details" is open or folded away.
document.addEventListener('toggle', (event) => {
  if (event.target.id === 'game-details' && state.entry) state.entry.detailsOpen = event.target.open;
}, true);

// Escape cancels a shot being entered or moved (when no pop-up is open).
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape' || document.getElementById('dialog').open || !state.entry || state.screen !== 'game') return;
  if (state.entry.pending || state.entry.movingShotId) {
    state.entry.pending = null;
    state.entry.movingShotId = null;
    renderKeepingFocus();

// Pointing at a marker on the rink shows what shot it is (and lights up its row in the list);
// pointing at a row in the list lights up its marker.
document.addEventListener('mouseover', (event) => {
  document.querySelectorAll('.marker.highlight, tr.highlight').forEach(el => el.classList.remove('highlight'));
  const statDot = event.target.closest('.stat-dot[data-tip]');
  if (statDot) {
    document.querySelectorAll('.stat-dot.lift').forEach(el => el.classList.remove('lift'));
    statDot.classList.add('lift');
    return showRinkTip(statDot, statDot.dataset.tip);
  }
  document.querySelectorAll('.stat-dot.lift').forEach(el => el.classList.remove('lift'));
  const marker = event.target.closest('.rink .marker[data-shot-id]');
  const row = event.target.closest('[data-shot-row]');
  const shotId = marker ? marker.dataset.shotId : row ? row.dataset.shotRow : null;
  if (!marker) hideRinkTip();
  if (!shotId) return;
  const onRink = document.querySelector(`.rink .marker[data-shot-id="${CSS.escape(shotId)}"]`);
  const inList = document.querySelector(`[data-shot-row="${CSS.escape(shotId)}"]`);
  if (onRink) onRink.classList.add('highlight');
  if (inList) inList.classList.add('highlight');
  if (marker) {
    const shot = state.shots.find(s => s.id === shotId);
    if (shot) {
      const who = shot.team === 'us' ? (shot.shooterId ? playerLabel(shot.shooterId) : 'Shooter not recorded') : '';
      const parts = [who, periodLabel(shot.period), SITUATIONS[shot.situation], SHOT_RESULTS[shot.result], gradeALabel(shot)];
      if (marker.classList.contains('editable')) parts.push('Click to edit');
      showRinkTip(marker, parts.filter(Boolean).join(' · '));
    }
  }
});

function showRinkTip(marker, message) {
  const tip = document.getElementById('rink-tip');
  tip.textContent = message;
  tip.hidden = false;
  const box = marker.getBoundingClientRect();
  const left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, box.left + box.width / 2 - tip.offsetWidth / 2));
  tip.style.left = `${left}px`;
  tip.style.top = `${Math.max(8, box.top - tip.offsetHeight - 8)}px`;
}

function hideRinkTip() {
  document.getElementById('rink-tip').hidden = true;
}

document.getElementById('restore-input').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  event.target.value = '';  // So the same file can be chosen again later
  if (file) await startRestore(file);
});

async function start() {
  try {
    state.db = await openDatabase();
    await loadEverything();
  } catch (err) {
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="card"><h2>Hockey Stats couldn’t open its storage</h2>
      <p>Please make sure you’re using Google Chrome and that it isn’t in a private (Incognito) window, then reload the page.</p>
      <p class="muted small">Details: ${escapeHtml(err && err.message)}</p></div>`;
    return;
  }
  applyRoute();
  tellOtherTabs('hello');
  state.storageProtected = await checkStorageProtection();
  if (state.screen === 'setup') render();
}
