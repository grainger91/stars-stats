        <div class="switch-block">
          <label class="switch"><input type="checkbox" id="g-shootout" data-game-field="shootout" ${game.shootout ? 'checked' : ''}><span class="switch-track"></span><span>Shootout</span></label>
        </div>
        <p class="minutes-line">Minutes played: <strong>${formatMinutes(minutes)}</strong>
          <span class="muted">(3 periods of ${gamePeriodLength(game)}${overtime.on ? `, plus ${formatMinutes(overtime.played)} of overtime` : ''}${game.shootout ? '. Shootouts add no minutes' : ''})</span></p>

        <h3 class="section-title">Result and final score</h3>
        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="g-result">Result</label>
            <select id="g-result" data-game-field="result">${resultOptions}</select>
            <span class="hint">${game.result ? 'Set by hand. Choose “Automatic” to let the app work it out from the goals.' : 'Worked out from the goals you enter.'}</span>
          </div>
          <div class="field">
            <span class="field-label">Official final score (optional)</span>
            <span class="score-inputs">
              <input type="number" id="g-official-us" data-game-field="officialUs" value="${official.us ?? ''}" min="0" max="99" inputmode="numeric" aria-label="${escapeHtml(ourTeamName())} goals">
              <span>–</span>
              <input type="number" id="g-official-them" data-game-field="officialThem" value="${official.them ?? ''}" min="0" max="99" inputmode="numeric" aria-label="${escapeHtml(opponent)} goals">
            </span>
            <span class="hint">${escapeHtml(ourTeamName())} first. From the official game sheet. The app warns you if the goals you enter don’t add up to it.</span>
          </div>
        </div>
        <div class="field" style="margin-top:16px">
          <label class="field-label" for="g-notes">Notes (optional)</label>
          <textarea id="g-notes" data-game-field="notes" rows="3">${escapeHtml(game.notes || '')}</textarea>
        </div>
      </div>
    </details>`;
}

// What the game screen remembers while you enter a game. Period and situation stay until changed.
function freshEntryState(game) {
  return {
    gameId: game.id, tab: 'shots', team: 'us', period: 1, situation: 'even',
    pending: null,          // A shot being entered: { x, y, step: 'shooter' | 'result', shooterId }
    movingShotId: null,     // A shot waiting for a new spot on the rink
    shootoutShooter: undefined,  // Our shootout shooter once chosen (null = not recorded), before the result
    detailsOpen: !gameHasStats(game.id),
  };
}


/* ----- Rink diagram ----- */

/*
  The offensive half of the rink, drawn in feet: 85 wide (boards to boards) and
  75 deep (end boards to blue line), with the net at the top. Standard proportions:
  goal line 11 feet from the end boards, rounded corners of 28 feet, faceoff circles
  of 15 feet centred 20 feet out from the goal line and 22 feet either side of centre.
  Shot positions are stored as 0 to 1 across (x) and down (y) this drawing.
*/
const RINK_W = 85;
const RINK_H = 75;
const RINK_OUTLINE = `M0,${RINK_H} L0,28 A28,28 0 0 1 28,0 L57,0 A28,28 0 0 1 ${RINK_W},28 L${RINK_W},${RINK_H} Z`;
const RINK_BOARDS = `M0,${RINK_H} L0,28 A28,28 0 0 1 28,0 L57,0 A28,28 0 0 1 ${RINK_W},28 L${RINK_W},${RINK_H}`;

/*
  The Grade A area, copied from the coach's paper sheet (Ice Hockey Systems Inc.), in feet:
  from the crease edges on the goal line, diagonally out to each faceoff dot, straight down
  to the bottom of each circle, and across between the two circle bottoms.
*/
const GRADE_A_AREA = [[38.5, 11], [20.5, 31], [20.5, 46], [64.5, 46], [64.5, 31], [46.5, 11]];
const GRADE_A_LINE_TOLERANCE = 0.3;   // feet: a shot this close to the dotted line counts as "on the line"

/*
  Grade A, as the coach defines it (changed 2026-10-04):
    a Grade A SHOT is a shot on goal (on net or a goal) taken on or inside the Grade A area;
    a Grade A ATTEMPT is any shot from the area, including missed or blocked.
  inGradeAArea answers "where was it taken?": true if on or inside the area, false if outside, null if no location.
*/
function inGradeAArea(shot) {
  if (shot.x == null || shot.y == null) return null;
  const px = shot.x * RINK_W, py = shot.y * RINK_H;
  let inside = false;
  for (let i = 0, j = GRADE_A_AREA.length - 1; i < GRADE_A_AREA.length; j = i++) {
    const [xi, yi] = GRADE_A_AREA[i], [xj, yj] = GRADE_A_AREA[j];
    // On the line counts
    const dx = xi - xj, dy = yi - yj;
    const along = Math.max(0, Math.min(1, ((px - xj) * dx + (py - yj) * dy) / (dx * dx + dy * dy)));
    if (Math.hypot(px - (xj + along * dx), py - (yj + along * dy)) <= GRADE_A_LINE_TOLERANCE) return true;
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
let rinkCount = 0;

// underlay: drawn on the ice beneath the rink lines (the heat map); markersHtml: drawn on top.
function rinkSvg(markersHtml, { interactive = false, label = 'Half rink', underlay = '' } = {}) {
  const clipId = `rink-clip-${++rinkCount}`;
  const faceoffCircle = (cx) => `
    <circle cx="${cx}" cy="31" r="15" class="rink-line red" fill="none"/>
    <circle cx="${cx}" cy="31" r="1" class="rink-dot"/>
    ${[-1, 1].map(side => [-2.9, 2.9].map(dy =>
      `<line x1="${cx + side * 15}" x2="${cx + side * 17}" y1="${31 + dy}" y2="${31 + dy}" class="rink-line red"/>`).join('')).join('')}`;
  return `<svg class="rink ${interactive ? 'interactive' : ''}" viewBox="-1 -1 ${RINK_W + 2} ${RINK_H + 2}" role="img" aria-label="${escapeHtml(label)}">
      <defs><clipPath id="${clipId}"><path d="${RINK_OUTLINE}"/></clipPath></defs>
      <path d="${RINK_OUTLINE}" class="rink-ice" data-rink-ice/>
      ${underlay ? `<g clip-path="url(#${clipId})">${underlay}</g>` : ''}
      <g clip-path="url(#${clipId})">
        <line x1="0" x2="${RINK_W}" y1="11" y2="11" class="rink-line red"/>
        <rect x="0" y="${RINK_H - 1}" width="${RINK_W}" height="1" class="rink-blue"/>
      </g>
      <path d="M38.5,11 L38.5,15.47 A6,6 0 0 0 46.5,15.47 L46.5,11 Z" class="rink-crease"/>
      <polygon points="${GRADE_A_AREA.map(p => p.join(',')).join(' ')}" class="rink-grade-a"/>
      <rect x="39.5" y="7.7" width="6" height="3.3" class="rink-net"/>
      ${faceoffCircle(20.5)}${faceoffCircle(64.5)}
      <path d="${RINK_BOARDS}" class="rink-boards" fill="none"/>
      <g class="markers">${markersHtml}</g>
    </svg>`;
}

// Where on the rink a click landed, as 0 to 1 across and down. Null if it's outside the boards.
function rinkPointFromEvent(svg, event) {
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  const p = point.matrixTransform(svg.getScreenCTM().inverse());
  if (!svg.querySelector('[data-rink-ice]').isPointInFill(new DOMPoint(p.x, p.y))) return null;
  const tidy = (n) => Math.round(Math.min(1, Math.max(0, n)) * 10000) / 10000;
  return { x: tidy(p.x / RINK_W), y: tidy(p.y / RINK_H) };
}

/*
  Shot markers copy the paper sheet:
    our shots:      jersey number = on net, red with a ring = goal, number with a slash = missed or blocked
    opponent shots: X = on net, G = goal, slash = missed or blocked
*/
function markerInner(team, result, number) {
  const label = team === 'us' ? (number || '') : (result === 'onNet' ? 'X' : result === 'goal' ? 'G' : '');
  return `${result === 'goal' ? '<circle r="2.7" class="ring"/>' : ''}
    <circle r="2" class="body"/>
    ${result === 'missedBlocked' ? '<line x1="-1.6" y1="1.6" x2="1.6" y2="-1.6" class="slash"/>' : ''}
    ${label ? `<text class="${label.length > 1 ? 'two' : ''}">${escapeHtml(label)}</text>` : ''}`;
}

function shotMarker(shot, classes = '') {
  const shooter = shot.shooterId && state.players.find(p => p.id === shot.shooterId);
  return `<g class="marker ${shot.result} ${classes}" data-shot-id="${escapeHtml(shot.id)}"
      transform="translate(${(shot.x * RINK_W).toFixed(2)} ${(shot.y * RINK_H).toFixed(2)})">
      ${markerInner(shot.team, shot.result, shooter ? shooter.number : '')}</g>`;
}

// A small stand-alone marker, for buttons and the legend.
function markerGlyph(team, result, number) {
  return `<svg class="glyph" viewBox="-3 -3 6 6" aria-hidden="true"><g class="marker ${result}">${markerInner(team, result, number)}</g></svg>`;
}


/* ----- Shots tab ----- */

const findPlayer = (id) => state.players.find(p => p.id === id);
const playerLabel = (id) => { const p = findPlayer(id); return p ? `#${p.number} ${p.name}` : 'Unknown player'; };

// Players offered on entry screens: active only, by number, goalies last.
function entryPlayers() {
  const active = state.players.filter(p => p.active);
  return [...sortByNumber(active.filter(p => p.position !== 'G')), ...sortByNumber(active.filter(p => p.position === 'G'))];
}

const gameShots = (gameId) => state.shots.filter(s => s.gameId === gameId);
const byEntryOrder = (a, b) => (a.createdAt || '').localeCompare(b.createdAt || '');

function describeShot(shot, game) {
  const team = shot.team === 'us' ? ourTeamName() : opponentName(game);
  const who = shot.team === 'us' && shot.shooterId ? playerLabel(shot.shooterId) : '';
  return [team, periodLabel(shot.period), who, SHOT_RESULTS[shot.result]].filter(Boolean).join(' · ');
}

function renderShotsTab(game) {
  const entry = state.entry;
  const periods = game.overtime.on ? PERIODS : PERIODS.slice(0, 3);
  const teamShots = gameShots(game.id).filter(s => s.team === entry.team);
  const teamName = entry.team === 'us' ? ourTeamName() : opponentName(game);
  const toggle = (action, value, label, current) =>
    `<button type="button" class="toggle ${String(value) === String(current) ? 'on' : ''}" aria-pressed="${String(value) === String(current)}"
      data-action="${action}" data-value="${value}">${label}</button>`;

  const canEditMarkers = !entry.pending && !entry.movingShotId;
  let markers = teamShots.filter(s => s.x != null).sort(byEntryOrder).map(s => {
    const classes = [s.period !== entry.period ? 'faded' : '', s.id === entry.movingShotId ? 'moving' : '',
                     canEditMarkers ? 'editable' : ''].join(' ');
    return shotMarker(s, classes);
  }).join('');
  if (entry.pending && entry.pending.x != null) {
    markers += `<g class="marker pending" transform="translate(${entry.pending.x * RINK_W} ${entry.pending.y * RINK_H})"><circle r="2.7" class="ring"/><circle r="2" class="body"/></g>`;
  }
  const exampleNumber = (entryPlayers()[0] || { number: '9' }).number;

  return `<div class="card entry-card">
      <div class="entry-controls">
        <div class="control"><span class="control-label">Shots by</span>
          <div class="toggle-group team-toggle">${toggle('entry-team', 'us', escapeHtml(ourTeamName()), entry.team)}${toggle('entry-team', 'them', escapeHtml(opponentName(game)), entry.team)}</div></div>
        <div class="control"><span class="control-label">Period</span>
          <div class="toggle-group">${periods.map(p => toggle('entry-period', p, p === 'OT' ? 'Overtime' : p, entry.period)).join('')}</div></div>
        <div class="control"><span class="control-label">Situation</span>
          <div class="toggle-group">${Object.entries(SITUATIONS).map(([key, label]) => toggle('entry-situation', key, label, entry.situation)).join('')}</div></div>
      </div>
      <p class="hint">Period and situation stay selected until you change them. Situation is always from ${escapeHtml(ourTeamName())}’s point of view: when you’re on the power play, the opponent’s shots are “Power play” too.</p>
      <div class="entry-layout">
        <div class="rink-wrap">
          ${rinkSvg(markers, { interactive: true, label: `Half rink for ${teamName} shots` })}
          <div class="legend">
            <span>${markerGlyph(entry.team, 'onNet', exampleNumber)} On net</span>
            <span>${markerGlyph(entry.team, 'goal', exampleNumber)} Goal</span>
            <span>${markerGlyph(entry.team, 'missedBlocked', exampleNumber)} Missed or blocked</span>
            <span><svg class="glyph grade-a-sample" viewBox="0 0 26 10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="#243142" stroke-width="2" stroke-dasharray="4 3"/></svg> Grade A area</span>
            <span class="muted">Faded: other periods</span>
          </div>
        </div>
        <div class="entry-panel ${entry.pending || entry.movingShotId ? 'active' : ''}" id="entry-panel">${renderEntryPanel(game)}</div>
      </div>
    </div>
    <div class="card" id="shot-tally">${renderShotTally(game, entry.team)}</div>
    <div class="card" id="shot-list">${renderShotList(game, teamShots)}</div>`;
}

function renderEntryPanel(game) {
  const entry = state.entry;
  const context = `${periodLabel(entry.period)} · ${SITUATIONS[entry.situation]}`;
  if (entry.movingShotId) {
    return `<h3>Move this shot</h3>
      <p>Tap the rink where the shot should be. It’s shown with a yellow outline.</p>
      <div class="panel-actions"><button type="button" class="btn" data-action="cancel-move">Cancel</button></div>`;
  }
  const pending = entry.pending;
  if (!pending) {
    const last = gameShots(game.id).sort(byEntryOrder).pop();
    return `<h3>Add a shot</h3>
      <p>Tap the rink where the shot was taken.</p>
      <p class="muted small">To change a shot already entered, click its marker.</p>
      <p class="muted small">${context}</p>
      <div class="panel-actions">
        <button type="button" class="btn" data-action="shot-no-location">Shot with no location…</button>
      </div>
      ${last ? `<div class="undo-box"><button type="button" class="btn" data-action="undo-shot">Undo last shot</button>
        <span class="hint">${escapeHtml(describeShot(last, game))}</span></div>` : ''}`;
  }
  const where = pending.x == null ? ' · No location' : (inGradeAArea(pending) ? ' · <strong>In the Grade A area</strong>' : '');
  if (pending.step === 'shooter') {
    const players = entryPlayers();
    return `<h3>Who took the shot?</h3>
      <p class="muted small">${context}${where}</p>
      ${players.length
        ? `<div class="jersey-grid">${players.map(p => `<button type="button" class="jersey-btn" data-action="pick-shooter" data-id="${escapeHtml(p.id)}" title="${escapeHtml(p.name)}">
            <strong>${escapeHtml(p.number)}</strong><span>${escapeHtml(p.name)}</span></button>`).join('')}</div>`
        : '<p class="notice warn">There are no active players. Add your roster on the Setup screen.</p>'}
      <div class="panel-actions">
        <button type="button" class="btn" data-action="pick-shooter" data-id="">Not recorded</button>
        <button type="button" class="btn" data-action="cancel-shot">Cancel</button>
      </div>`;
  }
  const shooter = pending.shooterId && findPlayer(pending.shooterId);
  const who = entry.team === 'us' ? ` · ${shooter ? escapeHtml(`#${shooter.number} ${shooter.name}`) : 'Shooter not recorded'}` : '';
  const number = shooter ? shooter.number : '';
  return `<h3>What happened?</h3>
    <p class="muted small">${context}${who}${where}</p>
    <div class="result-buttons">
      ${Object.entries(SHOT_RESULTS).map(([key, label]) =>
        `<button type="button" class="result-btn" data-action="pick-result" data-value="${key}">${markerGlyph(entry.team, key, number)}<span>${label}</span></button>`).join('')}
    </div>
    <div class="panel-actions">
      ${entry.team === 'us' ? '<button type="button" class="btn" data-action="back-to-shooter">Back</button>' : ''}
      <button type="button" class="btn" data-action="cancel-shot">Cancel</button>
    </div>`;
}

// Totals by period, to check against the paper sheet.
function renderShotTally(game, team) {
  const periods = game.overtime.on ? PERIODS : PERIODS.slice(0, 3);
  const shots = gameShots(game.id).filter(s => s.team === team);
  const count = (period, test) => shots.filter(s => (period === 'all' || s.period === period) && test(s)).length;
  const rows = [
    ['Shots on goal', s => s.result === 'onNet' || s.result === 'goal', 'On net plus goals'],
    ['Goals', s => s.result === 'goal'],
    ['Missed or blocked', s => s.result === 'missedBlocked'],
    ['Grade A shots', isGradeAShot, 'on net plus goals, from on or inside the dotted line'],
    ['Grade A attempts', s => inGradeAArea(s) === true, 'every shot from the area, including missed or blocked'],
  ];
  const noLocation = shots.filter(s => s.x == null).length;
  return `<h2>${escapeHtml(team === 'us' ? ourTeamName() : opponentName(game))} totals</h2>
    <p class="muted small">Check these against the paper sheet.${noLocation ? ` Includes ${noLocation} with no location, which can’t count as Grade A.` : ''}</p>
    <table class="simple tally">
      <tr><th></th>${periods.map(p => `<th class="num">${p === 'OT' ? 'Overtime' : `Period ${p}`}</th>`).join('')}<th class="num">Total</th></tr>
      ${rows.map(([label, test, note]) => `<tr><td>${label}${note ? ` <span class="hint">(${note})</span>` : ''}</td>
        ${periods.map(p => `<td class="num">${count(p, test)}</td>`).join('')}<td class="num"><strong>${count('all', test)}</strong></td></tr>`).join('')}
    </table>`;
}

function renderShotList(game, teamShots) {
  const entry = state.entry;
  const ordered = [...teamShots].sort(byEntryOrder);
  const teamName = entry.team === 'us' ? ourTeamName() : opponentName(game);
  if (!ordered.length) return `<h2>${escapeHtml(teamName)} shots</h2><p class="muted empty">No shots entered yet.</p>`;
  const rows = ordered.map((shot, index) => ({ shot, index })).reverse().map(({ shot, index }) => `
      <tr data-shot-row="${escapeHtml(shot.id)}">
        <td class="num muted">${index + 1}</td>
        <td>${periodLabel(shot.period)}</td>
        <td>${SITUATIONS[shot.situation]}</td>
        ${entry.team === 'us' ? `<td>${shot.shooterId ? escapeHtml(playerLabel(shot.shooterId)) : '<span class="muted">Not recorded</span>'}</td>` : ''}
        <td><span class="result-cell">${markerGlyph(shot.team, shot.result, shot.shooterId && findPlayer(shot.shooterId) ? findPlayer(shot.shooterId).number : '')}${SHOT_RESULTS[shot.result]}</span></td>
        <td>${shot.x == null ? '<span class="muted">No location</span>' : isGradeAShot(shot) ? '<span class="tag grade-a">Grade A shot</span>' : inGradeAArea(shot) ? '<span class="tag grade-a-attempt">Grade A attempt</span>' : 'Outside Grade A'}</td>
        <td class="row-actions">
          <button type="button" class="btn small" data-action="edit-shot" data-id="${escapeHtml(shot.id)}">Edit</button>
          <button type="button" class="btn small danger" data-action="delete-shot" data-id="${escapeHtml(shot.id)}">Delete</button>
        </td>
      </tr>`).join('');
  return `<h2>${escapeHtml(teamName)} shots (${ordered.length})</h2>
    <p class="muted small">Newest first. Point at a row to find its marker on the rink, or click a marker on the rink to edit it.</p>
    <div class="table-scroll"><table class="simple shot-table">
      <colgroup><col style="width:48px"><col style="width:110px"><col style="width:140px">${entry.team === 'us' ? '<col>' : ''}<col style="width:190px"><col style="width:150px"><col style="width:180px"></colgroup>
      <tr><th class="num">#</th><th>Period</th><th>Situation</th>${entry.team === 'us' ? '<th>Shooter</th>' : ''}<th>Result</th><th>Location</th><th></th></tr>
      ${rows}
    </table></div>`;
}

async function saveNewShot(result) {
  const entry = state.entry;
  const pending = entry.pending;
  if (!pending) return;
  await saveRecord('shots', {
    id: newId(), gameId: entry.gameId, team: entry.team, period: entry.period,
    x: pending.x, y: pending.y, result,
    shooterId: entry.team === 'us' ? (pending.shooterId || null) : null,
    situation: entry.situation, createdAt: new Date().toISOString(),
  });
  entry.pending = null;
  renderKeepingFocus();
}

async function handleRinkTap(svg, event) {
  const entry = state.entry;
  // Clicking an existing marker edits that shot (unless a shot is being entered or moved: then the click places it).
  const marker = event.target.closest('.marker.editable[data-shot-id]');
  if (marker) {
    hideRinkTip();
    return openEditShot(marker.dataset.shotId);
  }
  const point = rinkPointFromEvent(svg, event);
  if (!point) return;   // Outside the boards
  if (entry.movingShotId) {
    const shot = state.shots.find(s => s.id === entry.movingShotId);
    entry.movingShotId = null;
    if (shot) { await saveRecord('shots', { ...shot, ...point }); showToast('Shot moved.'); }
  } else if (entry.pending) {
    Object.assign(entry.pending, point);   // Tapping again just moves the shot being entered
  } else {
    entry.pending = { ...point, step: entry.team === 'us' ? 'shooter' : 'result', shooterId: null };
  }
  renderKeepingFocus();
}

async function undoLastShot() {
  const last = gameShots(state.entry.gameId).sort(byEntryOrder).pop();
  if (!last) return;
  await deleteRecord('shots', last.id);
  renderKeepingFocus();
  showToast('Last shot removed.');
}

async function deleteShot(shotId) {
  const shot = state.shots.find(s => s.id === shotId);
  const game = findGame(shot.gameId);
  if (!await confirmDialog('Delete shot?', `Delete this shot (${describeShot(shot, game)})?`, 'Delete')) return;
  await deleteRecord('shots', shotId);
  renderKeepingFocus();
  showToast('Shot deleted.');
}

async function openEditShot(shotId) {
  const shot = state.shots.find(s => s.id === shotId);
  const game = findGame(shot.gameId);
  const periods = Object.fromEntries((game.overtime.on ? PERIODS : PERIODS.slice(0, 3)).map(p => [p, p === 'OT' ? 'Overtime' : String(p)]));
  const players = entryPlayers();
  if (shot.shooterId && !players.some(p => p.id === shot.shooterId) && findPlayer(shot.shooterId)) players.push(findPlayer(shot.shooterId));
  const shooterOptions = '<option value="">Not recorded</option>' + players.map(p =>
    `<option value="${escapeHtml(p.id)}" ${p.id === shot.shooterId ? 'selected' : ''}>#${escapeHtml(p.number)} ${escapeHtml(p.name)}${p.active ? '' : ' (inactive)'}</option>`).join('');

  const buttons = [{ label: 'Delete', value: 'delete', kind: 'danger' }];
  buttons.push({ label: shot.x == null ? 'Place on rink' : 'Move on rink', value: 'move', check: true, push: shot.x == null });
  if (shot.x != null) buttons.push({ label: 'Remove location', value: 'unplace', check: true, push: true });
  buttons.push({ label: 'Cancel', value: 'cancel' }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true });

  let values;
  const choice = await showDialog({
    title: 'Edit shot',
    body: `<div class="field"><span>Shot by</span>${choiceButtons('team', { us: ourTeamName(), them: opponentName(game) }, shot.team)}</div>
      <div class="field"><span>Period</span>${choiceButtons('period', periods, String(shot.period))}</div>
      <div class="field"><span>Situation</span>${choiceButtons('situation', SITUATIONS, shot.situation)}</div>
      <label class="field" data-shooter-field><span>Shooter</span><select name="shooter">${shooterOptions}</select></label>
      <div class="field"><span>Result</span>${choiceButtons('result', SHOT_RESULTS, shot.result)}</div>
      <p class="muted small">Location: ${shot.x == null ? 'not recorded' : 'on the rink'}.</p>`,
    buttons,
    onOpen: (form) => {
      const update = () => { form.querySelector('[data-shooter-field]').hidden = form.elements.namedItem('team').value !== 'us'; };
      form.querySelectorAll('input[name="team"]').forEach(r => r.addEventListener('change', update));
      update();
    },
    onSubmit: (value, form) => {
      const f = form.elements;
      const team = f.namedItem('team').value;
      const period = f.namedItem('period').value;
      values = {
        team, period: period === 'OT' ? 'OT' : Number(period), situation: f.namedItem('situation').value,
        shooterId: team === 'us' ? (f.namedItem('shooter').value || null) : null, result: f.namedItem('result').value,
      };
      return null;
    },
  });
  if (choice === 'delete') return deleteShot(shotId);
  if (!['save', 'move', 'unplace'].includes(choice)) return;
  const updated = { ...shot, ...values };
  if (choice === 'unplace') { updated.x = null; updated.y = null; }
  await saveRecord('shots', updated);
  if (choice === 'move') {
    state.entry.team = updated.team;
    state.entry.pending = null;
    state.entry.movingShotId = updated.id;
    renderKeepingFocus();
    document.querySelector('.rink-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else {
    renderKeepingFocus();
    showToast('Shot saved.');
  }
}

/* ----- Faceoffs tab ----- */

const percentText = (part, whole) => whole ? `${Math.round(100 * part / whole)}%` : '–';

// Everyone on the roster: forwards first, then defence, then goalies. Inactive players appear only if they already have faceoffs here.
function faceoffPlayers(gameId) {
  const used = new Set(state.faceoffs.filter(f => f.gameId === gameId).map(f => f.playerId));
  const shown = state.players.filter(p => p.active || used.has(p.id));
  return ['F', 'D', 'G'].map(pos => ({ pos, players: sortByNumber(shown.filter(p => p.position === pos)) })).filter(g => g.players.length);
}

function renderFaceoffsTab(game) {
  const records = state.faceoffs.filter(f => f.gameId === game.id);
  const count = (playerId, result) => records.filter(r => r.playerId === playerId && r.result === result).length;
  const counter = (player, result) => {
    const n = count(player.id, result);
    const label = result === 'win' ? 'wins' : 'losses';
    return `<span class="counter">
        <button type="button" class="step" data-action="faceoff-step" data-id="${escapeHtml(player.id)}" data-value="${result}:-1" tabindex="-1" aria-label="One fewer ${label} for #${escapeHtml(player.number)}" ${n ? '' : 'disabled'}>−</button>
        <input type="number" id="fo-${result}-${escapeHtml(player.id)}" data-faceoff-count="${result}" data-player="${escapeHtml(player.id)}" value="${n}" min="0" max="99" inputmode="numeric" aria-label="#${escapeHtml(player.number)} ${label}">
        <button type="button" class="step" data-action="faceoff-step" data-id="${escapeHtml(player.id)}" data-value="${result}:1" tabindex="-1" aria-label="One more ${label} for #${escapeHtml(player.number)}">+</button>
      </span>`;
  };
  const groups = faceoffPlayers(game.id);
  const wins = records.filter(r => r.result === 'win').length;
  const total = records.length;

  const rows = groups.map(group => `
      <tr class="group-row"><th colspan="4">${POSITION_GROUPS[group.pos]}</th></tr>
      ${group.players.map(p => {
        const w = count(p.id, 'win'), l = count(p.id, 'loss');
        return `<tr class="${w + l ? 'has-faceoffs' : ''}">
          <td><span class="jersey-inline">#${escapeHtml(p.number)}</span> ${escapeHtml(p.name)}${p.active ? '' : ' <span class="tag">Inactive</span>'}</td>
          <td>${counter(p, 'win')}</td>
          <td>${counter(p, 'loss')}</td>
          <td class="num fo-pct">${w + l ? `${w} of ${w + l} · ${percentText(w, w + l)}` : '<span class="muted">–</span>'}</td>
        </tr>`;
      }).join('')}`).join('');

  return `<div class="card">
      <div class="card-head">
        <h2>Faceoffs</h2>
        <p class="team-faceoffs"><strong>${escapeHtml(ourTeamName())}: ${total ? `${wins} of ${total} won · ${percentText(wins, total)}` : 'none entered yet'}</strong></p>
      </div>
      <p class="muted small">Tap + for each win or loss, or type a player’s total straight into the box. Changes save right away.</p>
      ${groups.length ? `<div class="table-scroll"><table class="simple faceoff-table">
          <colgroup><col><col class="fo-count-col"><col class="fo-count-col"><col class="fo-won-col"></colgroup>
          <tr><th>Player</th><th>Wins</th><th>Losses</th><th class="num">Won</th></tr>
          ${rows}
        </table></div>` : '<p class="notice warn">There are no active players. Add your roster on the Setup screen.</p>'}
    </div>`;
}

// Set a player's wins (or losses) in a game to a number, adding or removing faceoff records to match.
async function setFaceoffCount(gameId, playerId, result, target) {
  target = Math.max(0, Math.min(99, Math.round(target)));
  const existing = state.faceoffs.filter(f => f.gameId === gameId && f.playerId === playerId && f.result === result).sort(byEntryOrder);
  const changes = [];
  const now = Date.now();
  for (let i = existing.length; i < target; i++) {
    changes.push({ store: 'faceoffs', put: { id: newId(), gameId, playerId, result, createdAt: new Date(now + i).toISOString() } });
  }
  for (const record of existing.slice(target)) changes.push({ store: 'faceoffs', remove: record.id });   // newest go first
  if (changes.length) await saveChanges(changes);
  renderKeepingFocus();
}


/* ----- Penalty shots and shootout tab ----- */

const ATTEMPT_RESULTS = { goal: 'Goal', saved: 'Saved', missed: 'Missed' };

function renderPenaltiesTab(game) {
  return `${renderPenaltyShotsCard(game)}${renderShootoutCard(game)}`;
}

function attemptShooterText(attempt) {
  if (attempt.team === 'us') return attempt.shooterId ? escapeHtml(playerLabel(attempt.shooterId)) : '<span class="muted">Shooter not recorded</span>';
  return attempt.opponentNumber ? `#${escapeHtml(attempt.opponentNumber)}` : '<span class="muted">Number not recorded</span>';
}

const attemptResultTag = (result) => `<span class="attempt-result ${result}">${ATTEMPT_RESULTS[result]}</span>`;

function renderPenaltyShotsCard(game) {
  const shots = state.penaltyShots.filter(p => p.gameId === game.id)
    .sort((a, b) => PERIODS.indexOf(a.period) - PERIODS.indexOf(b.period) || byEntryOrder(a, b));
  const teamName = (team) => escapeHtml(team === 'us' ? ourTeamName() : opponentName(game));
  return `<div class="card" id="penalty-shots">
      <div class="card-head">
        <h2>Penalty shots</h2>
        <button type="button" class="btn primary" data-action="add-penalty-shot">Add penalty shot</button>
      </div>
      <p class="muted small">Kept separate from regular shots: not on the shot maps or in shot totals. A penalty shot goal counts toward the score.</p>
      ${shots.length ? `<div class="table-scroll"><table class="simple">
          <tr><th>Period</th><th>Team</th><th>Shooter</th><th>Result</th><th></th></tr>
          ${shots.map(p => `<tr>
            <td>${periodLabel(p.period)}</td><td>${teamName(p.team)}</td><td>${attemptShooterText(p)}</td><td>${attemptResultTag(p.result)}</td>
            <td class="row-actions"><button type="button" class="btn small" data-action="edit-penalty-shot" data-id="${escapeHtml(p.id)}">Edit</button>
              <button type="button" class="btn small danger" data-action="delete-penalty-shot" data-id="${escapeHtml(p.id)}">Delete</button></td>
          </tr>`).join('')}
        </table></div>` : '<p class="muted empty">No penalty shots in this game.</p>'}
    </div>`;
}

// The pop-up for adding or editing a penalty shot, or editing a shootout attempt.
function attemptFormHtml(game, attempt, { withPeriodAndTeam }) {
  const players = entryPlayers();
  if (attempt.shooterId && !players.some(p => p.id === attempt.shooterId) && findPlayer(attempt.shooterId)) players.push(findPlayer(attempt.shooterId));
  const shooterOptions = '<option value="">Not recorded</option>' + players.map(p =>
    `<option value="${escapeHtml(p.id)}" ${p.id === attempt.shooterId ? 'selected' : ''}>#${escapeHtml(p.number)} ${escapeHtml(p.name)}${p.active ? '' : ' (inactive)'}</option>`).join('');
  const periods = Object.fromEntries((game.overtime.on ? PERIODS : PERIODS.slice(0, 3)).map(p => [p, p === 'OT' ? 'Overtime' : String(p)]));
  return `${withPeriodAndTeam ? `
      <div class="field"><span>Period</span>${choiceButtons('period', periods, String(attempt.period))}</div>
      <div class="field"><span>Team</span>${choiceButtons('team', { us: ourTeamName(), them: opponentName(game) }, attempt.team)}</div>` : ''}
    <label class="field" data-our-shooter><span>Shooter</span><select name="shooter">${shooterOptions}</select></label>
    <label class="field" data-their-shooter><span>Opponent’s jersey number (optional)</span>
      <input type="text" name="opponentNumber" value="${escapeHtml(attempt.opponentNumber || '')}" inputmode="numeric" maxlength="2" autocomplete="off"></label>
    <div class="field"><span>Result</span>${choiceButtons('result', ATTEMPT_RESULTS, attempt.result)}</div>`;
}

function wireAttemptForm(form, fixedTeam) {
  const update = () => {
    const team = fixedTeam || form.elements.namedItem('team').value;
    form.querySelector('[data-our-shooter]').hidden = team !== 'us';
    form.querySelector('[data-their-shooter]').hidden = team !== 'them';
  };
  form.querySelectorAll('input[name="team"]').forEach(r => r.addEventListener('change', update));
  update();
}

function readAttemptForm(form, fixedTeam) {
  const f = form.elements;
  const team = fixedTeam || f.namedItem('team').value;
  const values = {
    team,
    shooterId: team === 'us' ? (f.namedItem('shooter').value || null) : null,
    opponentNumber: team === 'them' ? (f.namedItem('opponentNumber').value.trim() || null) : null,
    result: f.namedItem('result').value,
  };
  if (f.namedItem('period')) {
    const period = f.namedItem('period').value;
    values.period = period === 'OT' ? 'OT' : Number(period);
  }
  return values;
}

function checkAttempt(values) {
  if (values.opponentNumber && !/^\d{1,2}$/.test(values.opponentNumber)) return 'The opponent’s jersey number should be 0 to 99, or left blank.';
  if (!ATTEMPT_RESULTS[values.result]) return 'Choose the result.';
  return null;
}

async function openPenaltyShot(game, penaltyShotId) {
  const existing = penaltyShotId && state.penaltyShots.find(p => p.id === penaltyShotId);
  const attempt = existing || { period: state.entry.period, team: 'us', shooterId: null, opponentNumber: null, result: '' };
  let values;
  const buttons = existing
    ? [{ label: 'Delete', value: 'delete', kind: 'danger' }, { label: 'Cancel', value: 'cancel', push: true }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }]
    : [{ label: 'Cancel', value: 'cancel' }, { label: 'Add', value: 'save', kind: 'primary', check: true, isDefault: true }];
  const choice = await showDialog({
    title: existing ? 'Edit penalty shot' : 'Add penalty shot',
    body: attemptFormHtml(game, attempt, { withPeriodAndTeam: true }),
    buttons,
    onOpen: (form) => wireAttemptForm(form),
    onSubmit: (value, form) => { values = readAttemptForm(form); return checkAttempt(values); },
  });
  if (choice === 'delete') return deletePenaltyShot(existing.id);
  if (choice !== 'save') return;
  await saveRecord('penaltyShots', existing
    ? { ...existing, ...values }
    : { id: newId(), gameId: game.id, ...values, createdAt: new Date().toISOString() });
  renderKeepingFocus();
  showToast(existing ? 'Penalty shot saved.' : 'Penalty shot added.');
}

async function deletePenaltyShot(penaltyShotId) {
  if (!await confirmDialog('Delete penalty shot?', 'Delete this penalty shot? This can’t be undone.', 'Delete')) return;
  await deleteRecord('penaltyShots', penaltyShotId);
  renderKeepingFocus();
  showToast('Penalty shot deleted.');
}

// Shootout attempts, in the order they were taken.
function shootoutAttempts(gameId) {
  return state.shootoutAttempts.filter(a => a.gameId === gameId).sort((a, b) => a.round - b.round || byEntryOrder(a, b));
}

// Who shoots next: teams alternate, starting with whoever shot first.
function nextShootoutTurn(game) {
  const first = game.shootoutFirst || 'us';
  const second = first === 'us' ? 'them' : 'us';
  const last = shootoutAttempts(game.id).pop();
  if (!last) return { round: 1, team: first };
  if (last.team === first) return { round: last.round, team: second };
  return { round: last.round + 1, team: first };
}

function renderShootoutCard(game) {
  if (!game.shootout) {
    return `<div class="card" id="shootout">
        <h2>Shootout</h2>
        <p class="muted">The shootout is switched off for this game. If the game went to a shootout, switch it on in Game details.</p>
        <div class="row"><button type="button" class="btn" data-action="open-game-details">Open game details</button></div>
      </div>`;
  }
  const attempts = shootoutAttempts(game.id);
  const score = shootoutScore(game);
  const first = game.shootoutFirst || 'us';
  const us = escapeHtml(ourTeamName()), them = escapeHtml(opponentName(game));
  const result = gameResult(game);
  const rounds = [...new Set(attempts.map(a => a.round))];
  const cell = (round, team) => {
    const a = attempts.find(x => x.round === round && x.team === team);
    return a ? `<td><button type="button" class="attempt-cell" data-action="edit-attempt" data-id="${escapeHtml(a.id)}" title="Edit this attempt">
        ${attemptResultTag(a.result)}<span>${attemptShooterText(a)}</span></button></td>` : '<td class="muted">–</td>';
  };
  const order = first === 'us' ? ['us', 'them'] : ['them', 'us'];
  const names = { us, them };

  return `<div class="card" id="shootout">
      <div class="card-head">
        <h2>Shootout</h2>
        <p class="shootout-score"><strong>${us} ${score.us} – ${score.them} ${them}</strong>
          ${result === 'SOW' || result === 'SOL' ? resultBadge(result) : attempts.length ? '<span class="tag">Not decided yet</span>' : ''}</p>
      </div>
      <p class="muted small">Shootout goals don’t count toward the game score or players’ goal totals.</p>
      <div class="control" style="margin:12px 0">
        <span class="control-label">Shot first</span>
        <div class="toggle-group">
          ${['us', 'them'].map(team => `<button type="button" class="toggle ${first === team ? 'on' : ''}" aria-pressed="${first === team}" data-action="shootout-first" data-value="${team}" ${attempts.length ? 'disabled' : ''}>${names[team]}</button>`).join('')}
        </div>
        ${attempts.length ? '<span class="hint">Can be changed only before any attempts are entered.</span>' : ''}
      </div>
      ${attempts.length ? `<div class="table-scroll"><table class="simple shootout-table">
          <tr><th>Round</th><th>${names[order[0]]}</th><th>${names[order[1]]}</th></tr>
          ${rounds.map(r => `<tr><td>${r}</td>${cell(r, order[0])}${cell(r, order[1])}</tr>`).join('')}
        </table></div>` : ''}
      <div class="entry-panel next-attempt">${renderNextAttempt(game)}</div>
    </div>`;
}

function renderNextAttempt(game) {
  const turn = nextShootoutTurn(game);
  const pending = state.entry.shootoutShooter;   // our shooter chosen, waiting for the result
  // Decided after a full round: say so, but still allow more attempts (the app doesn't know the league's number of rounds).
  const score = shootoutScore(game);
  const attemptsSoFar = shootoutAttempts(game.id);
  const fullRounds = attemptsSoFar.length > 0 && turn.team === (game.shootoutFirst || 'us') && pending === undefined;
  const decidedNote = fullRounds && score.us !== score.them
    ? `<p class="notice decided">The shootout is decided: ${escapeHtml(score.us > score.them ? ourTeamName() : opponentName(game))} won ${Math.max(score.us, score.them)}–${Math.min(score.us, score.them)}. Only add more attempts if it kept going.</p>` : '';
  const teamName = escapeHtml(turn.team === 'us' ? ourTeamName() : opponentName(game));
  const attempts = shootoutAttempts(game.id);
  const undo = attempts.length ? `<button type="button" class="btn" data-action="undo-attempt">Undo last attempt</button>` : '';
  const resultButtons = `<div class="result-buttons row-layout">${Object.entries(ATTEMPT_RESULTS).map(([key, label]) =>
    `<button type="button" class="result-btn ${key}" data-action="pick-attempt-result" data-value="${key}"><span>${label}</span></button>`).join('')}</div>`;

  if (turn.team === 'us' && pending === undefined) {
    return `${decidedNote}<h3>Round ${turn.round}: ${teamName} shooter</h3>
      <div class="jersey-grid">${entryPlayers().map(p => `<button type="button" class="jersey-btn" data-action="pick-attempt-shooter" data-id="${escapeHtml(p.id)}" title="${escapeHtml(p.name)}">
          <strong>${escapeHtml(p.number)}</strong><span>${escapeHtml(p.name)}</span></button>`).join('')}</div>
      <div class="panel-actions"><button type="button" class="btn" data-action="pick-attempt-shooter" data-id="">Not recorded</button>${undo}</div>`;
  }
  if (turn.team === 'us') {
    return `<h3>Round ${turn.round}: ${pending ? escapeHtml(playerLabel(pending)) : 'Shooter not recorded'}</h3>
      ${resultButtons}
      <div class="panel-actions"><button type="button" class="btn" data-action="back-to-attempt-shooter">Back</button></div>`;
  }
  return `${decidedNote}<h3>Round ${turn.round}: ${teamName} shooter</h3>
    <label class="field"><span>Jersey number (optional)</span>
      <input type="text" id="so-opponent-number" inputmode="numeric" maxlength="2" autocomplete="off" style="max-width:120px"></label>
    ${resultButtons}
    <div class="panel-actions">${undo}</div>`;
}

async function saveShootoutAttempt(game, result) {
  const turn = nextShootoutTurn(game);
  let opponentNumber = null;
  if (turn.team === 'them') {
    opponentNumber = (document.getElementById('so-opponent-number') || { value: '' }).value.trim() || null;
    if (opponentNumber && !/^\d{1,2}$/.test(opponentNumber)) return showMessage('Check that entry', 'The opponent’s jersey number should be 0 to 99, or left blank.');
  }
  await saveRecord('shootoutAttempts', {
    id: newId(), gameId: game.id, round: turn.round, team: turn.team,
    shooterId: turn.team === 'us' ? (state.entry.shootoutShooter || null) : null,
    opponentNumber, result, createdAt: new Date().toISOString(),
  });
  state.entry.shootoutShooter = undefined;
  renderKeepingFocus();
}

async function undoLastAttempt(game) {
  const last = shootoutAttempts(game.id).pop();
  if (!last) return;
  await deleteRecord('shootoutAttempts', last.id);
  state.entry.shootoutShooter = undefined;
  renderKeepingFocus();
  showToast('Last attempt removed.');
}

async function openEditAttempt(game, attemptId) {
  const attempt = state.shootoutAttempts.find(a => a.id === attemptId);
  let values;
  const choice = await showDialog({
    title: `Edit round ${attempt.round}: ${attempt.team === 'us' ? ourTeamName() : opponentName(game)}`,
    body: attemptFormHtml(game, attempt, { withPeriodAndTeam: false }),
    buttons: [{ label: 'Cancel', value: 'cancel' }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }],
    onOpen: (form) => wireAttemptForm(form, attempt.team),
    onSubmit: (value, form) => { values = readAttemptForm(form, attempt.team); return checkAttempt(values); },
  });
  if (choice !== 'save') return;
  await saveRecord('shootoutAttempts', { ...attempt, ...values });
  renderKeepingFocus();
  showToast('Attempt saved.');
}

async function saveGameField(input) {
  const game = findGame(state.routeId);
  if (!game) return;
  const updated = JSON.parse(JSON.stringify(game));
  const inherited = inheritedSettings(game);
  const field = input.dataset.gameField;
  const refuse = (message) => { renderKeepingFocus(); showMessage('Check that entry', message); };

  if (field === 'periodLength') {
    const n = Number(input.value);
    if (!Number.isInteger(n) || n < 1 || n > 60) return refuse('Period length must be a whole number of minutes, from 1 to 60.');
    updated.periodLength = n === inherited.periodLength ? null : n;
  } else if (field === 'clockType') {
    updated.clockType = input.value === inherited.clockType ? null : input.value;
  } else if (field === 'overtimeOn') {
    if (!input.checked) {
      const inOvertime = state.shots.filter(r => r.gameId === game.id && r.period === 'OT').length +
                         state.penaltyShots.filter(r => r.gameId === game.id && r.period === 'OT').length;
      if (inOvertime) {
        return refuse(`This game has ${inOvertime} ${inOvertime === 1 ? 'entry' : 'entries'} in overtime (shots or penalty shots). Move them to another period or delete them before turning overtime off.`);
      }
    }
    updated.overtime.on = input.checked;
  } else if (field === 'overtimeLength') {
    const n = Number(input.value);
    if (!Number.isInteger(n) || n < 1 || n > 30) return refuse('Overtime length must be a whole number of minutes, from 1 to 30.');
    // If "played" was the full length (or is now too long), keep it matching the new length.
    if (updated.overtime.played === updated.overtime.length || updated.overtime.played > n) updated.overtime.played = n;
    updated.overtime.length = n;
  } else if (field === 'overtimePlayed') {
    const n = parseMinutes(input.value);
    if (!(n >= 0) || n > updated.overtime.length) {
      return refuse(`Overtime minutes played must be from 0 to ${updated.overtime.length}. Minutes and seconds work too, like 2:30.`);
    }
    updated.overtime.played = Math.round(n * 60) / 60;
  } else if (field === 'shootout') {
    const attempts = state.shootoutAttempts.filter(r => r.gameId === game.id).length;
    if (!input.checked && attempts) {
      return refuse(`This game has ${attempts} shootout ${attempts === 1 ? 'attempt' : 'attempts'}. Delete them before turning the shootout off.`);
    }
    updated.shootout = input.checked;
  } else if (field === 'result') {
    updated.result = input.value === 'auto' ? null : input.value;
  } else if (field === 'officialUs' || field === 'officialThem') {
    const text = input.value.trim();
    const n = text === '' ? null : Number(text);
    if (n !== null && (!Number.isInteger(n) || n < 0 || n > 99)) return refuse('A score must be a whole number, like 3.');
    const official = { us: null, them: null, ...(updated.officialScore || {}) };
    official[field === 'officialUs' ? 'us' : 'them'] = n;
    updated.officialScore = (official.us === null && official.them === null) ? null : official;
  } else if (field === 'notes') {
    updated.notes = input.value.trim();
  }

  if (JSON.stringify(updated) === JSON.stringify(game)) return;
  await saveRecord('games', updated);
  renderKeepingFocus();

}

async function resetGameField(field) {

/* ----- Adding and editing games ----- */

function gameFormHtml(game) {
  const opponents = state.opponents.filter(o => o.active || o.id === game.opponentId).sort(byName);
  const noOpponents = opponents.length === 0;
  const opponentOptions = '<option value="">Choose…</option>' +
    opponents.map(o => `<option value="${escapeHtml(o.id)}" ${o.id === game.opponentId ? 'selected' : ''}>${escapeHtml(o.name)}</option>`).join('') +
    `<option value="new" ${noOpponents ? 'selected' : ''}>+ New opponent…</option>`;
  const tournaments = [...state.tournaments].sort((a, b) => tournamentDate(b).localeCompare(tournamentDate(a)) || byName(a, b));
  const typeOptions = `<option value="regular" ${game.type === 'regular' ? 'selected' : ''}>Regular season</option>` +
    tournaments.map(t => `<option value="${escapeHtml(t.id)}" ${game.type === 'tournament' && game.tournamentId === t.id ? 'selected' : ''}>Tournament: ${escapeHtml(t.name)}</option>`).join('');
  return `<div class="form-grid">
      <label class="field"><span>Date</span><input type="date" name="date" value="${escapeHtml(game.date || '')}"></label>
      <label class="field"><span>Time (optional)</span><input type="time" name="time" value="${escapeHtml(game.time || '')}"></label>
    </div>
    <label class="field" style="margin-top:14px"><span>Opponent</span><select name="opponent">${opponentOptions}</select></label>
    <label class="field" data-new-opponent ${noOpponents ? '' : 'hidden'}><span>New opponent’s name</span>
      <input type="text" name="newOpponent" maxlength="50" autocomplete="off"></label>
    <label class="field"><span>Game type</span><select name="gameType">${typeOptions}</select></label>`;
}

// Show the "new opponent" box only when "+ New opponent…" is chosen.
function wireGameForm(form) {
  const select = form.elements.namedItem('opponent');
  const newField = form.querySelector('[data-new-opponent]');
  select.addEventListener('change', () => {
    newField.hidden = select.value !== 'new';
    if (!newField.hidden) form.elements.namedItem('newOpponent').focus();
  });
}

function readGameForm(form) {
  const f = form.elements;
  const typeValue = f.namedItem('gameType').value;
  return {
    date: f.namedItem('date').value,
    time: f.namedItem('time').value,
    opponentId: f.namedItem('opponent').value,
    newOpponentName: f.namedItem('newOpponent').value.trim().replace(/\s+/g, ' '),
    type: typeValue === 'regular' ? 'regular' : 'tournament',
    tournamentId: typeValue === 'regular' ? null : typeValue,
  };
}

function checkGame(values) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(values.date)) return 'Choose the date of the game.';
  if (!values.opponentId) return 'Choose the opponent.';
  if (values.opponentId === 'new') {
    const problem = checkOpponent({ name: values.newOpponentName }, null);
    if (problem) return problem.startsWith('There’s already') ? problem + ' Choose it from the list instead.' : problem;
  }
  return null;
}

// The changes needed to save a game, including a new opponent if one was typed in.
function gameChanges(game, values) {
  const changes = [];
  let opponentId = values.opponentId;
  if (opponentId === 'new') {
    const opponent = { id: newId(), name: values.newOpponentName, active: true };
    changes.push({ store: 'opponents', put: opponent });
    opponentId = opponent.id;
  }
  changes.push({ store: 'games', put: {
    ...game, date: values.date, time: values.time, opponentId, type: values.type, tournamentId: values.tournamentId,
  } });
  return changes;
}

function newGame(defaults) {
  return {
    id: newId(), date: '', time: '', opponentId: '', type: 'regular', tournamentId: null,
    periodLength: null, clockType: null,
    overtime: { on: false, length: DEFAULT_OVERTIME_LENGTH, played: DEFAULT_OVERTIME_LENGTH },
    shootout: false, shootoutFirst: 'us', result: null, officialScore: null, notes: '', specialTeams: emptySpecialTeams(),
    ...defaults,
  };
}

async function openAddGame(defaults) {
  const game = newGame(defaults);
  let values;
  const choice = await showDialog({
    title: 'Add game',
    body: gameFormHtml(game),
    buttons: [
      { label: 'Cancel', value: 'cancel' },
      { label: 'Save and add another', value: 'again', check: true },
      { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true },
    ],
    onSubmit: (value, form) => { values = readGameForm(form); return checkGame(values); },
    onOpen: wireGameForm,
  });
  if (choice !== 'save' && choice !== 'again') return;
  const changes = gameChanges(game, values);
  await saveChanges(changes);
  const saved = changes[changes.length - 1].put;
  showToast(`Added game vs ${opponentName(saved)}.`);
  if (choice === 'again') {
    render();
    openAddGame({ type: saved.type, tournamentId: saved.tournamentId, date: saved.date });
  } else {
    go('game', saved.id);
  }
}

async function openEditGame(gameId) {
  const game = findGame(gameId);
  const counts = gameStatCounts(gameId);
  let values;
  const choice = await showDialog({
    title: 'Edit game',
    body: gameFormHtml(game),
    buttons: [
      { label: 'Delete game', value: 'delete', kind: 'danger' },
      { label: 'Cancel', value: 'cancel', push: true },
      { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true },
    ],
    onSubmit: (value, form) => { values = readGameForm(form); return checkGame(values); },
    onOpen: wireGameForm,
  });
  if (choice === 'save') {
    await saveChanges(gameChanges(game, values));
    renderKeepingFocus();
    showToast('Saved.');
  } else if (choice === 'delete') {
    await deleteGames([game], `Delete the game vs ${opponentName(game)} on ${formatGameDate(game.date)}?`);
  }
}

function statCountText(counts) {
  const parts = [];
  if (counts.shots) parts.push(`${counts.shots} ${counts.shots === 1 ? 'shot' : 'shots'}`);
  if (counts.faceoffs) parts.push(`${counts.faceoffs} ${counts.faceoffs === 1 ? 'faceoff' : 'faceoffs'}`);
  if (counts.penaltyShots) parts.push(`${counts.penaltyShots} ${counts.penaltyShots === 1 ? 'penalty shot' : 'penalty shots'}`);
  if (counts.shootoutAttempts) parts.push(`${counts.shootoutAttempts} shootout ${counts.shootoutAttempts === 1 ? 'attempt' : 'attempts'}`);
  return parts.join(', ');
}

// Delete games and every stat recorded in them. Asks first; if stats would be lost, DELETE must be typed.
async function deleteGames(games, question, extraChanges = []) {
  const ids = new Set(games.map(g => g.id));
  const totals = { shots: 0, faceoffs: 0, penaltyShots: 0, shootoutAttempts: 0 };
  for (const game of games) {
    const counts = gameStatCounts(game.id);
    for (const key in totals) totals[key] += counts[key];
  }
  const statText = statCountText(totals);
  const confirmed = await showDialog({
    title: 'Are you sure?',
    body: `<p>${escapeHtml(question)}</p>
      ${statText ? `<p><strong>This also deletes ${escapeHtml(statText)}.</strong> This can’t be undone.</p><p>To confirm, type <strong>DELETE</strong> below.</p>`
                 : '<p>This can’t be undone.</p>'}`,
    requireText: statText ? 'DELETE' : undefined,
    buttons: [{ label: 'Cancel', value: false }, { label: 'Delete', value: true, kind: 'danger solid', needsText: !!statText, isDefault: true }],
  });
  if (!confirmed) return false;
  const changes = [...extraChanges, ...games.map(g => ({ store: 'games', remove: g.id }))];
  for (const store of ['shots', 'faceoffs', 'penaltyShots', 'shootoutAttempts']) {
    for (const record of state[store]) if (ids.has(record.gameId)) changes.push({ store, remove: record.id });
  }
  await saveChanges(changes);
  showToast('Deleted.');
  const game = games[0];
  if (state.screen === 'game') go(game && game.type === 'tournament' && findTournament(game.tournamentId) ? 'tournament' : 'games', game && game.tournamentId);
  else if (state.screen === 'tournament' && !findTournament(state.routeId)) go('games');
  else render();
  return true;
}

function tournamentFormHtml(tournament) {
  const clockOptions = Object.entries(CLOCK_TYPES).map(([key, label]) =>
    `<option value="${key}" ${tournament.clockType === key ? 'selected' : ''}>${label}</option>`).join('');

    <div class="form-grid">
      <label class="field"><span>Location (optional)</span>

      <label class="field"><span>Start date (optional)</span>

function readTournamentForm(form) {
  const f = form.elements;
  return {
    name: f.namedItem('tournamentName').value.trim().replace(/\s+/g, ' '),
    location: f.namedItem('location').value.trim(),
    startDate: f.namedItem('startDate').value,
    periodLength: Number(f.namedItem('periodLength').value),
    clockType: f.namedItem('clockType').value,
  };
}

function checkTournament(values, tournamentId) {
  if (!values.name) return 'Enter the tournament’s name.';
  const clash = state.tournaments.find(t => t.id !== tournamentId && t.name.toLowerCase() === values.name.toLowerCase());
  if (clash) return `There’s already a tournament called ${clash.name}.`;
  if (!Number.isInteger(values.periodLength) || values.periodLength < 1 || values.periodLength > 60) {
    return 'Period length must be a whole number of minutes, from 1 to 60.';
  }
  return null;
}

async function openAddTournament() {
  let values;
  const choice = await showDialog({
    title: 'Add tournament',
    body: tournamentFormHtml({ periodLength: state.settings.periodLength, clockType: 'unknown' }),
    buttons: [{ label: 'Cancel', value: 'cancel' }, { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true }],
    onSubmit: (value, form) => { values = readTournamentForm(form); return checkTournament(values, null); },
  });
  if (choice !== 'save') return;
  const tournament = { id: newId(), ...values };
  await saveRecord('tournaments', tournament);
  showToast(`Added ${tournament.name}.`);

}

async function openEditTournament(tournamentId) {
  const tournament = findTournament(tournamentId);
  let values;
  const choice = await showDialog({
    title: 'Edit tournament',
    body: tournamentFormHtml(tournament),
    buttons: [
      { label: 'Delete tournament', value: 'delete', kind: 'danger' },
      { label: 'Cancel', value: 'cancel', push: true },
      { label: 'Save', value: 'save', kind: 'primary', check: true, isDefault: true },
    ],
    onSubmit: (value, form) => { values = readTournamentForm(form); return checkTournament(values, tournament.id); },
  });
  if (choice === 'save') {
    await saveRecord('tournaments', { ...tournament, ...values });

    await deleteGames(games, question, [{ store: 'tournaments', remove: tournament.id }]);
  }
}

/* ----- Game report (to print, or save as a PDF to send) ----- */

// The report's heat map is lighter than the Stats screen's (0.9), so rink lines, dots, and goals stay easy to read on paper.
const REPORT_HEAT_STRENGTH = 0.6;

// What the report includes; switched on the report screen and remembered in this browser.
const REPORT_OPTIONS_KEY = `${STORAGE_PREFIX}:report`;
function reportOptions() {
  if (!state.reportOptions) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(REPORT_OPTIONS_KEY) || '{}'); } catch (err) { saved = {}; }
    state.reportOptions = { players: true, faceoffs: true, sheet: true, notes: false, mapStyle: 'both', heatColours: 'green', ...saved };
  }
  return state.reportOptions;
}
function setReportOption(name, value) {
  reportOptions()[name] = value;
  try { localStorage.setItem(REPORT_OPTIONS_KEY, JSON.stringify(state.reportOptions)); } catch (err) { /* fine */ }
  renderKeepingFocus();
}

// The file name Chrome suggests when saving as a PDF comes from the page title.
function reportTitle(game) {
  return `${ourTeamName()} vs ${opponentName(game)}, ${shortGameLabel(game).split(' vs ')[0]}`;
}

function renderReportScreen() {
  const game = findGame(state.routeId);
  const options = reportOptions();
  const check = (name, label) => `<label class="report-option"><input type="checkbox" data-report-option="${name}" ${options[name] ? 'checked' : ''}> ${label}</label>`;
  const choice = (name, value, label, disabled) => `<button type="button" class="toggle ${options[name] === value ? 'on' : ''}" aria-pressed="${options[name] === value}"
      data-action="report-choice" data-field="${name}" data-value="${value}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  return `<div class="report-controls">
      <a class="back" href="#game/${escapeHtml(game.id)}">‹ Back to the game</a>
      <div class="report-toolbar card">
        <div>
          <h1>Game report</h1>
          <p class="muted small">In the print window, choose <strong>Save as PDF</strong> as the destination to make a file you can send to the team.</p>
          <div class="report-option-row">${check('sheet', 'Include scoring summary and penalties')}${check('players', 'Include player stats')}${check('faceoffs', 'Include faceoffs by player')}${check('notes', 'Include game notes')}</div>
          <div class="report-option-row">
            <div class="control"><span class="control-label">Shot maps</span>
              <div class="toggle-group">${choice('mapStyle', 'dots', 'Dots')}${choice('mapStyle', 'heat', 'Heat map')}${choice('mapStyle', 'both', 'Both')}</div></div>
            <div class="control ${options.mapStyle === 'dots' ? 'off' : ''}"><span class="control-label">Heat colours</span>
              <div class="toggle-group">${choice('heatColours', 'green', '<span class="swatch green"></span>Green', options.mapStyle === 'dots')}${choice('heatColours', 'blue', '<span class="swatch blue"></span>Blue', options.mapStyle === 'dots')}${choice('heatColours', 'warm', '<span class="swatch warm"></span>Yellow to red', options.mapStyle === 'dots')}</div></div>
          </div>
        </div>
        <button type="button" class="btn primary" data-action="print-report">Print or save as PDF</button>
      </div>
    </div>
    ${renderReport(game, options)}`;
}

function renderReport(game, options) {
  const tournament = game.type === 'tournament' ? findTournament(game.tournamentId) : null;
  const usName = ourTeamName(), themName = opponentName(game);
  const hasStats = gameHasStats(game.id);
  const minutes = gameMinutesPlayed(game);
  const shots = gameShots(game.id);
  const ours = shotSummary(shots.filter(s => s.team === 'us'), minutes);
  const theirs = shotSummary(shots.filter(s => s.team === 'them'), minutes);
  const score = gameScore(game);
  const result = gameResult(game);
  const so = shootoutScore(game);
  const st = gameSpecialTeams(game);
  const faceoffs = state.faceoffs.filter(f => f.gameId === game.id);
  const foWins = faceoffs.filter(f => f.result === 'win').length;
  const periods = game.overtime.on ? PERIODS : PERIODS.slice(0, 3);
  const when = [formatGameDate(game.date), formatTime(game.time), tournament ? tournament.name : 'Regular season'].filter(Boolean).map(escapeHtml).join(' · ');

  if (!hasStats) {
    return `<article class="report"><header class="report-head"><h2>${escapeHtml(usName)} vs ${escapeHtml(themName)}</h2><p>${when}</p></header>
      <p class="muted">No stats have been entered for this game yet.</p></article>`;
  }

  // Paired bars: ours grows left from the middle, theirs grows right. Our team in blue, theirs in grey.
  const pair = (label, a, b, format = String) => {
    const max = Math.max(a, b, 1);
    return `<div class="pair-row">
        <span class="pair-value us">${format(a)}</span>
        <span class="pair-bar us"><span style="width:${Math.round(100 * a / max)}%"></span></span>
        <span class="pair-label">${label}</span>
        <span class="pair-bar them"><span style="width:${Math.round(100 * b / max)}%"></span></span>
        <span class="pair-value them">${format(b)}</span>
      </div>`;
  };
  const line = (label, a, b) => `<div class="pair-row text-only"><span class="pair-value us">${a}</span><span></span><span class="pair-label">${label}</span><span></span><span class="pair-value them">${b}</span></div>`;
  const pctText = (part, whole) => whole ? `${Math.round(100 * part / whole)}%` : '–';
  // With the success rate beside the counts, as on the game screen: "1 of 4 · 25%", "Killed 2 of 3 · 67%".
  const ppText = (goals, chances) => chances == null ? '–' : `${goals || 0} of ${chances} · ${pctText(goals || 0, chances)}`;
  const pkText = (against, times) => {
    if (times == null) return '–';
    const killed = Math.max(0, times - (against || 0));
    return `Killed ${killed} of ${times} · ${pctText(killed, times)}`;
  };

  const comparison = `
    ${pair('Shots on goal', ours.onGoal, theirs.onGoal)}
    ${pair('Grade A shots', ours.gradeA, theirs.gradeA)}
    ${pair('Shot attempts', ours.attempts, theirs.attempts)}
    ${faceoffs.length ? pair('Faceoffs won', foWins, faceoffs.length - foWins, (n) => `${n} · ${pctText(n, faceoffs.length)}`) : ''}
    ${line('Scoring %', pctText(ours.goals, ours.onGoal), pctText(theirs.goals, theirs.onGoal))}
    ${line('Shooting %', pctText(ours.onGoal, ours.attempts), pctText(theirs.onGoal, theirs.attempts))}
    ${st.ppOpportunities != null || st.pkTimes != null ? line('Power play', ppText(st.ppGoals, st.ppOpportunities), ppText(st.pkGoalsAgainst, st.pkTimes)) : ''}
    ${st.ppOpportunities != null || st.pkTimes != null ? line('Penalty kill', pkText(st.pkGoalsAgainst, st.pkTimes), pkText(st.ppGoals, st.ppOpportunities)) : ''}`;

  // Shot maps: dots and goal diamonds (a single game has too few shots for a heat map).
  const showHeat = options.mapStyle === 'heat' || options.mapStyle === 'both';
  const showDots = options.mapStyle === 'dots' || options.mapStyle === 'both';
  const grids = { us: densityGrid(shots.filter(s => s.team === 'us')), them: densityGrid(shots.filter(s => s.team === 'them')) };
  const heatMax = Math.max(0, ...Object.values(grids).map(g => g.reduce((m, v) => Math.max(m, v), 0)));
  const ramp = HEAT_RAMPS[options.heatColours] || HEAT_RAMPS.green;
  const map = (team) => {
    const list = shots.filter(s => s.team === team && s.x != null);
    const marks = showDots ? list : list.filter(s => s.result === 'goal');   // heat map only: goals still shown
    const dots = [...marks].sort((a, b) => (a.result === 'goal') - (b.result === 'goal')).map(s => statDot(s, game)).join('');
    const noLocation = shots.filter(s => s.team === team && s.x == null).length;
    const heat = showHeat && heatMax > 0
      ? `<image href="${heatMapImage(grids[team], heatMax, ramp, REPORT_HEAT_STRENGTH)}" x="0" y="0" width="${RINK_W}" height="${RINK_H}" preserveAspectRatio="none" class="heat"/>` : '';
    return `<figure class="report-map">
        <figcaption>${escapeHtml(team === 'us' ? usName : themName)} shots</figcaption>
        ${rinkSvg(`<g class="stat-dots">${dots}</g>`, { label: `${team === 'us' ? usName : themName} shot map`, underlay: heat })}
        ${noLocation ? `<span class="muted small">${noLocation} more with no location</span>` : ''}
      </figure>`;
  };

  const byPeriod = (team, test) => periods.map(p => shots.filter(s => s.team === team && s.period === p && test(s)).length);
  const periodRows = [
    ['Shots on goal', isOnGoal], ['Goals', s => s.result === 'goal'],
  ].map(([label, test]) => ['us', 'them'].map(team => {
    const counts = byPeriod(team, test);
    return `<tr><td>${escapeHtml(team === 'us' ? usName : themName)} ${label.toLowerCase()}</td>${counts.map(c => `<td class="num">${c}</td>`).join('')}<td class="num"><strong>${counts.reduce((a, b) => a + b, 0)}</strong></td></tr>`;
  }).join('')).join('');

  // Our players: anyone with a shot, or a goal or assist on the game sheet.
  // Goals and assists come from the game sheet when it has goals entered; otherwise goals come from the shots.
  const ourShots = shots.filter(s => s.team === 'us');
  const sheet = gameSheet(game);
  const useSheet = sheet.goals.length > 0;
  const points = sheetPoints(game);
  const playerIds = [...new Set([...ourShots.map(s => s.shooterId).filter(Boolean), ...(useSheet ? points.keys() : [])])];
  const players = sortByNumber(playerIds.map(findPlayer).filter(Boolean));
  const unrecorded = ourShots.filter(s => !s.shooterId);
  const playerRow = (name, list, playerId) => {
    const p = points.get(playerId) || { goals: 0, assists: 0 };
    const goals = useSheet ? (playerId ? p.goals : '–') : list.filter(s => s.result === 'goal').length;
    return `<tr><td>${name}</td><td class="num">${goals}</td>
      ${useSheet ? (playerId ? `<td class="num">${p.assists}</td><td class="num"><strong>${p.goals + p.assists}</strong></td>` : '<td class="num">–</td><td class="num">–</td>') : ''}
      <td class="num">${list.filter(isOnGoal).length}</td><td class="num">${list.filter(isGradeAShot).length}</td></tr>`;
  };
  const playerTable = options.players && (players.length || unrecorded.length) ? `
    <section class="report-section avoid-break">
      <h3>Our players</h3>
      <table class="simple report-table players">
        <colgroup><col>${useSheet ? '<col style="width:11%"><col style="width:11%"><col style="width:11%">' : '<col style="width:13%">'}<col style="width:16%"><col style="width:16%"></colgroup>
        <tr><th>Player</th><th class="num">Goals</th>${useSheet ? '<th class="num">Assists</th><th class="num">Points</th>' : ''}<th class="num">Shots on goal</th><th class="num">Grade A shots</th></tr>
        ${players.map(p => playerRow(`<span class="jersey-inline">#${escapeHtml(p.number)}</span> ${escapeHtml(p.name)}`, ourShots.filter(s => s.shooterId === p.id), p.id)).join('')}
        ${unrecorded.length ? playerRow('<span class="muted">Shooter not recorded</span>', unrecorded, null) : ''}
      </table>
      ${useSheet ? '<p class="report-note muted">Goals and assists are from the game sheet.</p>' : ''}
    </section>` : '';

  // Faceoffs by player: most faceoffs first, with a team total.
  const foRows = sortByNumber([...new Set(faceoffs.map(f => f.playerId))].map(findPlayer).filter(Boolean)).map(p => {
    const w = faceoffs.filter(f => f.playerId === p.id && f.result === 'win').length;
    const l = faceoffs.filter(f => f.playerId === p.id && f.result === 'loss').length;
    return { p, w, l, t: w + l };
  }).sort((a, b) => b.t - a.t || b.w - a.w);
  const foPct = (w, t) => t ? `${w} of ${t} · ${Math.round(100 * w / t)}%` : '–';
  const faceoffTable = options.faceoffs && foRows.length ? `
    <section class="report-section avoid-break">
      <h3>Faceoffs</h3>
      <table class="simple report-table faceoffs">
        <colgroup><col><col style="width:13%"><col style="width:13%"><col style="width:24%"></colgroup>
        <tr><th>Player</th><th class="num">Won</th><th class="num">Lost</th><th class="num">Won %</th></tr>
        ${foRows.map(r => `<tr><td><span class="jersey-inline">#${escapeHtml(r.p.number)}</span> ${escapeHtml(r.p.name)}</td><td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${foPct(r.w, r.t)}</td></tr>`).join('')}
        <tr class="total-row"><td>Team</td><td class="num">${foWins}</td><td class="num">${faceoffs.length - foWins}</td><td class="num">${foPct(foWins, faceoffs.length)}</td></tr>
      </table>
    </section>` : '';

  // Scoring summary and penalties from the game sheet, by period, side by side.
  const sheetGoals = [...sheet.goals].sort(sheetOrder), sheetPens = [...sheet.penalties].sort(sheetOrder);
  const teamTag = (team) => `<span class="sheet-team ${team}">${escapeHtml(team === 'us' ? usName : themName)}</span>`;
  const sheetList = (items, line, empty) => {
    const periodsUsed = PERIODS.filter(p => items.some(i => i.period === p));
    if (!periodsUsed.length) return `<p class="muted">${empty}</p>`;
    return periodsUsed.map(p => `<div class="sheet-period">${p === 'OT' ? 'Overtime' : `Period ${p}`}</div>
      ${items.filter(i => i.period === p).map(line).join('')}`).join('');
  };
  const goalLine = (g) => {
    const assists = (g.assists || []).filter(Boolean).map(a => escapeHtml(personLabel(g.team, a)));
    const tags = goalTags(game, g);
    return `<div class="sheet-line"><span class="sheet-time">${escapeHtml(g.time || '')}</span><div>
        <strong>${escapeHtml(personLabel(g.team, g.scorer))}</strong>${tags.length ? ` <span class="sheet-tags">${tags.join(' · ')}</span>` : ''}
        <span class="sheet-sub">${assists.length ? `Assists: ${assists.join(', ')}` : 'Unassisted'}</span>${teamTag(g.team)}</div></div>`;
  };
  const penaltyLine = (pen) => `<div class="sheet-line"><span class="sheet-time">${escapeHtml(pen.time || '')}</span><div>
      <strong>${escapeHtml(personLabel(pen.team, pen.player))}</strong>
      <span class="sheet-sub">${escapeHtml(pen.infraction || 'Infraction not recorded')} – ${escapeHtml(PENALTY_TYPES[pen.type] ? PENALTY_TYPES[pen.type].label : '')}${pen.minutes ? `, ${pen.minutes} min` : ''}</span>${teamTag(pen.team)}</div></div>`;
  const sheetSection = options.sheet && (sheetGoals.length || sheetPens.length) ? `
    <section class="report-section sheet-columns">
      <div><h3>Scoring summary</h3>${sheetList(sheetGoals, goalLine, 'No goals.')}</div>
      <div><h3>Penalties</h3>${sheetList(sheetPens, penaltyLine, 'No penalties.')}</div>
    </section>` : '';

  const resultText = !result ? '' : (result === 'SOW' || result === 'SOL') ? `${RESULTS[result]} (${so.us}–${so.them})` : RESULTS[result];

  return `<article class="report" id="report">
      <header class="report-head">
        <span class="team-logo report-logo" aria-hidden="true"></span>
        <div class="report-title">
          <p class="report-kicker">Game report${state.settings.seasonLabel ? ` · ${escapeHtml(state.settings.seasonLabel)}` : ''}</p>
          <h2>${escapeHtml(usName)} vs ${escapeHtml(themName)}</h2>
          <p class="muted">${when}</p>
        </div>
        <div class="report-score">
          <span class="final">${score.us}–${score.them}</span>
          ${resultText ? `<span class="report-result">${resultText}</span>` : ''}
        </div>
      </header>

      <section class="report-section avoid-break">
        <div class="pair-head"><span class="key us"></span>${escapeHtml(usName)}<span class="spacer"></span>${escapeHtml(themName)}<span class="key them"></span></div>
        ${comparison}
      </section>

      <section class="report-section avoid-break ${showHeat ? heatClasses(options.heatColours) : ''}">
        <div class="report-maps">${map('us')}${map('them')}</div>
        <div class="map-legend report-legend">
          ${showHeat ? `<span class="heat-key"><span class="muted">Fewer</span><span class="heat-bar"></span><span class="muted">More shots</span></span>` : ''}
          ${showDots ? `<span><svg class="key" viewBox="-2 -2 4 4"><circle r="0.85" class="key-onnet"/></svg> On net</span>
          <span><svg class="key" viewBox="-2 -2 4 4"><circle r="0.85" class="key-missed"/></svg> Missed or blocked</span>` : ''}
          <span><svg class="key" viewBox="-2 -2 4 4"><path d="M0,-1.7 L1.7,0 L0,1.7 L-1.7,0 Z" class="key-goal"/></svg> Goal</span>
          <span><svg class="key wide" viewBox="0 0 26 10"><line x1="1" y1="5" x2="25" y2="5" stroke="#243142" stroke-width="2" stroke-dasharray="4 3"/></svg> Grade A area</span>
        </div>
      </section>

      <section class="report-section avoid-break">
        <h3>By period</h3>
        <table class="simple report-table">
          <colgroup><col>${periods.map(() => '<col style="width:11%">').join('')}<col style="width:11%"></colgroup>
          <tr><th></th>${periods.map(p => `<th class="num">${p === 'OT' ? 'Overtime' : `Period ${p}`}</th>`).join('')}<th class="num">Total</th></tr>
          ${periodRows}
        </table>
      </section>

      ${sheetSection || playerTable || faceoffTable ? `<div class="report-details">
        <p class="report-continued">${escapeHtml(usName)} vs ${escapeHtml(themName)} · ${escapeHtml(formatGameDate(game.date))} · continued</p>
        ${sheetSection}
        ${playerTable}
        ${faceoffTable}
      </div>` : ''}

      ${options.notes && game.notes ? `<section class="report-section avoid-break"><h3>Coach’s notes</h3><p class="report-notes">${escapeHtml(game.notes)}</p></section>` : ''}

      <footer class="report-foot muted">Shots on goal are on net plus goals. Scoring % is goals ÷ shots on goal. Shooting % is shots on goal ÷ shot attempts. Grade A shots are shots on goal from the Grade A area.</footer>
    </article>`;
}

/* ----- Stats ----- */

const STATS_VIEWS = {
  shots: 'Shot map',
  faceoffs: 'Faceoffs',
  special: 'Special teams',
  penalties: 'Penalty shots and shootouts',
  compare: 'Tournaments vs. regular season',
};
const FILTERS_KEY = `${STORAGE_PREFIX}:filters`;

// Which filters each view uses. Filters that don't apply are shown switched off, with the reason.
const FILTER_USE = {
  shots: { situation: true, period: true, team: true },
  faceoffs: { situation: false, period: false, team: false,
    note: 'Faceoffs are recorded per game only (no period or situation), and only for our team, so only the Games filter applies here.' },
  special: { situation: false, period: true, team: false,
    note: 'This view is already split into power play and penalty kill and shows both teams, so the Situation and Team filters don’t apply. The Period filter applies to the shot numbers only.' },
  penalties: { situation: false, period: false, team: false,
    note: 'Penalty shots and shootouts are shown for both teams across the chosen games, so only the Games filter applies here.' },
  compare: { situation: true, period: true, team: false },
};

// Filters are remembered in this browser (a convenience only; nothing is lost if they aren't).
function loadFilters() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(FILTERS_KEY) || '{}'); } catch (err) { saved = {}; }
  const filters = { ...DEFAULT_FILTERS, ...saved };
  // Forget a tournament, game, or player that no longer exists.
  if (filters.games.startsWith('t:') && !findTournament(filters.games.slice(2))) filters.games = 'all';
  if (filters.games.startsWith('g:') && !findGame(filters.games.slice(2))) filters.games = 'all';
  if (filters.player !== 'all' && !findPlayer(filters.player)) filters.player = 'all';
  if (!['all', 1, 2, 3, 'OT'].includes(filters.period)) filters.period = 'all';
  return filters;
}

function saveFilters() {
  try { localStorage.setItem(FILTERS_KEY, JSON.stringify(state.filters)); } catch (err) { /* private window: fine */ }
}

function formatRate(value) {
  return value == null ? '–' : value.toFixed(1);
}

function renderStatsScreen() {
  if (!state.filters) state.filters = loadFilters();
  if (!state.statsView) state.statsView = 'shots';
  const view = state.statsView;
  const played = state.games.filter(g => gameHasStats(g.id));
  if (!played.length) {
    return `<h1>Stats</h1>
      <div class="card placeholder"><p class="muted">No games with stats yet. Enter a game’s shots and faceoffs from the Games screen, and they’ll show up here.</p></div>`;
  }
  let content;
  if (view === 'shots') content = renderShotMapView();
  else if (view === 'faceoffs') content = renderFaceoffStatsView();
  else if (view === 'special') content = renderSpecialTeamsView();
  else if (view === 'penalties') content = renderPenaltiesStatsView();
  else content = `<div class="card placeholder"><p class="muted">${STATS_VIEWS[view]} is coming in Phase 11.</p></div>`;

  return `<h1>Stats</h1>
    <div class="tab-bar stats-tabs" role="tablist">
      ${Object.entries(STATS_VIEWS).map(([key, label]) =>
        `<button type="button" role="tab" class="${view === key ? 'on' : ''}" aria-selected="${view === key}" data-action="stats-view" data-value="${key}">${label}</button>`).join('')}
    </div>
    ${renderFilterBar(view)}
    ${content}`;
}

// The shared filter row. Filters that don't apply to the current view are shown but switched off, with a reason.
function renderFilterBar(view) {
  const f = state.filters;
  const use = FILTER_USE[view] || FILTER_USE.shots;
  const played = state.games.filter(g => gameHasStats(g.id));
  const tournaments = [...state.tournaments].filter(t => played.some(g => g.tournamentId === t.id))
    .sort((a, b) => tournamentDate(b).localeCompare(tournamentDate(a)) || byName(a, b));
  const singleGames = [...played].sort(compareGames).reverse();

  const gameOptions = option('all', 'All games') + option('regular', 'Regular season') + option('tournaments', 'All tournaments') +
    (tournaments.length ? `<optgroup label="One tournament">${tournaments.map(t => option(`t:${t.id}`, t.name)).join('')}</optgroup>` : '') +
    `<optgroup label="One game">${singleGames.map(g => option(`g:${g.id}`, `${formatGameDate(g.date)} vs ${opponentName(g)} (${scoreText(g)})`)).join('')}</optgroup>`;
  const toggle = (filter, value, label, disabled) =>

  const anyOvertime = played.some(g => g.overtime.on);
